    slug: uiux-foundation
    name: uiux-foundation
    goal: "全站 UI/UX 底座提升到十分制评分 10 分：组件原语覆盖、动效 token 体系、可访问性机制、评审证据闭环"
    status: in_progress
    depends_on: []
    has_ui: true
