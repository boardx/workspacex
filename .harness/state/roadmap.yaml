# roadmap.yaml — 所有阶段(phase=项目)的单一来源
# new-phase 脚本读写本文件;每个阶段会在 phases/ 下 scaffold 一个目录。
project: undefined
phases:
  - id: "00"
    slug: shared-kernel
    name: 共享内核
    goal: "交付跨模块横切契约：Artifact/Version/Segment/Anchor 模型、Context Pack 装配与引用完整性、两层角色与 RLS 强制隔离。所有业务模块依赖它"
    status: in_progress
    depends_on: []
  - id: "01"
    slug: run-a-project
    name: 能跑完一场项目
    goal: "从进场到产出的完整闭环：身份与邀请、项目蓝本、Skill/Agent 能力平面、模型与 MCP、实时转录、访谈、推演画布、对话、项目文件。⚠ 含两个契约先行项：「报告段落标失效」与「ontology_edges 失效」两个接口虽属 phase-02 的 10-report/09-kg，但被本阶段 22-files/uc-22-4 的删除级联依赖（D-13 已裁定撤回最小切片前置），必须在本阶段以契约桩形式先行交付，否则 UC-22.4 的 AC2 无法达成"
    status: in_progress
    depends_on: ["00"]
    has_ui: true
  - id: "02"
    slug: visible-outcomes
    name: 让推演与成果可见
    goal: "知识图谱与决策树、洞察报告、待办看板、问卷与投票、成果交付"
    status: not_started
    depends_on: ["00", "01"]
    has_ui: true
  - id: "03"
    slug: reuse-and-governance
    name: 跨项目复用与治理
    goal: "组织大脑与知识晋升、客户门户、数字专家、审计合规与数据治理"
    status: not_started
    depends_on: ["00", "02"]
    has_ui: true
  - id: "04"
    slug: digital-expert-interview-studio
    name: 数字专家访谈 Studio
    goal: "独立交付历史访谈、专家快捷对话、五步批量访谈与可追溯探索性报告，不依赖组织决策晋升链"
    status: in_progress
    depends_on: []
    has_ui: true
  - id: "05"
    slug: studio-style-unification
    name: Studio style unification
    goal: "Unify the Research, Interview Studio, and Transcription list-home and create name/tag visual language using the deployed Transcription experience as the reference."
    status: not_started
    depends_on: []
    has_ui: true
  - id: "06"
    slug: deep-research
    name: 深度研究
    goal: "独立维护深度研究模块；参考 backend session/start 调用流程，以 workflowType=deep_research 启动和恢复研究会话，并细化研究方向、大纲、搜索执行、引用和报告 feature_list。"
    status: not_started
    depends_on: ["00"]
    has_ui: true
  - id: "07"
    slug: user-research
    name: 用户访谈
    goal: "独立维护用户访谈模块；参考同一个 backend session/start 调用流程，以 workflowType=user_research 区分访谈研究，并细化访谈对象、问题、执行、发现和报告 feature_list。"
    status: not_started
    depends_on: ["00"]
    has_ui: true
  - id: "08"
    slug: transcription
    name: 转录
    goal: "独立维护转录模块；复用现有 ASR Provider、recording document、recording_segments 与 file-first 物化，细化实时采集、历史管理、导出回流和权限保留期 feature_list。"
    status: not_started
    depends_on: ["00"]
    has_ui: true
  - id: "09"
    slug: survey
    name: 问卷
    goal: "独立维护问卷模块；参考 boardx-dev-template 的问卷系统与现有 /studio/survey 契约，细化资源库、模板、五步工作台、发布回收、分析报告和现场投票 feature_list。"
    status: not_started
    depends_on: ["00"]
    has_ui: true
  - id: "10"
    slug: live-collaboration-orchestration
    name: 现场协作编排
    goal: "四组并行现场协作的编排层：主持台/分组视角切换器、议程环节引擎的现场落地（环节状态条+倒计时+介入告警+下一环节推进）、分组签到、以及把已有能力域（01-run-a-project 的对话/画布/转录、02-visible-outcomes 的知识图谱决策树与看板、06 深度研究、07 用户访谈、08 转录、09 问卷与现场投票）在同一现场协作 Tab 里按角色（引导师/组长/组员/观察者）×视角（全场/分组）组合呈现——本阶段不重造这些能力域各自的领域模型，只做编排、路由与角色可见性"
    status: in_progress
    depends_on: ["00", "01", "02", "06", "07", "08", "09"]
    has_ui: true
  - id: "11"
    slug: research-insight-backend
    name: research-insight-backend
    goal: "补齐 itv/research 域洞察库与结论回流的真实后端（U-8 缺口）：洞察持久化、证据矩阵、结论入库/回流，并让项目工作台「研究洞察」Tab 接上真实聚合投影"
    status: in_progress
    depends_on: ["01"]
    # has_ui: false —— 2026-08-20 人类裁决：本阶段不引入新设计面。U-8 对应的 UI/用例/API
