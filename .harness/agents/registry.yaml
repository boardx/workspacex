  # 邮箱确认后由人类改为其邮箱（门户人类身份映射用）。
  # ⚠ directory_agent_id / token：registry 合并后走接入自助通道领取
  # （ADR-011 P2），或由仓库所有者带外 mint 后经密码管理器/一次性链接交付；
