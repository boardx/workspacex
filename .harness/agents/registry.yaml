# registry.yaml — agent/开发者身份注册表（协调层的授权与归属唯一依据）
# 每个身份：id 唯一；kind 决定权力（coordinator 层可派工/合并，worker 只干活）；
# owner 是人类邮箱（门户按它做"人类身份映射"）。改动走 PR review。
version: 1

developers:
  - email: 2325074+usamshen@users.noreply.github.com
    github: usamshen
    role: maintainer

agents:
  # ── 主协调者（唯一，合并权归它）─────────────────────────────
  - id: coord-main
    active: true
    kind: coordinator
    model: <你计划使用的模型>
    areas: ["*"]
    responsibilities:
      - 全队编排/merge 队列/review 门禁（SOP 见 coordinator-sop.md）

  # ── 控制平面架构协调者（无合并权）────────────────────────────
  - id: coord-architecture
    active: true
    kind: architecture-coordinator
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [harness, docs, adr, agent-protocol]
    reports_to: coord-main
    responsibilities:
      - Harness 与控制平面架构审计
      - Agent 协作协议和 ADR 维护
      - 控制平面文档与实现漂移治理

  # ── 模块协调者示例（按模块清单增删；无合并权，PR 全绿后转交 coord-main）──
  # - id: coord-<模块名>
  #   active: true
  #   kind: module-coordinator
  #   owner: you@example.com
  #   areas: [<模块名>]
  #   reports_to: coord-main

  # ── 开发 agent 示例 ──────────────────────────────────────────
  # - id: dev-<模块名>
  #   active: true
  #   kind: worker
  #   owner: you@example.com
  #   areas: [<模块名>]

  # ── Phase 01 最小集成团队（Directory 运行时身份投影；均无合并权）──────
  - id: dev-platform-baseline
    directory_agent_id: agt_01KZ4MJMCXJBHREEYY1KKMTAMZ
    active: true
    kind: worker
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [platform, database, ci, baseline]
    reports_to: coord-main
    responsibilities:
      - 恢复本地 PostgreSQL 与基础验证的可重复性

  - id: dev-auth
    directory_agent_id: agt_01KZ4MJNA25N94TC8M22FTKHZ4
    active: true
    kind: worker
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [auth, identity, session]
    reports_to: coord-main
    responsibilities:
      - 接通已签核的认证与当前组织真实运行时路径

  - id: dev-ai-runtime
    directory_agent_id: agt_01KZ4MJP6RWPYQHFFT4BNEE5EE
    active: true
    kind: worker
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [ai-runtime, agents, skills]
    reports_to: coord-main
    responsibilities:
      - 接通已签核的 Agent 与 Skill 能力目录运行时路径

  - id: dev-chat-e2e
    directory_agent_id: agt_01KZ4MJQ0FHRJYVJ7MHD5VNPZ1
    active: true
    kind: worker
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [chat, e2e]
    reports_to: coord-main
    responsibilities:
      - 接通 Chat 已签核读路径并维护浏览器到数据库的集成证据

reviewers:
  # 必需 reviewer 路由：required_for 含 "*" 或与 issue 的 area 相交 → 必须出 verdict
  # - id: rev-feature
  #   active: true
  #   kind: reviewer
  #   required_for: ["*"]
  #   emits: review:feature-ok

  - id: rev-feature
    directory_agent_id: agt_01KZ4MJQT2M1GC06J7D34TCWT5
    active: true
    kind: reviewer
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [platform, auth, ai-runtime, chat]
    reports_to: coord-main
    required_for: [platform, auth, ai-runtime, chat]
    emits: review:feature-ok

  - id: rev-e2e
    directory_agent_id: agt_01KZ4MJRKKKE91M6FWMS47MNWY
    active: true
    kind: reviewer
    model: configured-default
    owner: 2325074+usamshen@users.noreply.github.com
    areas: [e2e, release-readiness]
    reports_to: coord-main
    required_for: [e2e, release-readiness]
    emits: review:e2e-ok
