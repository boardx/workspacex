version: 1
status: proposed-design
owner_issue: 436

canonical_sources:
  role_behavior:
    path_glob: .harness/agents/roles/*.yaml
    generated_surfaces:
      claude_code: .claude/agents/<stable-role-id>.md
      codex: .codex/agents/<stable-role-id>.toml
  runtime_role:
    system: PlatformDirectory
    prerequisite_issue: 396
    prerequisite_pr: 402
    kind_enum_source: packages/coord-directory/src/directory.ts#AGENT_KINDS
    checked_projection: .harness/agents/registry.yaml
    stable_role_binding_owner: PlatformDirectory enrollment
  runtime_actor:
    field: directory_agent_id
    format: immutable-directory-ulid

stable_roles:
  - id: coord-main
    kind: coordinator
    merge_authority: true
    dispatch_authority: true
  - id: coord-architecture
    kind: architecture-coordinator
    merge_authority: false
    dispatch_authority: true
  - id: dev-chat-e2e
    kind: worker
    merge_authority: false
    dispatch_authority: false
  - id: dev-ai-runtime
    kind: worker
    merge_authority: false
    dispatch_authority: false
  - id: rev-feature
    kind: reviewer
    merge_authority: false
    dispatch_authority: false
  - id: rev-e2e
    kind: reviewer
    merge_authority: false
    dispatch_authority: false

human_launch:
  claude_code:
    generated_format: markdown-yaml-frontmatter
    project_path: .claude/agents/<stable-role-id>.md
    command: claude --agent <stable-role-id>
  codex:
    generated_format: toml-top-level-agent-fields
    project_path: .codex/agents/<stable-role-id>.toml
    action: open the project in Codex App or CLI and explicitly ask it to use <stable-role-id>

identity_resolution:
  input: [project-slug, stable-role-id]
  canonical_lookup:
    directory_record: active-enrollment-role-binding
    mapping: (project_id, stable_role_id)->agent_id
    uniqueness_boundary: one-active-agent-per-project-and-stable-role
    mutable_agent_name_is_identity_input: false
    owner_is_audit_attribute_not_lookup_key: true
    same_role_different_projects: allowed
    same_project_same_role_different_owners: rejected
    agent_rename_preserves_binding: true
  directory_match_count: exactly-one-active
  validate_fields: [kind, areas, reports_to]
  authenticated_identity_endpoint: scoped-whoami
  output_environment: COORD_AGENT_ID
  output_value: directory-agent-ulid
  fail_closed_on:
    - no-active-directory-match
    - multiple-active-directory-matches
    - role-projection-mismatch
    - retired-or-invalid-agent
    - credential-mode-not-0600
    - token-directory-agent-mismatch

credentials:
  legacy_migration_source: .harness/state/.cache/coord-credentials.json
  metadata_cache_path: .harness/state/.cache/coord-credential-refs/<stable-role-id>.json
  metadata_cache_required_mode: "0600"
  secret_store: os-credential-broker
  secret_store_key: (project-slug, stable-role-id, directory-agent-ulid)
  launcher_trust_boundary: outside-agent-process
  process_delivery: selected-role-only
  agent_secret_enumeration: denied
  agent_legacy_cache_access: denied
  cross_role_secret_request: denied-with-human-or-broker-auth
  input_channels: [interactive-prompt, stdin]
  forbidden_channels: [argv, logs, tracked-files, generated-surfaces]
  metadata_write_protocol: temp-file-chmod-0600-atomic-rename
  migration: import-through-trusted-launcher-preserve-valid-token-then-remove-plaintext-tokens

model_session_policy:
  owner: tool-or-session-configuration
  role_spec_forbidden_fields: [model, claude_model, codex_model]
  generated_role_pins_model: false
  default_behavior: inherit-tool-session-model
  overrides_may_change: [model, reasoning-effort, sandbox-mode]
  overrides_must_not_change: [stable-role-id, directory-agent-ulid, kind, areas, reports-to, authority]
  identity_impact: none

session_protocol:
  actor: directory-agent-ulid
  ordered_steps:
    - acquire-role-lease
    - poll-private-inbox
    - ack-task
    - acquire-issue-lease
    - heartbeat-role-and-issue-leases
    - write-handoff
    - release-issue-lease
    - release-role-lease
  leases:
    role: role:<stable-role-id>
    issue: issue:<github-issue-number>
  handoff_minimum_characters: 10
  lost_lease_behavior: stop-writes-and-fail-closed

tracked_secret_policy:
  allowed_runtime_ids_in_role_specs: false
  allowed_credentials_in_role_specs: false
  allowed_credentials_in_generated_surfaces: false
  credential_cache_must_be_gitignored: true
  legacy_multi_role_plaintext_cache_is_runtime_input: false

implementation_dag:
  - issue: 441
    depends_on: [436]
    deliverable: portable-generated-role-surfaces
  - issue: 442
    depends_on: [436, 396]
    deliverable: scoped-identity-verification-endpoint
  - issue: 443
    depends_on: [441, 442, 396]
    deliverable: stable-role-resolver-and-credential-bootstrap
  - issue: 445
    depends_on: [443]
    deliverable: persistent-role-session-loop
  - issue: 444
    depends_on: [441, 443, 445]
    deliverable: secret-and-authority-drift-ci-gates
  - issue: 446
    depends_on: [441, 442, 443, 444, 445]
    deliverable: dual-tool-dev-chat-e2e-acceptance

excluded_coordination_tasks: [44]
