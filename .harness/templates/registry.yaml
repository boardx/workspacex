# registry.yaml — TPL-REG-001 本体。PROP-HARNESS-MODEL-001 Epic E1（HMV2-006）。
#
# 这是全仓 23 种模板类型的唯一登记处。条目取自 Proposal §8 原文表格——那份表格
# 已经把 23 个 template_id 定死了，这里不是重新编号，是把它从 Markdown 表格
# 挪进机器可读、机器可校验的位置（P1：模型优先；P3：引用优于复制）。
#
# ⚠ owner/consumers/authority 三列是本次新增的字段（Proposal 表格原文没有这三列，
# 只有"编号/模板/权威性质"）。owner 暂时统一填 coord-architecture（本 Epic 的
# 建议负责人），consumers 暂时留空数组——这是诚实的"还没有人真的在消费这些模板"，
# 不是遗漏。等 E3~E6 把各自的 renderer/gate 建出来，再把真实消费者填回来。
#
# 新增模板：pnpm harness templates allocate --domain <三位大写域码> --name "..."
# 不要手改这个数组新增条目——分配器会做唯一性检查，手改绕过了这层保护。

