# harness.config.yaml — 全局配置:命令、门控规则、阈值
version: 1

paths:
  phases_dir: phases
  roadmap: .harness/state/roadmap.yaml
  project_progress: .harness/state/PROGRESS.md

# feature 状态机(passing 不可逆;同一时刻只能有一个 in_progress)
feature_states: [not_started, in_progress, blocked, passing]

verification:
  # verify 脚本逐条执行 feature.verification 中的命令,全部退出码为 0 才允许门控通过
  shell: bash
  fail_fast: true
  # ADR-106 batch-1/6（#1274）：门控通过后要不要求基础验证、跑哪一档，按风险分
  # 档决定，不再是全局布尔值。small/standard 目前都映射到 verify:quick（affected）
  # ——两者合并是因为当前只有两档真实验证深度（affected 或 release），不是三档；
  # 保留三个 key 是为了未来给 small 一档更轻的验证时不用改 schema，只改这里的值。
  default_profile: standard
  profiles:
    small: "pnpm -w run verify:quick"
    standard: "pnpm -w run verify:quick"
    high_risk: "pnpm -w run verify:release"
  # 风险判据（#1332 重做）：看**这次改动实际碰了哪些文件**，不看 feature 元数据。
  # 原实现读 feature.area + verification 命令字符串做子串匹配，实测对 304 个真实
  # feature 跑一遍，7 个 marker 里 4 个零命中（含 migration，而仓库有 122 个真实
  # migration 文件）——判据形同虚设。详见 #1332 与 lib/verify-risk.ts 文件头。
  #
  # 匹配语义：glob，`**` 跨目录、`*` 不跨 `/`，其余字符按字面。命中任一 → high_risk。
  # 覆盖 AGENTS.md「明确不改的部分」点名的三类：数据库 schema、鉴权/权限、跨束契约。
  # 拿不到改动清单（未 fetch / 分支不基于 main / 不在 git 里）→ fail-closed 判 high_risk。
  high_risk_paths:
    # 数据库 schema 与迁移
    - "apps/api/migrations/**"
    - "**/migrations/**"
    - "**/*.sql"
    # 鉴权 / 身份 / 权限（洋葱四层都算）
    - "apps/api/src/*/auth/**"
    - "apps/api/src/*/identity/**"
    # 跨束 API 契约单源
    - "packages/contracts/**"
    # 协调协议（租约/权威，改错会让全体 agent 协作失效）
    - "packages/coord-*/**"

gates:
  single_in_progress: true        # 强制"同时只有一个 in_progress"
  passing_is_irreversible: true   # 禁止从 passing 回退
  evidence_required: true         # 没有 evidence 不允许标 passing
  spec_ref_required: true         # 没有可追溯的 requirements story 不允许 claim / 标 passing

quality:
  evaluator_rubric: .harness/rubrics/evaluator-rubric.md
  quality_document: .harness/state/quality-document.md
