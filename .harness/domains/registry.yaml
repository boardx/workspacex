# .harness/domains/registry.yaml — H3A-010/011 Domain Registry
# （PROP-HARNESS-AGENT-001 Epic E1，见 docs/proposals/PROP-HARNESS-AGENT-001.md §8.1）
#
# ⚠ 这份清单是 H3A-011 的证据驱动草案，不是已签核事实源。完成契约原文
# （checklist.md）："最终清单必须通过 inventory 从真实代码、Contract Bundle 和
# ownership 推导，由人类签核，不能直接把本建议当作已接受注册表"——本文件确实
# 是从真实证据推导的（见每条 entry 的 owner/areas/contracts 出处，方法论见
# 同目录 PROP-HARNESS-AGENT-001-h3a011-domain-inventory.md），但**尚未经过
# 人类签核**。签核前，`owner: null` 的条目、文件头这条警告、以及 inventory
# 文档里点名的"coord-chat-e2e 一人覆盖三个 Domain"结构性问题都不得被视为
# 已解决。
#
# owner 判定规则（详见 inventory 文档）：`.harness/agents/registry.yaml` 里
# `kind: module-coordinator` 的身份才算"Domain 规划权威候选人"；`kind: worker`
# 只是执行角色，即便 areas 完全重叠也不构成竞争 owner（只是"该 worker 没有
# 挂到对应 coordinator 下"这个既有结构问题，见 E0 inventory 结构问题 #2）；
# `kind: reviewer` 是独立验证角色，按 Proposal P6/G6 本来就该与规划权分离，
# 不计入 owner 竞争。
#
# 结构：`domains-doctor.ts`（H3A-010/012/013/014/015）读取本文件，用
# `.harness/scripts/lib/domain-model.ts` 的 `validateDomainRegistry` 校验。
entries:
  - domain_id: DOM-PLATFORM
    name: "Platform / 基础平台"
    # registry.yaml 里唯一声称 [platform, database, ci, baseline] 的身份是
    # dev-platform-baseline（kind: worker）——没有专门的 coordinator，这本身
    # 是 E0 inventory 结构问题 #2 的一个具体例子，不是本条目独有的歧义。
    owner: dev-platform-baseline
    areas: [platform, database, ci, baseline]
    contracts: []
    verification: []
    status: active

  - domain_id: DOM-IDENTITY-AUTH
    name: "Identity & Auth / 身份与鉴权"
    # coord-agent-auth 是唯一 kind: module-coordinator 且 areas 命中的身份；
    # dev-auth（kind: worker）areas 字面相同但 reports_to coord-main（不是
    # coord-agent-auth）——这是监督链缺口，不是 owner 竞争。
    owner: coord-agent-auth
    areas: [auth, identity, session]
    contracts:
      - phases/phase-00-shared-kernel/contracts/identity
      - phases/phase-00-shared-kernel/contracts/auth
    verification: []
    status: active

  - domain_id: DOM-CHAT
    name: "Chat / 对话"
    # coord-chat-e2e 是唯一 kind: module-coordinator 且 areas 含 "chat" 的身份。
    owner: coord-chat-e2e
    areas: [chat]
    contracts:
      - phases/phase-01-run-a-project/contracts/chat
    verification: []
    status: active

  - domain_id: DOM-CANVAS-DIAGRAM
    name: "Canvas & Diagram / 画布与图表"
    # 同 DOM-CHAT：coord-chat-e2e 是唯一 areas 含 "canvas" 的 module-coordinator。
    owner: coord-chat-e2e
    areas: [canvas]
    contracts:
      - phases/phase-01-run-a-project/contracts/canvas
    verification: []
    status: active

  - domain_id: DOM-AI-RUNTIME
    name: "AI Runtime / AI 运行时"
    # dev-ai-runtime（kind: worker）是唯一 areas 含 "ai-runtime" 的身份——今天
    # 没有任何 module-coordinator 声称这个 area，这个 Domain 事实上没有
    # coordinator 层，只有直接 reports_to coord-main 的 worker（E0 inventory
    # 结构问题 #2 的另一个具体例子）。
    owner: dev-ai-runtime
    areas: [ai-runtime]
    contracts:
      - phases/phase-01-run-a-project/contracts/agent-runtime
    verification: []
    status: active

  - domain_id: DOM-AGENT-SKILL-DIRECTORY
    name: "Agent & Skill Directory / Agent 与 Skill 目录"
    # owner: null —— 真实冲突：coord-chat-e2e（module-coordinator，areas 含
    # "agent","skills"）与 dev-ai-runtime（worker，areas 含 "agents","skills"）
    # 都声称这块边界，且不是"协调者+其下 worker"的正常分工（dev-ai-runtime
    # reports_to coord-main，不是 coord-chat-e2e）。额外发现：registry.yaml
    # 自己在 "agent"（coord-chat-e2e）和 "agents"（dev-ai-runtime）上单复数
    # 不一致，不确定是否指同一个边界，还是命名当时就没对齐——这两件事本文件
    # 都不替人类下判断。
    owner: null
    areas: [agents, skills]
    contracts:
      - phases/phase-01-run-a-project/contracts/skills
      - phases/phase-01-run-a-project/contracts/templates
    verification: []
    status: active

  - domain_id: DOM-CONTRACT-CONTROL-PLANE
    name: "Contract & Control Plane / 契约与控制平面"
    owner: coord-architecture
    areas: [harness, docs, adr, agent-protocol]
    contracts: []
    verification:
      - "pnpm exec vitest run --dir .harness"
    status: active

  - domain_id: DOM-E2E-RELEASE-READINESS
    name: "E2E & Release Readiness / 端到端与发布就绪"
    # coord-chat-e2e 是唯一 areas 含 "e2e" 的 module-coordinator，定为 owner。
    # rev-e2e（kind: reviewer，areas=[e2e,release-readiness]，required_for 同）
    # 是该 area 的必需独立评审角色，按 Proposal P6/G6 评审权与规划权本来就该
    # 分离，不构成 owner 竞争——不要把这条误读成"两个身份争 owner"。
    owner: coord-chat-e2e
    areas: [e2e, release-readiness]
    contracts: []
    verification: []
    status: active
