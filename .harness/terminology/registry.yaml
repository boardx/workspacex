    legacy_names: ["三层 Agent 架构"]
    canonical_name_en: "Hierarchical Multi-Agent Orchestration"
    canonical_name_zh: "分层多 Agent 编排"
    usage_boundary: "整体架构；强调 orchestration 而非组织图"
  - term_id: TERM-ORG-002
    category: 组织与知识
    legacy_names: ["Main Agent", "Main Coordinator"]
