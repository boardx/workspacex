# registry.yaml — H3A-006 规范术语注册表。
#
# 唯一事实源是 docs/proposals/PROP-HARNESS-AGENT-001.md §2.3（Accepted，
# 2026-08-07）。本文件是那张表格的机器可读投影，不是第二份定义——发现分歧
# 以 §2.3 原文为准，改这里去对齐原文，不要反过来改原文迁就这里（P3：引用
# 优于复制，同 Harness V2 template-model.ts 的先例）。
#
# 新增术语：走 §2.3 原文先补一行，再手工同步补这里一行——本文件目前没有
# 独立的取号器（术语不像 TPL-*/ADR-* 那样需要防撞号的原子分配，36 个 Term ID
# 都在 Accepted 提案里一次性定死，不是持续增长的序列）。
#
# 每条字段：
#   term_id          稳定 ID（TERM-<3位大写类别码>-<3位序号>）
#   category         人类可读的类别名（不参与机器判定，只帮读者定位）
#   legacy_names     旧名列表（可以是空数组——不是所有规范名都有对应旧名）
#   canonical_name_en  规范名（英文，snake_case 字段命名以此为准）
#   canonical_name_zh  规范名（中文，人类视图用）
#   usage_boundary   使用边界（一句话，转录自 §2.3 表格"使用边界"列）

entries:
  # ── 组织与知识（§2.3 表一）───────────────────────────────────────────
  - term_id: TERM-ORG-001
