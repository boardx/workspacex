# coord-gateway — 生产宿主：webhook ingest + REST + RepoHub DO（ADR-017）。
# 首版部署到 workers.dev；GitHub webhook 与 agent API 不能放在要求交互式登录的
# Cloudflare Access 路由后。后续若增加自定义域名，应继续与人类门户分域。
# ⚠️ compatibility_date 沿用本仓现值纪律（mod-devportal 2026-07-12 事故）。
# ⚠️ secrets（wrangler secret put）：GITHUB_WEBHOOK_SECRET / COORD_API_TOKEN /
#    COORD_ADMIN_TOKEN（andon 特权）/ GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY（投影）。
#    变更遵守 env 原子纪律：先 put 新值再合代码，禁止先删后合。
name = "workspacex-coord-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# 反向投影 cron（F06）：每 2 分钟一 tick，事件 → 投影引擎 → GitHub check/status
[triggers]
crons = ["*/2 * * * *"]

[vars]
PROJECTION_REPOS = "boardx/workspacex"

# 首版必须是可用的协调系统，不允许部署一个只会返回 503 的空壳。Wrangler 会在
# deploy 前确认这些 secret 已存在；值仍通过 Dashboard / `wrangler secret put` 设置，
# 不进入仓库。
[secrets]
required = [
  "GITHUB_WEBHOOK_SECRET",
  "COORD_API_TOKEN",
  "COORD_ADMIN_TOKEN",
  "GITHUB_APP_ID",
  "GITHUB_APP_PRIVATE_KEY",
]

[observability]
enabled = true
head_sampling_rate = 1

[[queues.producers]]
queue = "workspacex-coord-webhook-events"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "workspacex-coord-webhook-events"
max_batch_size = 25
max_retries = 5
# DLQ（#712）：持续失败（非 ok、非 422）的消息 5 次重试后落入死信队列，
# 不再静默丢弃。处置约定：人工重放（wrangler queues 查看 + 重发），暂无
# 自动消费者——镜像可由后续 webhook 自愈，DLQ 只是可观测落点。
# 队列由 CD 的 ensure-queue 步骤幂等创建（deploy-coord-gateway.yml）。
dead_letter_queue = "workspacex-coord-webhook-dlq"

[[durable_objects.bindings]]
name = "REPOHUB"
class_name = "RepoHub"

# 平台目录单例（p30/F01）：与按仓分片的 RepoHub 互补的平台级 DO
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "PlatformDirectory"

# CoordBrain（R1 影子模式，p30-F10）：每仓一个，与 RepoHub 同 worker。只读观察 +
# 记录 coord.shadow.* 决策事件，零写 API（brain.ts 头注有全代码路径审计说明）。
[[durable_objects.bindings]]
name = "COORDBRAIN"
class_name = "CoordBrain"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepoHub"]

# 新 class 用新 tag 追加（别改旧 tag——migrations 是只增历史）
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlatformDirectory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CoordBrain"]
