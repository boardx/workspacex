<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — WorkspaceX</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>
  .nf { min-height: 100svh; display: grid; place-content: center; text-align: center; gap: 1.5rem; padding: var(--gutter); }
  .nf__code { font-family: var(--font-mono); font-size: var(--t-micro); letter-spacing: .2em; color: var(--fg-faint); }
  .nf__actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
</style>
</head>
<body>
  <main class="nf">
    <span class="nf__code">404</span>
    <h1>This page does not exist.</h1>
    <p class="lead" style="margin-inline:auto">The link may be out of date, or the page may have moved.</p>
    <div class="nf__actions">
      <a class="btn btn--primary btn--lg" href="/">Go to the homepage</a>
      <a class="btn btn--ghost btn--lg" href="/zh/" lang="zh-Hans">中文首页</a>
    </div>
  </main>
</body>
</html>
