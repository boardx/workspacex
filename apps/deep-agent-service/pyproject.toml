[project]
name = "deep-agent-service"
version = "0.1.0"
description = "Self-hosted WorkspaceX deep-agent runtime."
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7,<0.8",
  "langchain-openai>=0.3.0",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "jsonschema>=4.23.0",
  "starlette==1.6.0",
  "uvicorn>=0.35,<1",
  # `spawn_async_task` directly imports httpx to call the API callback endpoint.
  "httpx>=0.28,<0.29",
  # D10④: tracing.py imports these packages, so they remain direct dependencies.
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "langmem==0.0.30",
  "langchain-community==0.4.2",
  "langchain-classic==1.0.8",
  "sqlalchemy[asyncio]==2.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 2026-09-05（PR #2762 合入时 `pytest` job 挂死 20 分钟，见 issue #2755 评论）：
# 单个测试的硬上限。本仓的测试都是进程内假模型（秒级），真 Postgres 的两条也在
# 一分钟内；超过 120 s 只可能是挂死，不是慢——挂死必须当场红、带全线程栈，
# 不能让 workflow 的 timeout-minutes 替它收尸（那样既没有栈也没有哪条测试的信息）。
#
# timeout_method = "thread"（不是默认的 signal）：实测那次挂死是 langgraph 后台
# checkpoint 写线程池的死锁（8 个 worker 互相等）。signal 方式只在主线程抛异常，
# 解释器退出时 concurrent.futures 的 atexit 还会 join 那些死锁的 worker——进程照样
# 挂到 20 分钟。thread 方式先 dump 全部线程栈再 os._exit(1)，保证一定结束。
timeout = 120
timeout_method = "thread"
