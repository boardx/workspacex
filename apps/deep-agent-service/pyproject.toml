[project]
name = "deep-agent-service"
version = "0.1.0"
description = "Thin wrapper: organization Skills exposed as dynamic deepagents tools, served via `langgraph dev` (#739, see #738 for the architecture investigation)."
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7,<0.8",
  "langchain-openai>=0.3.0",
  "langgraph-cli[inmem]>=0.4.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "jsonschema>=4.23.0",
  # D10④（deepagent-capability-rubric.md）：本地 OTel 导出，见 tracing.py 模块注释。
  # 已在 uv.lock 里作为 langgraph-api 的传递依赖存在（`langsmith[otel]` 拉的），
  # 这里把它提成直接依赖——我们的代码直接 import 这三个包，不能只靠别人的传递依赖
  # 碰巧把它带进来（对方哪天不再需要 otel extra，我们的 import 就会静默失效）。
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
