[project]
name = "deep-agent-service"
version = "0.1.0"
description = "Thin wrapper: organization Skills exposed as dynamic deepagents tools, served via `langgraph dev` (#739, see #738 for the architecture investigation)."
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7,<0.8",
  "langchain-openai>=0.3.0",
  "langgraph-cli[inmem]>=0.4.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "jsonschema>=4.23.0",
  # issue #2664 -- `spawn_async_task` 直接 `import httpx` 回调 TS 侧队列端点。已经作为
  # langgraph-api 等的传递依赖存在于 uv.lock（见下面 otel 三行同一条纪律的原话：
  # 我们的代码直接 import 它，不能只靠别人的传递依赖碰巧把它带进来）。
  "httpx>=0.28,<0.29",
  # D10④（deepagent-capability-rubric.md）：本地 OTel 导出，见 tracing.py 模块注释。
  # 已在 uv.lock 里作为 langgraph-api 的传递依赖存在（`langsmith[otel]` 拉的），
  # 这里把它提成直接依赖——我们的代码直接 import 这三个包，不能只靠别人的传递依赖
  # 碰巧把它带进来（对方哪天不再需要 otel extra，我们的 import 就会静默失效）。
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 2026-09-05（PR #2762 合入时 `pytest` job 挂死 20 分钟，见 issue #2755 评论）：
# 单个测试的硬上限。本仓的测试都是进程内假模型（秒级），真 Postgres 的两条也在
# 一分钟内；超过 120 s 只可能是挂死，不是慢——挂死必须当场红、带全线程栈，
# 不能让 workflow 的 timeout-minutes 替它收尸（那样既没有栈也没有哪条测试的信息）。
#
# timeout_method = "thread"（不是默认的 signal）：实测那次挂死是 langgraph 后台
# checkpoint 写线程池的死锁（8 个 worker 互相等）。signal 方式只在主线程抛异常，
# 解释器退出时 concurrent.futures 的 atexit 还会 join 那些死锁的 worker——进程照样
# 挂到 20 分钟。thread 方式先 dump 全部线程栈再 os._exit(1)，保证一定结束。
timeout = 120
timeout_method = "thread"
