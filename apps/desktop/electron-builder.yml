# electron-builder config for WorkspaceX Local (issue #3716). Night 0: unsigned mac DMG.
#
# What goes in the bundle (resources/bundle): the monorepo subset local-runtime needs at run
# time -- apps/api, apps/web (built), apps/skill-sandbox, apps/deep-agent-service (+ .venv from
# scripts/local-bundle/prepare-python.sh), packages/*, skills/starter-packs and node_modules.
# This is the "run the repo with tsx" alpha shape; a compiled/pruned bundle is R1 work.
#
# resources/bin: the Ollama binary, placed there by scripts/local-bundle/fetch-ollama.sh.
# resources/models: the chat + embedding models, placed there by scripts/local-bundle/fetch-models.sh.
appId: com.workspacex.local
productName: WorkspaceX
directories:
  output: release
  buildResources: build
artifactName: "${productName}-${version}-${arch}.${ext}"
files:
  - dist/**
  - package.json
extraResources:
  - from: ../../
    to: bundle
    filter:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "node_modules/**"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/skill-sandbox/**"
      - "apps/local-asr-gateway/**"
      - "apps/deep-agent-service/**"
      - "packages/**"
      - "skills/starter-packs/**"
      - "!**/node_modules/.cache/**"
      - "!**/*.test.ts"
      - "!**/tests/**"
      - "!**/e2e/**"
      - "!**/evidence/**"
      - "!apps/web/.next/cache/**"
      # e2e lanes build into sibling dirs (.next-e2e, .next-fullstack-e2e, ...): 5 GB of stale
      # output on a dev machine that must never ride into the DMG (Mac实测 2026-09-17).
      - "!apps/web/.next-*/**"
      # The dev venv hard-codes build-machine paths; the DMG ships resources/python instead (bundle-python.sh).
      - "!apps/deep-agent-service/.venv/**"
  - from: build/logo.png
    to: logo.png
  - from: bin
    to: bin
  # Relocatable CPython + site-packages for deep-agent-service (scripts/local-bundle/bundle-python.sh).
  - from: python
    to: python
  # Ollama models (manifests + blobs) exported by scripts/local-bundle/fetch-models.sh; imported
  # into the running Ollama's store on first start so no download is needed (人类决策 2026-09-17).
  - from: models
    to: models
  # Streaming ASR model (sherpa-onnx zipformer, fp32 only) exported by scripts/local-bundle/bundle-asr-model.sh.
  - from: asr-models
    to: asr-models
asar: false
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
