# electron-builder config for WorkspaceX Local (issue #3716). Night 0: unsigned mac DMG.
#
# What goes in the bundle (resources/bundle): the monorepo subset local-runtime needs at run
# time -- apps/api, apps/web (built), apps/skill-sandbox, apps/deep-agent-service (+ .venv from
# scripts/local-bundle/prepare-python.sh), packages/*, skills/starter-packs and node_modules.
# This is the "run the repo with tsx" alpha shape; a compiled/pruned bundle is R1 work.
#
# resources/bin: the Ollama binary, placed there by scripts/local-bundle/fetch-ollama.sh.
# resources/models: the chat + embedding models, placed there by scripts/local-bundle/fetch-models.sh.
appId: com.workspacex.local
productName: WorkspaceX
directories:
  output: release
  buildResources: build
artifactName: "${productName}-${version}-${arch}.${ext}"
files:
  - dist/**
  - package.json
extraResources:
  - from: ../../
    to: bundle
    filter:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "node_modules/**"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/skill-sandbox/**"
      - "apps/local-asr-gateway/**"
      - "apps/deep-agent-service/**"
      - "packages/**"
      - "skills/starter-packs/**"
      - "!**/node_modules/.cache/**"
      - "!**/*.test.ts"
      - "!**/tests/**"
      - "!**/e2e/**"
      - "!**/evidence/**"
      - "!apps/web/.next/cache/**"
      # e2e lanes build into sibling dirs (.next-e2e, .next-fullstack-e2e, ...): 5 GB of stale
      # output on a dev machine that must never ride into the DMG (Mac实测 2026-09-17).
      - "!apps/web/.next-*/**"
      # The dev venv hard-codes build-machine paths; the DMG ships resources/python instead (bundle-python.sh).
      - "!apps/deep-agent-service/.venv/**"

      # ── 只在开发/打包时用到、运行时一行都不加载的大件（#3872 R16）────────────
      #
      # 实测 2026-09-23：bundle/node_modules 3.5 GB，里面躺着 1.57 GB 这样的东西。
      # 判据不是「看着像开发依赖」，而是逐条核过运行时到底加不加载：
      #
      #   electron 708 MB          应用本身就是 Electron（Contents/Frameworks 里那份）；
      #                            bundle 里的运行时代码没有任何一处 import electron。
      #   app-builder-bin 207 MB   electron-builder 自己的二进制。打完包就没用了。
      #   workerd ×3 版本 303 MB   wrangler 的运行时，给 apps/coord-gateway 用。
      #   @cloudflare/workerd-* 289 MB  同上（平台专用二进制，三个版本各一份）。
      #                            `up()` 启动的是 api / web / skill-sandbox /
      #                            asr-gateway / deep-agent / ollama —— 没有 coord-gateway，
      #                            而 packages/local-runtime 里对 wrangler/workerd 零引用。
      #   typescript 64 MB         运行时用 tsx（esbuild），不做类型检查。
      #
      # ⚠ 剪包是**危险操作**：少了一个运行时真的要的包，症状是应用起不来或某个功能
      #   静默失效。所以这一组每加一条都要重新打包并**真的把应用跑起来**验证，
      #   而不是「看着不像运行时依赖」就删。验证方式见 evidence 里 R16 那一节。
      - "!node_modules/.pnpm/electron@*/**"
      - "!node_modules/.pnpm/app-builder-bin@*/**"
      - "!node_modules/.pnpm/workerd@*/**"
      - "!node_modules/.pnpm/@cloudflare+workerd-*/**"
      - "!node_modules/.pnpm/typescript@*/**"
  - from: build/logo.png
    to: logo.png
  # commit short SHA + build time, shown on the startup page next to the version (#3749)
  - from: build/build-info.json
    to: build-info.json
  - from: bin
    to: bin
  # Relocatable CPython + site-packages for deep-agent-service (scripts/local-bundle/bundle-python.sh).
  - from: python
    to: python
  # Ollama models (manifests + blobs) exported by scripts/local-bundle/fetch-models.sh; imported
  # into the running Ollama's store on first start so no download is needed (人类决策 2026-09-17).
  - from: models
    to: models
  # Streaming ASR model (sherpa-onnx zipformer, fp32 only) exported by scripts/local-bundle/bundle-asr-model.sh.
  - from: asr-models
    to: asr-models
asar: false
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
