# ops-console — 内部运营平面（backlog D1 骨架）：发布控制台 + 事故面板。
# 不交付；目录已登记在 .harness/scripts/lib/ops-plane.mjs，生产不得依赖它。
#
# ⚠️ 必须部署在 Cloudflare Access 应用之后（自定义域 / 路由由人类在 Dashboard 配），
#    Worker 自己再校验 Cf-Access-Jwt-Assertion（纵深防御，缺配置 fail-closed 503）。
# ⚠️ 本 Worker 永不存放：客户内容、客户 PII、凭据值、计费账本、客户可审计证据。
#    事故只以不透明实例哈希引用客户（schema 门控：pnpm run lint:ops-incident-schema）。
# secrets（wrangler secret put，值不入库）：GITHUB_READ_TOKEN（只读 actions / deployments / contents）
name = "workspacex-ops-console"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

[vars]
RELEASE_REPO = "boardx/workspacex"
# 发布事实的来源就是既有部署流水线本身（单一事实源，不复制进新存储）
DEPLOY_WORKFLOWS = "deploy-coord-gateway.yml,deploy-devportal.yml,deploy-cn-production.yml"
# Access 配置不是秘密；人类建好 Access 应用后填入（空 = fail-closed 503）
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[observability]
enabled = true

[[durable_objects.bindings]]
name = "INCIDENTS"
class_name = "IncidentLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IncidentLog"]
