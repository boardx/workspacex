# Deployed dependencies. Separate file from `docker-compose.dev.yml` on purpose.
#
# ## Why not just reuse the dev one
#
# The dev file puts PostgreSQL's data directory on **tmpfs**, and that is correct there:
# every gate run starts from an empty database, which is what makes "rebuildable from
# migrations alone" a claim that is exercised rather than one that happens to be true of
# a long-lived local database.
#
# Deployed, the same line means the database is wiped on every container restart. Today
# that costs nothing -- there is no real data yet. The moment F01's `acl_bindings` holds a
# real organization it is a landmine, and it is the kind that goes off during an unrelated
# `docker restart` at the worst possible time.
#
# Two files rather than one file with an override, because the difference is not a tweak:
# one deliberately destroys data and the other deliberately preserves it. Expressing that
# as a flag invites someone to flip it.
#
# ## Usage
#   docker compose -f apps/api/docker-compose.deploy.yml -p workspacex up -d
#
# ⚠ Project name is `workspacex`, distinct from the gates' `workspacex-kernel`. Same host,
#   two stacks: a `docker compose -p workspacex-kernel down -v` during a CI run must not be
#   able to reach the deployed data.
#
# ⚠ And therefore DIFFERENT PORTS. Both stacks publishing 55432 on one host is not a
#   collision you get warned about once and fix -- whichever starts second fails to bind,
#   and if the deployed one is the loser the app quietly connects to the CI database that
#   `verify-rls.sh` is about to DROP. Defaults here are shifted by one (55433/59010/56380);
#   override via PGPORT / MINIO_PORT / REDIS_PORT.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      # Deployed credentials come from the environment, never from this file. The dev file
      # hardcodes them, which is fine for a disposable database and not fine here.
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      POSTGRES_DB: ${PGDATABASE:-workspacex}
    ports:
      # Loopback only. Docker publishes to all interfaces by default, and this host is on
      # the public internet -- see the note in docker-compose.dev.yml.
      - "127.0.0.1:${PGPORT:-55433}:5432"
    volumes:
      # A NAMED volume, which is the whole reason this file exists.
      - workspacex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":59001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59011}:59001"
    volumes:
      # Object storage holds originals, and the architecture's invariant is that an original
      # is never overwritten. Losing the volume would violate that in the most direct way.
      - workspacex_miniodata:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-56380}:6379"
    volumes:
      # Redis is a cache today, but sessions land here with phase-01 01-auth. Persisting it
      # now costs nothing and avoids a silent "everyone logged out" on the first restart
      # after that feature ships.
      - workspacex_redisdata:/data
    restart: unless-stopped

  # ── F962 / #1583：脚本执行沙箱 ────────────────────────────────────────────
  #
  # ⚠⚠ **隔离的实质在这些运行参数里，不在镜像里。** 摘掉 `network_mode: none`
  #     这一行，镜像一个字节不变，但网络就通了 —— verification.md 的 V2-CP
  #     就是这么做反证的。任何让 V2-b 变绿的改动，若不是真的关掉网络，
  #     就是把门控调成不会红。
  #
  # ## 为什么 socket 走 bind mount 而不是命名卷
  #
  # `workspacex-api` 是**宿主上的 systemd 服务**（provision.sh 的
  # `User=${APP_USER}`），不是容器。命名卷只有 `/var/lib/docker/volumes/...`
  # 这个 root 属主的路径能被宿主看到，让一个非 root 的 systemd 服务去连那里
  # 既别扭又脆弱。bind 一个宿主目录，两边看到的是同一条稳定路径。
  #
  # ## 为什么要显式指定 user
  #
  # 镜像里是 `USER node`（UID 1000）。socket 文件的属主就是它，而宿主上连接
  # 这个 socket 的是 `${APP_USER}`。两个 UID 不一致 ⇒ **connect() 被拒**，
  # 且症状是"沙箱不可用"这种看起来像服务没起来的错误。deploy.sh 因此解析出
  # 宿主 APP_USER 的真实 uid/gid 传进来，让 socket 从诞生起就属于对的人。
  skill-sandbox:
    build:
      context: ../skill-sandbox
      dockerfile: Dockerfile
    network_mode: "none"
    read_only: true
    user: "${SANDBOX_UID:?set SANDBOX_UID}:${SANDBOX_GID:?set SANDBOX_GID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    volumes:
      # 宿主目录 ⇄ 容器 /run/sandbox。API（宿主进程）连的就是这个目录下的 socket。
      - ${SANDBOX_SOCKET_DIR:?set SANDBOX_SOCKET_DIR}:/run/sandbox
    environment:
      SKILL_SANDBOX_SOCKET: /run/sandbox/skill-sandbox.sock
      SKILL_SANDBOX_MODULES_DIR: /opt/sandbox/node_modules
      # PDF 画中文的字体（镜像里预装，见 apps/skill-sandbox/Dockerfile）。
      SKILL_SANDBOX_CJK_FONT: /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
      TMPDIR: /tmp
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped

volumes:
  workspacex_pgdata:
  workspacex_miniodata:
  workspacex_redisdata:
