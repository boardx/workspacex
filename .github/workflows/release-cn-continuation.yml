name: Reviewed CN continuation stage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit reviewed operation (recovery is never automatic)
        required: true
        type: choice
        options: [status, advance, reconcile, recover, reconcile-recovery]
      request_sha256:
        description: Hash of a separately approved root-installed stage package
        required: true
        type: string
      attempt_id:
        description: Exact immutable release attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspacex-cn-production-deploy
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    environment: production-cn-promotion
    runs-on: [self-hosted, linux, workspacex-cn-production]
    timeout-minutes: 25
    steps:
      - name: Invoke the installed approved entry only
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          REQUEST_SHA: ${{ inputs.request_sha256 }}
          ATTEMPT: ${{ inputs.attempt_id }}
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(status|advance|reconcile|recover|reconcile-recovery)$ ]]
          [[ "$REQUEST_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ATTEMPT" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          sudo -n /usr/local/bin/workspacex-cn-release-advance "$MODE" "$REQUEST_SHA" "$ATTEMPT"
