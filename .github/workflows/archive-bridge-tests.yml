name: archive-bridge-tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/archive-bridge-tests.yml'
      - 'scripts/cn-release-*.py'
      - 'scripts/cn-release-business-*.ts'
      - 'scripts/build-cn-business-runtime.cjs'
      - 'tests/test_cn_release_*.py'
      - 'tests/cn-release-business-*.ts'
      - '.github/workflows/release-cn-fixed.yml'
      - 'scripts/cn-release-audit.py'
      - 'scripts/cn-release-orchestrate.py'
      - 'scripts/cn-release-runtime-readback.py'
      - 'tests/test_cn_release_runtime_readback.py'
      - 'scripts/cn-release-continuation-*.py'
      - '.harness/scripts/vm/cn-release-advance.py'
      - '.harness/scripts/vm/cn-runtime-continuation/**'
      - 'tests/test_cn_release_entry.py'
      - 'tests/cn_release_cgroup_linux.py'
      - 'scripts/cn-release-derived-approval.py'
      - 'tests/test_cn_release_derived_approval.py'
      - 'tests/test_cn_release_continuation_*.py'
      - '.github/workflows/release-cn-continuation.yml'
      - 'tests/test_cn_release_audit.py'
      - 'docs/operations/cn-release-five-round-audit.md'
      - '.github/workflows/transfer-cn-candidates-via-hongkong.yml'
      - '.github/release-plans/hk-*'
      - 'scripts/cn-hk-*.py'
      - 'scripts/aliyun-release-auth.py'
      - 'scripts/harden-aliyun-action.py'
      - 'tests/test_auth_action_hardening.py'
      - 'tests/test_aliyun_release_auth.py'
      - 'tests/test_cn_hk_*.py'
      - 'docs/operations/hk-release-transfer/**'
      - '.github/workflows/cloud-build-only.yml'
      - 'scripts/cloud-build-only.py'
      - 'tests/test_cloud_build_only.py'
      - '.github/workflows/export-cn-image-archives.yml'
      - '.github/workflows/build-cn-image-candidates.yml'
      - '.github/workflows/diagnose-cn-image-candidate.yml'
      - 'scripts/diagnose-cn-image-candidate.py'
      - 'tests/test_cn_image_diagnostic.py'
      - '.github/workflows/diagnose-cn-agent-postbuild.yml'
      - 'scripts/diagnose-cn-agent-postbuild.py'
      - 'tests/test_cn_agent_postbuild_diagnostic.py'
      - 'tests/test_cn_image_postbuild.py'
      - 'scripts/cn_image_candidate.py'
      - 'scripts/cn_candidate_publication.py'
      - 'scripts/cn_candidate_host.py'
      - 'scripts/package-cn-candidate-runtime.py'
      - 'scripts/install-cn-candidate-runtime.py'
      - 'tests/test_cn_candidate_runtime.py'
      - 'scripts/cn_candidate_oss.py'
      - 'scripts/cn_candidate_revalidation.py'
      - 'scripts/cn_candidate_github.py'
      - 'scripts/revalidate-cn-image-candidates.py'
      - 'tests/test_cn_candidate_revalidation.py'
      - 'tests/test_cn_candidate_cached_revalidation.py'
      - 'tests/test_cn_candidate_acquisition.py'
      - 'scripts/cn-candidate-revalidation.md'
      - 'scripts/cn_candidate_authenticated_oss.py'
      - 'scripts/cn-candidate-authenticated-oss.md'
      - 'scripts/cn-candidate-oss-policy.example.json'
      - 'tests/test_cn_candidate_authenticated_oss*.py'
      - 'scripts/execute-cn-candidate-download.py'
      - 'scripts/cn-candidate-download-entry.md'
      - 'scripts/cn_candidate_download_supervisor.py'
      - 'scripts/cn_candidate_sdk_runtime.py'
      - 'tests/test_cn_candidate_download_entry.py'
      - 'tests/test_cn_candidate_oss.py'
      - 'tests/test_cn_candidate_untrusted_cache.py'
      - 'scripts/cn-candidate-untrusted-cache.md'
      - 'scripts/cn_candidate_native_cli.py'
      - 'scripts/cn_candidate_native_upload.py'
      - 'docs/operations/cn-candidate-native-upload.md'
      - 'tests/test_cn_candidate_native*.py'
      - 'scripts/upgrade-cn-candidate-tools.py'
      - 'scripts/cn-candidate-tool-upgrade.md'
      - 'tests/test_cn_candidate_tool_upgrade.py'
      - 'tests/fixtures/cn-candidate-upgrade/**'
      - '.harness/scripts/vm/import-cn-image-candidates.py'
      - 'tests/test_cn_candidate_host*.py'
      - 'tests/test_cn_candidate_publication.py'
      - 'scripts/build-cn-image-candidates.py'
      - 'scripts/cn-image-candidate-protocol.md'
      - 'tests/test_cn_image_candidate.py'
      - 'tests/test_cn_formal_save_bound.py'
      - 'tests/test_cn_repeated_layers.py'
      - 'tests/test_cn_formal_budget_profile.py'
      - 'tests/test_cn_exact_source_admission.py'
      - 'scripts/cn_image_archive.py'
      - 'scripts/cn_archive_oss.py'
      - 'scripts/export-cn-image-archives.py'
      - 'scripts/canonical_control.py'
      - 'scripts/check-cn-archive-export-inputs.py'
      - 'scripts/verify-cn-main-registration.py'
      - 'tests/test_cn_main_registration.py'
      - '.harness/scripts/vm/isolated_rehearsal.py'
      - '.harness/scripts/vm/isolated_rehearsal_test.py'
      - '.harness/scripts/vm/isolated_rehearsal_provider_error_test.py'
      - '.harness/scripts/vm/isolated_rehearsal_provider_contract_test.py'
      - 'docs/deployment/cn-isolated-rehearsal-closure.md'
      - '.harness/scripts/vm/import-cn-image-archives.py'
      - 'tests/test_cn*archive*.py'
      - 'packages/cloud-deploy/src/release*.ts'
      - '.harness/scripts/vm/isolated_rehearsal_aliyun.py'
      - '.harness/scripts/vm/isolated_rehearsal_endpoint_test.py'
      - '.harness/scripts/vm/cn_tool_profile.py'
      - '.harness/scripts/vm/prepare-cn-tool-install.py'
      - '.harness/scripts/vm/cn-tool-install-transaction.py'
      - '.harness/scripts/vm/cn_compose_profile_extension_test.py'
      - '.harness/scripts/vm/cn_tool_profile_test.py'
      - '.harness/scripts/vm/prepare_cn_tool_install_test.py'
      - '.harness/scripts/vm/cn_tool_install_transaction_test.py'
      - '.harness/scripts/generate-cn-maintenance-identities.py'
      - 'docs/deployment/cn-compose-profile-extension.md'
permissions:
  contents: read
jobs:
  isolated-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Install isolated test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/archive-fixture" --no-audit --no-fund --save-exact tsx@4.20.6 zod@3.25.76
          echo "CN_ARCHIVE_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "CN_ARCHIVE_TEST_RUNTIME=$RUNNER_TEMP/archive-fixture" >> "$GITHUB_ENV"
      - name: Run archive contracts and real canonical Node fixture
        run: python3 -B -m unittest discover -s tests -p 'test_cn*archive*.py' -v
      - name: Run bounded release scenario and offline chain regressions
        run: python3 -B scripts/cn-release-audit.py test --suite all --budget-seconds 300
      - name: Run independent non-authorizing five-image candidate contracts
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_image_candidate.py' -v
      - name: Repeated layer input compatibility
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_repeated_layers.py' -v
      - name: Candidate publication ordering without host credentials
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_publication.py' -v
      - name: Candidate host admission and real canonical adapter
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_host*.py' -v
      - name: Protected candidate download admission and SDK wheel validation
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_download_entry.py' -v
      - name: Candidate OSS transfer and Linux atomic download
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_oss.py' -v
      - name: Authenticated source revalidation without cloud writes
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_revalidation.py' -v
      - name: Explicit untrusted byte acquisition and fresh cached verification
        run: |
          python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_acquisition.py' -v
          python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_cached_revalidation.py' -v
      - name: Candidate runtime provenance and Linux atomic installation
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_runtime.py' -v
      - name: Untrusted cache delivery protocol and protected snapshots
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_untrusted_cache.py' -v
      - name: Native CLI pins and bounded process contracts
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_native_cli.py' -v
      - name: Native candidate upload and provider observation contracts
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_native_upload.py' -v
      - name: Persistent continuation entry and parameterized binding without cloud calls
        run: |
          python3 -I -B -m unittest discover -s tests -p 'test_cn_release_*.py' -v
      - name: Real Linux cgroup escape and timeout verification
        run: sudo -n /usr/bin/python3 -I -B tests/cn_release_cgroup_linux.py
      - name: Alibaba release authentication endpoint and claims contracts
        run: python3 -I -B -m unittest discover -s tests -p 'test_aliyun_release_auth.py' -v
      - name: Sanitized credential action failures and cleanup
        run: python3 -I -B -m unittest discover -s tests -p 'test_auth_action_hardening.py' -v
      - name: Hong Kong original-artifact transfer without cloud calls
        run: |
          python3 -I -B tests/test_cn_hk_original_artifact_upload.py
          python3 -I -B tests/test_cn_hk_proof_integration.py
      - name: Reviewed candidate tool upgrade transaction
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_candidate_tool_upgrade.py' -v
      - name: Authenticated candidate download without cloud calls
        run: python3 -I -B tests/test_cn_candidate_authenticated_oss.py
      - name: Fixed SDK offline signing and model contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/candidate-auth-sdk"
          "$RUNNER_TEMP/candidate-auth-sdk/bin/pip" install --disable-pip-version-check oss2==2.19.1 alibabacloud-credentials==0.3.6 aliyun-python-sdk-core==2.16.0 aliyun-python-sdk-sts==3.1.2
          "$RUNNER_TEMP/candidate-auth-sdk/bin/python" -I -B tests/test_cn_candidate_authenticated_oss_sdk.py
      - name: Explicit formal budget and metadata admission
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_formal_budget_profile.py' -v
      - name: Exact formal source admission with legacy identity
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_exact_source_admission.py' -v
      - name: Formal save stream bounds
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_formal_save_bound.py' -v
      - name: Run single-agent safe diagnostic contracts without Docker
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_image_diagnostic.py' -v
      - name: Run gzip normalizer post-build boundaries without Docker
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_image_postbuild.py' -v
      - name: Run single-agent bounded post-build diagnostic contracts without Docker
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_agent_postbuild_diagnostic.py' -v
      - name: Run credential-free build-only contracts
        run: python3 -I -B -m unittest discover -s tests -p 'test_cloud_build_only.py' -v
      - name: Run offline registration input consistency contracts
        run: python3 -I -B -m unittest discover -s tests -p 'test_cn_main_registration.py' -v
      - name: Run isolated recovery contracts on trusted runner directories
        run: python3 -I -B .harness/scripts/vm/isolated_rehearsal_test.py
      - name: Verify isolated cleanup and sanitized provider failure boundaries
        run: |
          python3 -I -B .harness/scripts/vm/isolated_rehearsal_provider_contract_test.py
          python3 -I -B .harness/scripts/vm/isolated_rehearsal_provider_error_test.py
      - name: Verify isolated private RPC endpoints and signing without credentials
        run: python3 -I -B .harness/scripts/vm/isolated_rehearsal_endpoint_test.py

      - name: Strict Compose profile extension and unchanged install transactions
        run: |
          python3 -B .harness/scripts/generate-cn-maintenance-identities.py --check
          python3 -B -m unittest discover -s .harness/scripts/vm -p 'cn_compose_profile_extension_test.py' -v
          python3 -B -m unittest discover -s .harness/scripts/vm -p 'cn_tool_profile_test.py' -v
          python3 -B -m unittest discover -s .harness/scripts/vm -p 'prepare_cn_tool_install_test.py' -v
          python3 -B -m unittest discover -s .harness/scripts/vm -p 'cn_tool_install_transaction_test.py' -v

  isolated-business-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Install exact isolated browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/business-fixture" --no-audit --no-fund --save-exact tsx@4.20.6 zod@3.25.76 playwright@1.62.0
          "$RUNNER_TEMP/business-fixture/node_modules/.bin/playwright" install --with-deps chromium
      - name: Canonical business contracts and actual local TLS browser journey
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/business-fixture/node_modules"
          export CN_TEST_PLAYWRIGHT="$NODE_PATH/playwright"
          export CN_TEST_CHROMIUM="$(node -e 'process.stdout.write(require(process.env.CN_TEST_PLAYWRIGHT).chromium.executablePath())')"
          node --import "$NODE_PATH/tsx/dist/loader.mjs" --test tests/cn-release-business-runner.test.ts tests/cn-release-business-browser.integration.ts
