name: cloud-build-only
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/cloud-build-only.yml'
      - 'scripts/cloud-build-only.py'
      - 'tests/test_cloud_build_only.py'
permissions:
  contents: read
concurrency:
  group: cloud-build-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify build-only contract
        run: python3 -B -m unittest discover -s tests -p test_cloud_build_only.py -v
      - name: Resolve public base digests once for all five builds
        run: python3 scripts/cloud-build-only.py plan --output build-only-plan.json
      - uses: actions/upload-artifact@v6
        with:
          name: build-only-plan-${{ github.run_attempt }}
          path: build-only-plan.json
          retention-days: 7
          if-no-files-found: error
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service: [api, web, agent, sandbox, postgres]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: fcdd09cdc230b08947f19defb425e86988a3ecc0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-only-plan-${{ github.run_attempt }}
          path: plan
      - name: Build locally without registry or production writes
        working-directory: source
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 ../control/scripts/cloud-build-only.py build --plan ../plan/build-only-plan.json --service "$SERVICE" --output ../build-only-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: build-only-result-${{ github.run_attempt }}-${{ matrix.service }}
          path: build-only-result.json
          retention-days: 7
          if-no-files-found: error
