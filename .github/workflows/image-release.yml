name: ACR Node push verification
on: workflow_dispatch
jobs:
  verify:
    if: github.ref_name == 'ops/acr-node-push-check-44372189876'
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Verify identity and push pinned Node image
        env:
          ACR_USERNAME: ${{ secrets.WSX_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.WSX_ACR_PASSWORD }}
        shell: bash
        run: |
          case "$ACR_USERNAME" in
            yangjunshen@1177216024653153|yangjunshen@1177216024653153.onaliyun.com) echo 'CI identity matches yangjunshen' ;;
            '') echo 'CI username missing'; exit 1 ;;
            *) echo 'CI identity does not match yangjunshen' ;;
          esac
          registry=workspacex-cn-prod-registry.cn-shanghai.cr.aliyuncs.com
          digest=sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
          target="$registry/workspacex-prod/build-base-node"
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo
          fi
          printf '%s' "$ACR_PASSWORD" | skopeo login --authfile "$scratch/auth.json" --username "$ACR_USERNAME" --password-stdin "$registry"
          skopeo copy --authfile "$scratch/auth.json" --all --preserve-digests "docker://docker.io/library/node@$digest" "docker://$target:${digest/:/-}"
          skopeo inspect --authfile "$scratch/auth.json" --raw "docker://$target@$digest" > "$scratch/manifest"
          test "sha256:$(sha256sum "$scratch/manifest" | cut -d' ' -f1)" = "$digest"
          echo 'Push and digest verification succeeded'
