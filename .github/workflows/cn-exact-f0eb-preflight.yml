name: cn-exact-f0eb-preflight
on:
  pull_request:
    types: [labeled]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: cn-exact-f0eb-preflight-38251278777
  cancel-in-progress: false
jobs:
  byte-preflight-load:
    if: >-
      github.run_attempt == 1 && github.event.action == 'labeled' && github.event.label.name == 'cn-exact-f0eb-preflight-38251278777' && github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == 'boardx/workspacex' && github.event.pull_request.base.repo.full_name == 'boardx/workspacex' && github.event.pull_request.head.ref == 'worker/codex-cn-autonomous-release' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact original bytes only, supervised preflight and idle-daemon load
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          sudo -n env -i PATH="$PATH" GH_TOKEN="$GH_TOKEN" EXACT_CHECKOUT_SHA="$EXACT_CHECKOUT_SHA"
          GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME"
          GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -I -B scripts/cn-exact-f0eb-github.py
      - name: Export only bounded exact preflight diagnostics
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/cn-exact-f0eb-report" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/cn-exact-f0eb-report"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: exact-f0eb-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cn-exact-f0eb-report/result.json
            ${{ runner.temp }}/cn-exact-f0eb-report/resources.json
            ${{ runner.temp }}/cn-exact-f0eb-report/daemon-resources.json
            ${{ runner.temp }}/cn-exact-f0eb-report/selection.json
            ${{ runner.temp }}/cn-exact-f0eb-report/preflight.json
            ${{ runner.temp }}/cn-exact-f0eb-report/loaded.json
            ${{ runner.temp }}/cn-exact-f0eb-report/load-claim.json
            ${{ runner.temp }}/cn-exact-f0eb-report/before-image-ids.json
            ${{ runner.temp }}/cn-exact-f0eb-report/cleanup.json
          retention-days: 1
          if-no-files-found: warn
