# Policy v5: real lightweight merge checks. Full regression belongs to hourly/manual harness-acceptance.
name: harness-verify
on:
  pull_request:
    branches:
      - develop
  merge_group:
    branches:
      - develop
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: harness-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: single
env:
  CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
jobs:
  verify-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static control-plane boundaries (full harness self-tests run hourly)
        run: |-
          pnpm run lint:root-router
          pnpm run lint:oss-secret-scan
          node .harness/scripts/lint-ui-prototyper-single-source.mjs
          node .harness/scripts/lint-contract-state-names.mjs
          pnpm exec tsx .harness/scripts/lint-rewrite-coverage.mjs --strict
          pnpm exec tsx .harness/scripts/lint-contract-route-coverage.mjs --strict
      - name: Enforce lightweight PR and cumulative queue graph
        run: node .harness/scripts/ci-lightweight-graph.mjs
  verify-affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute baseline contracts and known affected unit tests; record deferred impact
        run: node .harness/scripts/ci-lightweight.mjs units
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lightweight-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lightweight/
          if-no-files-found: warn
  verify-full-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full workspace compilation
        run: pnpm turbo run build
      - name: Full workspace types and lint
        run: pnpm turbo run typecheck lint
  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PR live admission
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm harness merge-gate --pr ${{ github.event.pull_request.number }}
      - name: Cumulative queue live admission
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: pnpm harness merge-gate --merge-group
  backend-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backend contract source and dependency boundaries
        run: |-
          node .harness/scripts/lint-contract-source.mjs
          node .harness/scripts/lint-arch-deps.mjs apps/api/src
          node .harness/scripts/lint-edition-capabilities.mjs
  queue-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && (github.event_name == 'merge_group' || !cancelled())
    needs:
      - verify-control-plane
      - verify-affected
      - verify-full-compile
      - merge-gate
      - backend-required
    outputs:
      verification_mode: ${{ steps.verdict.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: verdict
        name: Require actual lightweight results; never certify full regression
        env:
          CI_QUEUE_NEEDS: ${{ toJSON(needs) }}
        run: node .harness/scripts/ci-lightweight.mjs queue
