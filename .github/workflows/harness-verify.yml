# harness-verify.yml — CI 门控
# 快速迭代策略（2026-07）：
#   - PR/push 只做轻量门控：受影响模块的 typecheck/lint/test（turbo --affected）+ 生成物漂移检查。
#     2026-08-15（ADR-106 batch-1/6，#1277）起拆成 `verify-control-plane` +
#     `verify-affected` 两个并行 job（原来是一个叫 `verify` 的顺序 job）——两段
#     互不依赖，拆开跑 wall-clock 是两者较慢的那个，不是相加。下面各处提到
#     "module verify"/"verify job" 指的是这两个 job 加起来那一层门控语义，
#     不是某个具体 job 名。
#   - 全栈烟测(fullstack-smoke)：PR/push 都跑，但只跑 `seeded` project（5 个非 core-loop 的
#     spec）。**信息性、不阻塞合并**（2026-08-06 人类裁决 #633：module verify 继续阻塞合并，
#     浏览器 e2e 不再阻塞合并，只阻塞发布）——`continue-on-error: true` 见下方 job。
#     `core-loop.spec.ts` 已移出本 job：它是唯一真正阻塞发布的 e2e spec，只在
#     backend-gates.yml 的 `e2e-core-loop` job 里跑（deploy 的前置条件），
#     理由与 5 分钟合并→上线 SLA 直接相关，见该 job 注释。
#   - 全量浏览器 e2e(e2e-full)：**不在 PR 上跑**（2026-08-05 人类指令：提高速度）。
#     它在 tag 发布、main push、每 3 小时定时、以及手动触发时跑。
#   - harness verify / 完整验证由本地开发流程承担（pnpm harness verify、verify:full）。

name: harness-verify

on:
  pull_request:
  push:
    branches: [main]
    # tag 发布时跑全量 —— e2e-full 已从 PR 上摘掉，发布前这一趟是它唯一的把关点。
    tags: ["v*"]
  schedule:
    # 每小时检查 main 是否有新合并（新 PR 落地即产生新 commit），有则跑全栈烟测。
    - cron: "0 * * * *"
    # 全量浏览器 e2e 每 3 小时跑一次。
    - cron: "30 */3 * * *"
  # 手动触发 e2e-full（#665）：它此前只在 `30 */3` 那个 cron 跑，改动它的人要等最多
  # 3 小时才知道结果，验证成本高到没人验证——这正是它连红 12 次无人察觉的一环。
  workflow_dispatch:
    inputs:
      run_e2e_full:
        description: "跑全量浏览器 e2e（e2e-full）"
        type: boolean
        default: true

jobs:
  # ADR-106 batch-1/6（#1277）：原 `verify` job 是一条顺序链——控制平面静态检查
  # （doctor/lint doctor/harness 自测，全部毫秒级、不碰 DB）与"受影响模块
  # typecheck/lint/test"（turbo --affected，唯一真正耗时的一步）串在一起跑。
  # 拆成两个并行 job，wall-clock ≈ 两者中较慢的那个，不是两者之和。
  #
  # ⚠ 范围刻意收窄，不是 ADR-106 描述的完整五 job 方案：
  #   1. 没有新增"全仓 typecheck/lint/build 强制门"（ADR-106 item 8 的 Job B）——
  #      2026-08-05 人类已经明确指令"PR 上不再跑全仓单测,只跑 affected,提高速度"
  #      （见下方 e2e-full job 注释），新增全仓强制门会直接推翻这条裁决，需要
  #      人类重新确认，不该由这个 issue 单方面改回去。
  #   2. 没有把这里的 control-plane job 换成本 PR 系列 #1273 新增的
  #      `verify:harness` 命令（尽管语义上更完整，含全部 19 个 lint doctor）——
  #      dry-run 实测发现 `verify:harness:raw` 里的 `lint:readiness --strict` 在
  #      当前 main（f4f0c3c5）上就是红的（统一队列引用了已关闭的 issue #750，
  #      跟本次改动无关，是 main 上已有的过期状态）。把它接进 CI 门控会让**所有**
  #      PR 立刻卡死，不是本 issue 该单方面承担的决定；已另开 issue 修那条过期
  #      引用，`lint:readiness` 干净之后再考虑把 control-plane job 换成
  #      `verify:harness` 一条命令。
  #   两项差距都是刻意的范围收窄，不是遗漏——本次只做"把已经在跑、已经全绿的
  #   两段拆成并行 job"这一件事。
  verify-control-plane:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --affected 需要能 diff 到 base 分支
          fetch-depth: 0

      # 不指定 version：pnpm/action-setup 从 package.json 的 packageManager 字段
      # (pnpm@9.0.0) 读取。两处都写会触发 ERR_PNPM_BAD_PM_VERSION。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (read .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Subagent 生成物未漂移
        run: |
          pnpm harness gen-subagents
          git diff --exit-code .claude/agents .codex/agents \
            || (echo "✗ subagent 生成物与 .harness/agents/*.yaml 不一致：改了 yaml 请重新跑 pnpm harness gen-subagents 并提交" && exit 1)

      # 审计链体检（ADR-012）。放在 PR 门控上的理由（2026-07-29 控制平面审计发现）：
      # 在此之前 doctor 只出现在 backend-gates.yml，而那份的触发条件是 push to main /
      # tag —— 即**合并之后**。假 passing、断证据、派生视图漂移全都在合入 main 才被发现，
      # 那时它已经是 main 的一部分了，属于事后审计而非门控。PR 阶段唯一的防线是本地
      # pre-push hook，而它装在未随 clone 分发的 .git/hooks 里、可被 --no-verify 一行绕过。
      #
      # 这里**不加 --strict**：strict 会把「passing 必须已合入 main」升为 FAIL，而 PR 阶段
      # 本来就还没合，是鸡生蛋（backend-gates.yml 那份注释里记着同一个坑）。合并后的
      # backend-gates 仍然跑 --strict，两道互补：PR 拦伪造证据，合并后拦未落地。
      - name: 审计链体检
        env:
          # doctor 的 issue 检查走 gh；没有 token 时它自己降级为 WARN 而非阻断
          GH_TOKEN: ${{ github.token }}
        run: pnpm harness doctor

      # 签核第 ① 件的材料完整性：ui.md 引用的截图集合 == ui-preview/ 实存集合。
      # 放在 PR 门控而不是 backend-gates 的理由：它只读 phases/**，不需要 Docker/PG，
      # 跑一次不到 100ms；而它要挡的失效（加一张图忘了写进索引、改文件名留下死链）
      # 恰恰发生在写 ui.md 的那个 PR 里，合并后才发现就晚了。
      # turbo --affected 覆盖不到它：phases/ 不是 workspace 包，改 phases/** 一个包都不 affected。
      - name: 签核 ① UI 材料完整性（截图引用集 == 实存集）
        run: node .harness/scripts/lint-ui-material.mjs

      # 签核第 ③ 件（API 契约）必须存在。ADR-023 决策一规定它二选一：
      #   packages/contracts/src/<束>.ts 存在，**或** domain.md 显式声明本束无对外 HTTP 面
      #   且 coverage.md 的「API 操作」列填可执行门控命令。「不接受沉默的第三种情况」。
      # 2026-07-30 实测：`grep "第 ③\|无对外 HTTP" .harness/scripts/` **零命中** ——
      # 该判定从来没有被执行过，而十一束里十束的契约文件不存在、其中十束已签「三件已确认」。
      # 架构师反证 CP-1：合规 fixture 阶段故意不建 <bundle>.ts ⇒ auditSignoff fails=0、
      # verify-uc-coverage exit 0 且打印「✅ 覆盖矩阵完整」。
      # 与上面两步同源的理由：它只读 phases/** 与 packages/contracts/src/**，毫秒级；
      # 而 phases/ 不是 workspace 包，turbo --affected 一个包都不 affected ⇒ 必须显式跑。
      - name: 签核 ③ API 契约必须存在（形态 A 契约文件 / 形态 B 显式声明无 HTTP 面）
        run: node .harness/scripts/lint-third-artifact.mjs

      # verification 必须真的会红。放在 PR 门控的理由与上一步同源，且更硬：
      # 2026-07-30 实测 `pnpm --filter web vitest run <任意路径>` **恒 exit 0**
      # （apps/web 没有 `vitest` 脚本，pnpm 在无匹配脚本时安静退 0），而 verify.ts 只看退出码
      # ⇒ 当时 21 个 feature / 84 点（已签核的 agent-runtime + skills 两束全部）今天就能
      # 整套全绿、零实现。这类失效**只在改 feature_list.json 的那个 PR 里产生**，
      # 而 phases/ 不是 workspace 包，turbo --affected 一个包都不 affected ⇒ 必须显式跑。
      # 它自带动态探针（每种形态构造必然失败的变体真跑一次），不需要 Docker/PG。
      - name: verification 必须真的会红（无恒 0 / 无不确定形态）
        run: node .harness/scripts/lint-verification-can-fail.mjs

      # harness 自己的测试（含上面两道门控的反证套件）。

      # 跨屏可达性：ADR-023 的签核屏必须是产品里走得到的屏，不是只能敲 URL 进的孤岛。
      # 本轮病根——十一束的 v2 屏全做好却全部孤立、导航连的是旧骨架屏——旧门控（只验单屏七态）
      # 一个都发现不了。这道门控双向核对「导航树 ↔ 契约束现行路由」，且只读源码/config，毫秒级。
      - name: 跨屏可达性（导航树 ↔ 契约束现行路由）
        run: node .harness/scripts/lint-nav-reachability.mjs

      # 不存在「写了但没人跑」的 e2e spec（#512）。
      # 2026-08-04 实测：`chat-read.spec.ts` 在 main 上红着且**红了很久无人发现**——
      # 有 `playwright.chat-read.config.ts`，但零个 npm script / CI job 调它。
      # 同一次审计还捞出 `responsive.spec.ts`（唯一引用它的是一条 feature verification
      # 命令，而那条命令不在 CI 里，且其 feature 已 passing ⇒ 永不再跑），
      # 而 phase-01 有四份 ui-preview/README 正以「它有断言」为由省略响应式截图。
      # 放在 PR 门控而不是 e2e-full 的理由：它只读 config/scripts/workflow 并跑
      # `playwright --list`（不起 webServer、不需要浏览器），秒级；而它要挡的失效
      # ——新加一条 spec 却忘了接进 testMatch——恰恰发生在加那条 spec 的 PR 里。
      # turbo --affected 覆盖不到：.harness/ 与 .github/ 都不是 workspace 包。
      - name: 不存在没人跑的 e2e spec（spec ↔ 门控可达性）
        run: node .harness/scripts/lint-spec-gate-coverage.mjs

      # harness 自己的测试（含上面那道门控的反证套件）。
      # 2026-07-30 发现：.harness/scripts/**.test.ts 共 100+ 条断言，**CI 里一条都没跑过** ——
      # turbo --affected 只认 workspace 包，.harness/ 不是包，改它一个包都不 affected。
      # 控制平面的测试不跑，等于控制平面没有测试。
      - name: harness 控制平面自测（含门控反证）
        run: pnpm exec vitest run --dir .harness

  # 与 verify-control-plane 并行——两者互不依赖（一个测控制平面本身，一个测
  # 业务包），拆开跑 wall-clock ≈ 两者较慢的那个，不是相加。这是本 issue
  # 唯一动的并行拆分，见上面 verify-control-plane 顶部注释里的范围说明。
  verify-affected:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --affected 需要能 diff 到 base 分支
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (read .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 只跑受本次改动影响的包（模块只测自己）。
      # PR：相对 base 分支；push main：相对上一个 commit。
      - name: 受影响模块 typecheck/lint/test
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          # #538 隔离门要求显式声明目标库（WORKSPACEX_DB 缺席 ⇒ setup 阶段直接拒绝）。
          # 这里声明 "workspacex" 是**诚实的**，不是绕门：GitHub 托管 runner 是独占的
          # 一次性 VM，postgres 由 ensureDatabase() 在本 job 里现起，不存在与任何其它
          # 会话共享的库——门要挡的「不知情地连上共享库」在这个环境里没有对象。
          # ⚠ 自建 runner（常驻机器）上**不得**照抄这行：那里的库是真共享的。
          WORKSPACEX_DB: workspacex
        run: pnpm turbo run typecheck lint test --affected

  fullstack-smoke:
    if: github.event_name != 'schedule' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # #633（人类裁决 2026-08-06）：不再阻塞合并——`continue-on-error: true` 让本 job
    # 无论步骤是否失败，check run 结论都报 success，仅剩信息性价值（红了不拦 PR，
    # 但 evidence/日志仍然照常上传，供人回看）。真正阻塞发布的是 backend-gates.yml 的
    # `e2e-core-loop`（deploy 前置条件）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Execute trusted full-stack smoke
        shell: bash
        run: |
          mkdir -p phases/phase-01-run-a-project/evidence/ci
          set +e
          pnpm run verify:fullstack-smoke 2>&1 | tee phases/phase-01-run-a-project/evidence/ci/runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            pnpm exec tsx .harness/scripts/record-readiness-evidence.ts \
              --phase 01 --kind runtime --commit "$GITHUB_SHA" \
              --command "pnpm run verify:fullstack-smoke" \
              --log phases/phase-01-run-a-project/evidence/ci/runtime.log \
              --output phases/phase-01-run-a-project/evidence/ci/runtime-manifest.json
          fi
          exit "$status"
      - name: Upload runtime evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-fullstack-smoke-evidence-${{ github.run_id }}
          path: |
            phases/phase-01-run-a-project/evidence/ci/
            apps/web/test-results/
          if-no-files-found: error

  e2e-full:
    # 2026-08-05 人类指令：「只有 tag 发布的时候才做，PR 的时候先不做，以提高速度」。
    #
    # ⚠ 摘掉的是**这一个** job，不是 PR 的门控。PR 上仍然跑：
    #   · `verify`          —— 受影响模块的 typecheck/lint/test + 全部 harness 门控；
    #   · `fullstack-smoke` —— 真浏览器 + 真 docker 栈，`seeded` project（5 个非
    #                          core-loop 的 spec），信息性、不阻塞（见该 job 注释）。
    #   人类八步的进度板 `core-loop.spec.ts`（2026-08-06 起，#633）**不在** PR 上跑，
    #   只在 backend-gates.yml 的 `e2e-core-loop` job 里跑，作为发布前置条件——
    #   「八步有没有退化」现在是发布门，不是 PR 门。
    #
    # ⚠ 代价要说清楚：**PR 上不再跑全量单测**（4500+ 条）。一个只被 e2e-full 覆盖的
    #   回归，现在最早在 tag 发布或下一个 3 小时定时才会暴露，而不是在 PR 上。
    #   这是刻意换来的速度，不是疏忽 —— 谁要改回去，改这一行即可。
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || github.event.schedule == '30 */3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Execute uncached trusted full gate
        shell: bash
        run: |
          mkdir -p phases/phase-01-run-a-project/evidence/ci
          set +e
          TURBO_FORCE=true pnpm run verify:full 2>&1 | tee phases/phase-01-run-a-project/evidence/ci/e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            pnpm exec tsx .harness/scripts/record-readiness-evidence.ts \
              --phase 01 --kind e2e --commit "$GITHUB_SHA" \
              --command "TURBO_FORCE=true pnpm run verify:full" \
              --log phases/phase-01-run-a-project/evidence/ci/e2e.log \
              --output phases/phase-01-run-a-project/evidence/ci/e2e-manifest.json
          fi
          exit "$status"
      # Chat 读写链路（#405 的 spec，#512 把它接进门控）。
      #
      # ⚠ 为什么是**本 job 里的一步**，而不是新 job、也不是塞进 `verify:full`：
      #   · 新 job → 全仓只有一台自建 runner，多一个 job 就是多一份排队，硬瓶颈。
      #   · 塞进 `verify:full:raw` → `verify:full` 整条链共用**一个**隔离作用域，而
      #     chat-read 的 webServer 启动链里有 `createdb "$WORKSPACEX_DB"`；库已被
      #     fullstack-smoke 那一段建过 ⇒ createdb 非零退出 ⇒ `&&` 链断在这里，
      #     红的原因会是「库已存在」而不是「Chat 坏了」。所以它要**自己的**隔离作用域，
      #     由 `pnpm run verify:chat-read`（自带 with-test-isolation 外壳）提供。
      #   · 合进 playwright.fullstack-smoke.config.ts 的 project 也做不到：chat-read 要求
      #     API 进程带 `KERNEL_ALLOW_TEST_PRINCIPAL=1` + `KERNEL_AGENT_CATALOG_SCHEMA=
      #     chat_wave2_fixture` 启动（apps/api/src/kernel.module.ts:610-613 在**合成时**读一次），
      #     而 webServer 是 config 级的 ⇒ 打开它就等于把整轮 smoke 的 PUBLISHED_AGENT_READER
      #     全部改指 fixture schema，包括 #492 的八步闭环——那是人类交付验收的唯一机械依据。
      #
      # `if: always()` 让它不被上一步的红吞掉：两条链路各自的红都要能被看见。
      - name: Execute Chat read/write journey (own isolation scope)
        if: always()
        run: pnpm run verify:chat-read

      # 用户个人资料自助服务 + 组织团队管理（#638/#639）。同上一步同一个理由要**自己的**
      # 隔离作用域：它的 webServer 链也带 `createdb`，共用 `verify:full` 的作用域会撞上
      # 「库已存在」；而且这条 spec 会真的改掉登录密码（见
      # `e2e/self-service-profile-fixture.ts` 文件头），不能跟任何共享种子账号的 spec
      # 挤在同一个 org/DB 里跑。
      - name: Execute self-service profile journey (own isolation scope)
        if: always()
        run: pnpm run verify:self-service-profile

      - name: Upload E2E evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-e2e-full-evidence-${{ github.run_id }}
          path: |
            phases/phase-01-run-a-project/evidence/ci/
            apps/web/test-results/
          if-no-files-found: error
