# REVIEW DRAFT ONLY. New diagnostic/* branch replacement of registered harness-verify.yml.
# Never apply to PR/main; fixed candidate only, targeted success gates the original full suite.
name: board-focus-fixture-validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: board-focus-fixture-validation-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  targeted:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/diagnostic/')
    name: board-focus-candidate-targeted
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIAGNOSTIC_CASE_LABEL: targeted
    steps:
      - name: Checkout reviewed candidate validation caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve caller outside original candidate workspace
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/wsx-board-candidate-targeted"
          install -m 600 "$GITHUB_WORKSPACE/ci-receipts/diagnostic-plan-v2/board-candidate-validation.mjs" "$RUNNER_TEMP/wsx-board-candidate-caller.mjs"
          sha256sum "$GITHUB_WORKSPACE/ci-receipts/diagnostic-plan-v2/board-candidate-validation.mjs" "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" > "$RUNNER_TEMP/wsx-board-candidate-targeted/controller-file.sha256"
      - name: Checkout exact reviewed eight-line fixture candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3677ab3953da24b8d6ba6b5bba027e8cd1663f59
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Set up original pnpm package
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: package.json
      - name: Set up exact original Node version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Bind original runner and complete candidate source manifest
        run: node "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" capture
      - name: Install unchanged frozen candidate dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify complete installed source before optional credential probe
        run: node "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" verify-source
      - name: Verify original optional dedicated public import authentication
        env:
          WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN: ${{ secrets.WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          node .harness/scripts/ci-skill-import-auth-probe.mjs | tee "$RUNNER_TEMP/wsx-board-candidate-targeted/auth-probe.json"
      - name: Execute fixed six patched Board cases
        env:
          WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN: ${{ secrets.WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          node "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" run 2>&1 | tee "$RUNNER_TEMP/wsx-board-candidate-targeted/execution.log"
      - name: Retain targeted candidate receipts and original Playwright output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: board-focus-candidate-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wsx-board-candidate-targeted/
            apps/web/test-results/
          if-no-files-found: error
          retention-days: 7
  full:
    needs: targeted
    if: needs.targeted.result == 'success' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/diagnostic/')
    name: board-focus-candidate-fullstack
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIAGNOSTIC_CASE_LABEL: full
    steps:
      - name: Checkout reviewed candidate validation caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve caller outside original candidate workspace
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/wsx-board-candidate-full"
          install -m 600 "$GITHUB_WORKSPACE/ci-receipts/diagnostic-plan-v2/board-candidate-validation.mjs" "$RUNNER_TEMP/wsx-board-candidate-caller.mjs"
          sha256sum "$GITHUB_WORKSPACE/ci-receipts/diagnostic-plan-v2/board-candidate-validation.mjs" "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" > "$RUNNER_TEMP/wsx-board-candidate-full/controller-file.sha256"
      - name: Checkout exact reviewed eight-line fixture candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3677ab3953da24b8d6ba6b5bba027e8cd1663f59
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Set up original pnpm package
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: package.json
      - name: Set up exact original Node version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Bind original runner and complete candidate source manifest
        run: node "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" capture
      - name: Install unchanged frozen candidate dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify complete installed source before optional credential probe
        run: node "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" verify-source
      - name: Verify original optional dedicated public import authentication
        env:
          WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN: ${{ secrets.WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          node .harness/scripts/ci-skill-import-auth-probe.mjs | tee "$RUNNER_TEMP/wsx-board-candidate-full/auth-probe.json"
      - name: Execute original full-stack command and all project dependencies
        env:
          WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN: ${{ secrets.WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          node "$RUNNER_TEMP/wsx-board-candidate-caller.mjs" run 2>&1 | tee "$RUNNER_TEMP/wsx-board-candidate-full/execution.log"
      - name: Retain full candidate receipts and original Playwright output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: board-focus-candidate-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wsx-board-candidate-full/
            apps/web/test-results/
          if-no-files-found: error
          retention-days: 7
