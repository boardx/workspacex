# REVIEW DRAFT ONLY. Proposed replacement of .github/workflows/harness-verify.yml
# on a NEW diagnostic/* branch. Never put this replacement on PR/main.
name: board-six-case-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: board-six-case-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  board-six-case-diagnostic:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/diagnostic/')
    name: board-six-case-diagnostic-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: baseline
            sha: 9f9b80bba679c8cc28e1210e620b44f67215fa24
          - label: final
            sha: 89ce18e3ac07b3a5267d7ecabcb2f459d95996a6
    env:
      DIAGNOSTIC_CASE_LABEL: ${{ matrix.label }}
    steps:
      - name: Checkout reviewed diagnostic caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # original v5 resolved SHA
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed caller outside original target workspace
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/wsx-board-six-case-${DIAGNOSTIC_CASE_LABEL}"
          install -m 600 "$GITHUB_WORKSPACE/ci-receipts/diagnostic-plan/board-six-case-diagnostic.mjs" "$RUNNER_TEMP/wsx-board-six-case-caller.mjs"
          sha256sum "$GITHUB_WORKSPACE/ci-receipts/diagnostic-plan/board-six-case-diagnostic.mjs" "$RUNNER_TEMP/wsx-board-six-case-caller.mjs" > "$RUNNER_TEMP/wsx-board-six-case-${DIAGNOSTIC_CASE_LABEL}/controller-file.sha256"
      - name: Checkout exact unchanged target source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Set up original pnpm package
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # original v4.4.0 resolved SHA
        with:
          package_json_file: package.json
      - name: Set up exact original Node version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # original v5 resolved SHA
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Bind original runner and preserve complete target source manifest
        run: node "$RUNNER_TEMP/wsx-board-six-case-caller.mjs" capture
      - name: Install original frozen target dependencies
        run: pnpm install --frozen-lockfile
      - name: Diagnose exactly six Board cases in original sealed runtime
        env:
          WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN: ${{ secrets.WORKSPACEX_SKILL_IMPORT_GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wsx-board-six-case-${DIAGNOSTIC_CASE_LABEL}"
          set -o pipefail
          node "$RUNNER_TEMP/wsx-board-six-case-caller.mjs" run 2>&1 | tee "$RUNNER_TEMP/wsx-board-six-case-${DIAGNOSTIC_CASE_LABEL}/diagnostic.log"
      - name: Retain independent diagnostic result and source manifests
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # original v6 resolved SHA
        with:
          name: board-six-case-diagnostic-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wsx-board-six-case-${{ matrix.label }}/
            apps/web/test-results/
          if-no-files-found: error
          retention-days: 7
