# Temporary validation branch only; never included in a product PR.
name: Persona race validation (no deployment)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  persona-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Three real persona generation and reload journeys
        run: pnpm exec tsx .harness/scripts/with-test-isolation.ts -- pnpm --filter web exec playwright test --config playwright.chat-read.config.ts --project=chat-read e2e/copilotkit-v2-persona-archived.spec.ts --grep CK-P6 --repeat-each=3 --workers=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: persona-race-browser-${{ github.run_id }}
          path: apps/web/test-results/chat-read/
          if-no-files-found: warn
