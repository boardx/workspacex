name: aidt-devapp-acceptance
run-name: AIDT acceptance · ${{ inputs.expected_release_tag }}

on:
  workflow_dispatch:
    inputs:
      acceptance_profile:
        description: Explicit control profile; baseline results never cover v2-voice-20261122
        type: choice
        options:
          - baseline
          - v2-voice-20261122
        default: baseline
        required: true
      expected_source_sha:
        description: Exact deployed application source (40 lowercase hex)
        type: string
        required: true
      expected_release_tag:
        description: Exact deployed immutable image tag (run-attempt)
        type: string
        required: true
      live_dev:
        description: Opt in to new owned synthetic QA project + screenshots on Dev (one bounded Design generation)
        type: boolean
        default: false
      entry_diagnostic_only:
        description: Read-only login/ordinary-role/home-entry evidence; never create a project or run the journey
        type: boolean
        default: false
      provision_ordinary_qa:
        description: Explicitly create one dedicated consultant QA through normal one-use organization invitation APIs; credentials remain in memory
        type: boolean
        default: false
      reusable_ordinary_qa:
        description: Use the dedicated ordinary QA credentials from the protected Devapp QA environment
        type: boolean
        default: false
      agent_qa_review:
        description: Explicit agent-operated software QA review through the fixed source-bound review issue; not human classroom acceptance
        type: boolean
        default: false
      isolated_native:
        description: Run native scenarios against exact candidate in isolated hosted services (models are loopback)
        type: boolean
        default: true

permissions:
  contents: read

# Shares the designated QA account with the existing read-only/real-model workflow.
concurrency:
  group: real-model-chat-evidence
  cancel-in-progress: false

jobs:
  controls:
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle_manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
      AIDT_ACCEPTANCE_PROFILE: ${{ inputs.acceptance_profile }}
      AIDT_LIVE_DEV: ${{ inputs.live_dev }}
      AIDT_PROVISION_ORDINARY_QA: ${{ inputs.provision_ordinary_qa }}
      AIDT_REUSABLE_ORDINARY_QA: ${{ inputs.reusable_ordinary_qa }}
      AIDT_ENTRY_DIAGNOSTIC_ONLY: ${{ inputs.entry_diagnostic_only }}
      AIDT_AGENT_QA_REVIEW: ${{ inputs.agent_qa_review }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate exact application identity and test control guards
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_RELEASE_TAG" =~ ^[0-9]+-[0-9]+$ ]]
          node --input-type=module -e 'import {ordinaryQaProvisioningRequested} from "./apps/web/e2e/support/devapp-aidt-acceptance.mjs"; ordinaryQaProvisioningRequested(process.env, {entryDiagnosticOnly:process.env.AIDT_ENTRY_DIAGNOSTIC_ONLY==="true"});'
          node --input-type=module -e 'import {agentQaReviewRequested} from "./apps/web/e2e/support/devapp-aidt-agent-review.mjs"; agentQaReviewRequested(process.env);'
          node --test scripts/tests/devapp-aidt-acceptance.test.mjs scripts/tests/devapp-aidt-auth-readonly.test.mjs scripts/tests/devapp-aidt-print-evidence.test.mjs scripts/tests/devapp-aidt-chat-evidence.test.mjs scripts/tests/devapp-aidt-teaching-guard.test.mjs scripts/tests/devapp-aidt-qa-identity.test.mjs scripts/tests/devapp-aidt-navigation.test.mjs scripts/tests/devapp-aidt-native-survey.test.mjs scripts/tests/devapp-aidt-execution-read-independent.test.mjs
          node --test scripts/tests/devapp-aidt-history-diagnostic.independent.test.mjs
          node --test scripts/tests/devapp-aidt-first-rejected-mutation.independent.test.mjs
          node --test scripts/tests/devapp-aidt-outcome-navigation-diagnostic.independent.test.mjs
          node --test scripts/tests/devapp-aidt-s1-wait-diagnostic.independent.test.mjs
          node --test scripts/tests/devapp-aidt-s1-native-outcome.independent.test.mjs
          node --test scripts/tests/devapp-aidt-s6-source-independent.test.mjs
          node --test scripts/tests/devapp-aidt-v2-profile.test.mjs scripts/tests/devapp-aidt-v2-print.test.mjs scripts/tests/devapp-aidt-v2-integration.test.mjs scripts/tests/devapp-aidt-v2-request-guard.test.mjs scripts/tests/devapp-aidt-v2-action-window.test.mjs scripts/tests/devapp-aidt-v2-ui.test.mjs scripts/tests/devapp-aidt-v2-asr-review.test.mjs scripts/tests/devapp-aidt-v2-s2-asr.test.mjs scripts/tests/devapp-aidt-v2-negative.test.mjs apps/web/e2e/support/devapp-aidt-v2-survey-eight-guard-independent.test.mjs apps/web/e2e/support/devapp-aidt-v2-design-source-images-independent.test.mjs apps/web/e2e/support/devapp-aidt-v2-crud-independent.test.mjs apps/web/e2e/support/devapp-aidt-v2-virtual-normal-flow-independent.test.mjs
          node --test .harness/scripts/ci-aidt-native.test.mjs
          node --test scripts/tests/devapp-aidt-agent-review.test.mjs scripts/tests/devapp-aidt-entry-proof.test.mjs
          node --test scripts/tests/devapp-aidt-agent-interview-independent.test.mjs scripts/tests/devapp-aidt-agent-interview-identity-independent.test.mjs
          node --check apps/web/e2e/support/devapp-aidt-acceptance.mjs
          node --check apps/web/e2e/support/devapp-aidt-journey.mjs
          node --check apps/web/e2e/support/devapp-aidt-agent-review.mjs
          node --input-type=module -e 'import {acceptanceProfile} from "./apps/web/e2e/support/devapp-aidt-v2-profile.mjs"; acceptanceProfile(process.env);'
      - name: Package only audited acceptance tools
        id: bundle
        if: ${{ inputs.live_dev }}
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/aidt-acceptance-tools"
          node scripts/build-aidt-acceptance-bundle.mjs "$bundle_path"
          manifest_digest="$(sha256sum "$bundle_path/SHA256SUMS")"
          printf 'manifest_sha256=%s\n' "${manifest_digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.live_dev }}
        with:
          name: aidt-acceptance-tools
          path: ${{ runner.temp }}/aidt-acceptance-tools/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  isolated-native:
    if: ${{ inputs.isolated_native && !inputs.entry_diagnostic_only && github.ref == 'refs/heads/develop' }}
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      RUNNER_ENVIRONMENT: github-hosted
      AIDT_NATIVE_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      NEXT_PUBLIC_ENABLE_AIDT: '1'
      ENABLE_AIDT_MODULE: '1'
      NEXT_PUBLIC_ENABLE_PROJECT_MEMBER_CHAT: '1'
      ENABLE_PROJECT_MEMBER_CHAT: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          path: control
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: .harness
      - uses: actions/setup-node@v4
        with:
          node-version-file: candidate/.nvmrc
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: candidate/package.json
      - name: Install isolated candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Verify candidate and prepare exact native scenarios
        working-directory: candidate
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$GITHUB_SHA^{commit}" || git fetch --no-tags origin "$GITHUB_SHA"
          node "$GITHUB_WORKSPACE/control/.harness/scripts/ci-aidt-native.mjs" prepare
      - name: Run native UI in isolated services
        id: native
        working-directory: candidate
        continue-on-error: true
        run: node "$GITHUB_WORKSPACE/control/.harness/scripts/ci-fullstack-runtime.mjs" aidt-native -- pnpm exec tsx .harness/scripts/with-test-isolation.ts -- pnpm --filter web exec playwright test --config playwright.aidt-native.config.ts
      - name: Verify every declared native case
        if: ${{ always() }}
        working-directory: candidate
        env:
          AIDT_NATIVE_TEST_OUTCOME: ${{ steps.native.outcome }}
        run: node "$GITHUB_WORKSPACE/control/.harness/scripts/ci-aidt-native.mjs" verdict
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: aidt-isolated-native-evidence
          path: |
            candidate/apps/web/test-results/aidt-native/
            candidate/apps/web/test-results/aidt-native-control/
          retention-days: 7

  live-dev:
    if: ${{ inputs.live_dev && github.ref == 'refs/heads/develop' }}
    needs: controls
    runs-on: [self-hosted, linux, x64, workspacex]
    environment: aidt-devapp-qa
    # Each profile has its own finite wall clock and exact operation/output manifest.
    timeout-minutes: ${{ inputs.acceptance_profile == 'v2-voice-20261122' && 360 || 152 }}
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
      AIDT_ACCEPTANCE_PROFILE: ${{ inputs.acceptance_profile }}
      AIDT_LIVE_DEV: ${{ inputs.live_dev }}
      AIDT_PROVISION_ORDINARY_QA: ${{ inputs.provision_ordinary_qa }}
      AIDT_REUSABLE_ORDINARY_QA: ${{ inputs.reusable_ordinary_qa }}
      AIDT_ENTRY_DIAGNOSTIC_ONLY: ${{ inputs.entry_diagnostic_only }}
      AIDT_AGENT_QA_REVIEW: ${{ inputs.agent_qa_review }}
      DEBUG: ''
      PWDEBUG: ''
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
      NODE_OPTIONS: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # No checkout, arbitrary shell entry point, credential copy, or source install on the Dev host.
      - name: Create this attempt's private directory
        id: private
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_RELEASE_TAG" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          AIDT_ACCEPTANCE_ROOT="$(/usr/bin/python3 -I -B -c 'import os; print(os.path.join(os.path.realpath(os.path.dirname(os.path.abspath(os.environ["RUNNER_TEMP"]))), "wsx-aidt-acceptance-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]))')"
          [[ ! -e "$AIDT_ACCEPTANCE_ROOT" && ! -L "$AIDT_ACCEPTANCE_ROOT" ]]
          mkdir -m 700 "$AIDT_ACCEPTANCE_ROOT"
          printf '%s' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA" > "$AIDT_ACCEPTANCE_ROOT/.owner"
          mkdir -m 700 "$AIDT_ACCEPTANCE_ROOT/source"
          printf 'AIDT_ACCEPTANCE_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$AIDT_ACCEPTANCE_ROOT" "$AIDT_ACCEPTANCE_ROOT" >> "$GITHUB_ENV"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: aidt-acceptance-tools
          path: ${{ env.AIDT_ACCEPTANCE_ROOT }}/source
      - name: Verify bounded bundle and declared Node version
        id: bundle
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          AIDT_BUNDLE_MANIFEST_SHA256: ${{ needs.controls.outputs.bundle_manifest_sha256 }}
        run: |
          set -euo pipefail
          cd "$AIDT_ACCEPTANCE_ROOT/source"
          [[ -z "$(find . ! -type d ! -type f -print -quit)" ]] || { echo 'BUNDLE_UNEXPECTED_ENTRY_TYPE' >&2; exit 1; }
          [[ "$AIDT_BUNDLE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'BUNDLE_EXPECTED_MANIFEST_MISSING' >&2; exit 1; }
          actual_manifest="$(sha256sum SHA256SUMS)"
          [[ "${actual_manifest%% *}" == "$AIDT_BUNDLE_MANIFEST_SHA256" ]] || { echo 'BUNDLE_MANIFEST_MISMATCH' >&2; exit 1; }
          # The trusted builder manifests each allowed path once. The checksum and count gates exclude unlisted files.
          [[ "$(find . -type f -print0 | tr -cd '\000' | wc -c)" -eq $(( $(wc -l < SHA256SUMS) + 1 )) ]] || { echo 'BUNDLE_FILE_SET_MISMATCH' >&2; exit 1; }
          sha256sum --check --strict SHA256SUMS || exit 1
          AIDT_NODE_VERSION="$(cat .nvmrc)"
          [[ "$AIDT_NODE_VERSION" =~ ^[1-9][0-9]*(\.[0-9]+\.[0-9]+)?$ ]]
          printf 'node-version=%s\n' "$AIDT_NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.bundle.outputs.node-version }}
      - name: Install only pinned browser test tools
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$AIDT_ACCEPTANCE_ROOT/source"
          [[ "$(node -p 'require("./acceptance-source.json").controlSource')" == "$GITHUB_SHA" ]]
          touch "$AIDT_ACCEPTANCE_ROOT/npm-user-config" "$AIDT_ACCEPTANCE_ROOT/npm-global-config"
          npm install --ignore-scripts --omit=optional --no-audit --no-fund --userconfig "$AIDT_ACCEPTANCE_ROOT/npm-user-config" --globalconfig "$AIDT_ACCEPTANCE_ROOT/npm-global-config" --cache "$AIDT_ACCEPTANCE_ROOT/npm-cache" > "$AIDT_ACCEPTANCE_ROOT/install.log" 2>&1
          node node_modules/playwright/cli.js install chromium > "$AIDT_ACCEPTANCE_ROOT/browser-install.log" 2>&1
      - name: Run bounded live Dev acceptance and safe screenshots
        id: live
        continue-on-error: true
        # A JavaScript action receives the runner's artifact authority in memory; shell steps do not.
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          AIDT_REUSABLE_QA_IDENTITY_SHA256: ${{ vars.AIDT_REUSABLE_QA_IDENTITY_SHA256 }}
          AIDT_REUSABLE_QA_EMAIL: ${{ inputs.reusable_ordinary_qa && secrets.AIDT_REUSABLE_QA_EMAIL || '' }}
          AIDT_REUSABLE_QA_PASSWORD: ${{ inputs.reusable_ordinary_qa && secrets.AIDT_REUSABLE_QA_PASSWORD || '' }}
        with:
          debug: false
          script: |
            const path = require('node:path');
            const fs = require('node:fs');
            const { spawn, spawnSync } = require('node:child_process');
            const root = process.env.AIDT_ACCEPTANCE_ROOT;
            if (!root || root !== path.resolve(root) || /[\r\n]/.test(root)
                || !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ID || '')
                || !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ATTEMPT || '')
                || !/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '')
                || path.basename(root) !== `wsx-aidt-acceptance-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`) {
              throw new Error('AIDT_PRIVATE_PROCESS_SCOPE_INVALID');
            }
            const source = path.join(root, 'source');
            for (const directory of [root, source]) {
              const info = fs.lstatSync(directory);
              if (!info.isDirectory() || info.isSymbolicLink()) throw new Error('AIDT_PRIVATE_PROCESS_SCOPE_INVALID');
            }
            const marker = path.join(root, '.owner');
            const info = fs.lstatSync(marker);
            if (!info.isFile() || info.isSymbolicLink()
                || fs.readFileSync(marker, 'utf8') !== `${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}:${process.env.GITHUB_SHA}`) {
              throw new Error('AIDT_PRIVATE_PROCESS_OWNER_MISMATCH');
            }
            const childEnv = { ...process.env };
            for (const key of ['INPUT_GITHUB-TOKEN', 'INPUT_GITHUB_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN']) delete childEnv[key];
            const probeEnv = { ...childEnv };
            for (const key of ['AIDT_REUSABLE_QA_EMAIL', 'AIDT_REUSABLE_QA_PASSWORD']) delete probeEnv[key];
            const declared = fs.readFileSync(path.join(source, '.nvmrc'), 'utf8').trim();
            const probe = spawnSync('node', ['-p', 'JSON.stringify({version:process.versions.node,executable:process.execPath})'], {
              cwd: source, env: probeEnv, encoding: 'utf8', timeout: 10000, maxBuffer: 1024, shell: false,
            });
            let selected;
            try { selected = JSON.parse(probe.stdout); } catch { throw new Error('AIDT_DECLARED_NODE_UNAVAILABLE'); }
            if (probe.status !== 0 || !selected || !/^22(?:\.\d+\.\d+)?$/.test(declared)
                || !/^22\.\d+\.\d+$/.test(selected.version || '')
                || (declared !== '22' && declared !== selected.version)
                || !path.isAbsolute(selected.executable || '')) throw new Error('AIDT_DECLARED_NODE_UNAVAILABLE');
            // Keep the artifact authority in this job's memory; no token is copied to a file or argument.
            // Unneeded repository API tokens are removed from the child environment.
            const code = await new Promise(resolve => {
              const child = spawn(selected.executable, [path.join(source, 'apps/web/e2e/support/devapp-aidt-acceptance.mjs')], {
                cwd: source, env: childEnv, stdio: 'inherit', shell: false,
              });
              child.once('error', () => resolve(null));
              child.once('close', code => resolve(code));
            });
            if (code !== 0) core.setFailed('AIDT_LIVE_ACCEPTANCE_FAILED');
      - name: Upload only explicit safe evidence types
        if: ${{ always() && steps.private.outputs.owned == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aidt-live-dev-evidence
          path: |
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/acceptance.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/*.png
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/qa-report-*.md
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/qa-system-*.pdf
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/qa-system-*.html
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-preflight-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-student-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U01-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U02-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U03-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U04-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U05-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U06-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U07-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U08-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U09-request.json
            ${{ env.AIDT_ACCEPTANCE_ROOT }}/output/agent-qa-interview-U10-request.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve acceptance failure
        if: ${{ always() }}
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: test "$LIVE_OUTCOME" = success
      - name: Remove only this attempt's private directory
        if: ${{ always() && steps.private.outputs.owned == 'true' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED >&2; exit 1; }
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED >&2; exit 1; }
          AIDT_ACCEPTANCE_ROOT="$(/usr/bin/python3 -I -B -c 'import os; print(os.path.join(os.path.realpath(os.path.dirname(os.path.abspath(os.environ["RUNNER_TEMP"]))), "wsx-aidt-acceptance-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]))')"
          [[ -d "$AIDT_ACCEPTANCE_ROOT" && ! -L "$AIDT_ACCEPTANCE_ROOT" && -f "$AIDT_ACCEPTANCE_ROOT/.owner" && ! -L "$AIDT_ACCEPTANCE_ROOT/.owner" ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED >&2; exit 1; }
          [[ "$(cat "$AIDT_ACCEPTANCE_ROOT/.owner")" == "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA" ]] || { echo PRIVATE_DIRECTORY_OWNER_MISMATCH >&2; exit 1; }
          rm -rf -- "$AIDT_ACCEPTANCE_ROOT"
