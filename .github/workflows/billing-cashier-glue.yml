name: Billing cashier real integration
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  merge_group:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: billing-cashier-glue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: scope
        env:
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node .harness/scripts/ci-billing-scope.mjs
  billing-cashier-glue:
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the API driver's matching Chromium
        run: pnpm --filter api exec playwright install --with-deps chromium
      - name: Real Next / Billing API / PostgreSQL / signed merchant and callback
        run: pnpm exec tsx .harness/scripts/with-test-isolation.ts -- pnpm --filter api exec vitest run --config vitest.billing-cashier.config.ts
      - name: Preserve integration evidence, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: billing-cashier-glue-${{ github.run_id }}
          path: |
            phases/phase-21-billing-payment/sprints/sprint-06/evidence/actual-glue/
            apps/api/test-results/billing-stripe/
          if-no-files-found: warn
