name: hourly-regression-report
on:
  workflow_run:
    workflows: [harness-acceptance]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: hourly-regression-report
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'boardx/workspacex' && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Report hourly failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .harness/scripts/hourly-regression-issues.mjs
