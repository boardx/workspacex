# Engineering draft: has not been dispatched or validated against the real registry.
# Install the matching scripts/hosted-release.py before enabling this workflow.
name: build-cn-release-artifacts

on:
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      release:
        required: true
        type: string
      platform:
        required: false
        default: linux/amd64
        type: string
      source_branch:
        description: Reviewed source admission branch; never an image build argument
        required: false
        default: main
        type: string
    outputs:
      attempt_id:
        description: Exact producer attempt
        value: ${{ jobs.seal.outputs.attempt_id }}
      sealed_artifact:
        description: Sealed artifact name for this run attempt
        value: ${{ jobs.seal.outputs.sealed_artifact }}
  workflow_dispatch:
    inputs:
      shared_image_service:
        description: Optional service diagnostic; all publishes a complete release set
        required: false
        default: all
        type: choice
        options: [all, api, web, agent, sandbox, postgres]
      shared_images_only:
        description: Build and push shared ACR images on hosted runners; no host preparation or deployment
        required: false
        default: false
        type: boolean
      registry_probe_only:
        description: Only test public ACR login and push/pull; do not build or deploy applications
        required: false
        default: false
        type: boolean
      release_sha:
        description: Exact 40-hex source commit
        required: true
        type: string
      release:
        description: Semantic release identifier
        required: true
        type: string
      platform:
        description: Reviewed production image platform
        required: true
        default: linux/amd64
        type: choice
        # ARM requires a separately reviewed native runner or emulation setup.
        options: [linux/amd64]

      source_branch:
        description: Reviewed source admission branch
        required: true
        default: main
        type: choice
        options: [main, develop]

permissions:
  contents: read

# A retry must rerun all jobs: attempts never borrow plans/results from earlier runs.
# Serialize immutable registry tags without cancelling a partially published attempt.
concurrency:
  group: hosted-cn-artifacts-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  shared-images:
    if: github.event_name == 'workflow_dispatch' && inputs.shared_images_only && !inputs.registry_probe_only
    uses: ./.github/workflows/image-release.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'cn' || 'devapp' }}
      service: ${{ inputs.shared_image_service }}
      build_only: true
    secrets: inherit

  registry-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.registry_probe_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCKER_CONFIG: /tmp/wsx-acr-probe-${{ github.run_id }}-${{ github.run_attempt }}
      REGISTRY: ${{ vars.WSX_ACR_REGISTRY }}
      REGISTRY_PREFIX: ${{ vars.WSX_REGISTRY_PREFIX }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Authenticate without printing credentials
        env:
          ACR_USERNAME: ${{ secrets.WSX_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.WSX_ACR_PASSWORD }}
        run: python3 -B scripts/registry-images.py login
      - name: Push and read back an isolated scratch probe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acr-probe"
          printf 'ACR probe %s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/acr-probe/marker"
          printf 'FROM scratch\nCOPY marker /marker\n' > "$RUNNER_TEMP/acr-probe/Dockerfile"
          image="$REGISTRY_PREFIX/api:acr-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --network=none --tag "$image" "$RUNNER_TEMP/acr-probe"
          before=$(docker image inspect "$image" --format '{{.Id}}')
          docker push "$image"
          docker pull "$image"
          after=$(docker image inspect "$image" --format '{{.Id}}')
          test "$before" = "$after"
          echo 'ACR login, push and pull verified; no application deployment performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"

  validate:
    if: ${{ !inputs.registry_probe_only && !inputs.shared_images_only }}
    runs-on: ubuntu-24.04
    environment: production-cn-build
    env:
      ACR_EDITION: ${{ vars.WSX_ACR_EDITION }}
      ACR_REGION: ${{ vars.WSX_ACR_REGION }}
      ACR_REGISTRY: ${{ vars.WSX_ACR_REGISTRY }}
      ACR_REGISTRY_PREFIX: ${{ vars.WSX_REGISTRY_PREFIX }}
      ACR_INSTANCE_ID: ${{ vars.WSX_ACR_INSTANCE_ID }}
      ALIYUN_OIDC_SUBJECT: ${{ vars.WSX_ALIYUN_OIDC_SUBJECT }}
      ALIYUN_OIDC_AUDIENCE: sts.aliyuncs.com
      ALIYUN_ROLE_ARN: ${{ vars.WSX_ALIYUN_ROLE_ARN }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.WSX_ALIYUN_OIDC_PROVIDER_ARN }}
    timeout-minutes: 10
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - name: Check out control tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Reject incomplete registry configuration
        shell: bash
        run: python3 control/scripts/aliyun-release-auth.py validate-config
      - name: Reject non-exact source identity
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
      - name: Check out exact source with complete history
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed build inputs without registry writes
        id: plan
        working-directory: source
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.release_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          RELEASE_NAME: ${{ inputs.release }}
          IMAGE_PLATFORM: ${{ inputs.platform }}
          ATTEMPT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          REGISTRY_PREFIX: ${{ vars.WSX_REGISTRY_PREFIX }}
          ACR_REGION: ${{ vars.WSX_ACR_REGION }}
          ACR_INSTANCE_ID: ${{ vars.WSX_ACR_INSTANCE_ID }}
          ACR_PROBE_IMAGE: ${{ vars.WSX_ACR_PROBE_IMAGE }}
          NODE_IMAGE: ${{ vars.WSX_NODE_IMAGE }}
          PYTHON_IMAGE: ${{ vars.WSX_PYTHON_IMAGE }}
          POSTGRES_IMAGE: ${{ vars.WSX_POSTGRES_IMAGE }}
          REDIS_IMAGE: ${{ vars.WSX_REDIS_IMAGE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          e = os.environ
          value = {
              "schemaVersion": 1, "sourceRevision": e["SOURCE_REVISION"],
              "sourceBranch": e["SOURCE_BRANCH"],
              "release": e["RELEASE_NAME"], "attemptId": e["ATTEMPT_ID"],
              "platform": e["IMAGE_PLATFORM"], "registryPrefix": e["REGISTRY_PREFIX"],
              "acrRegion": e["ACR_REGION"], "acrInstanceId": e["ACR_INSTANCE_ID"],
              "acrEdition": e["ACR_EDITION"],
              "registryProbeImage": e["ACR_PROBE_IMAGE"],
              "baseImages": {name: e[key] for name, key in {
                  "node": "NODE_IMAGE", "python": "PYTHON_IMAGE",
                  "postgres": "POSTGRES_IMAGE", "redis": "REDIS_IMAGE"}.items()}}
          with open("../input.json", "x") as handle:
              json.dump(value, handle)
          PY
          python3 ../control/scripts/hosted-release.py validate --input ../input.json --output ../plan.json
          python3 - <<'PY'
          import json, os
          with open("../plan.json") as handle:
              services = json.load(handle)["services"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("services=" + json.dumps(services, separators=(",", ":")) + "\n")
          PY
      - name: Retain credential-free plan
        uses: actions/upload-artifact@v6
        with:
          name: hosted-release-plan-${{ github.run_attempt }}
          path: plan.json
          if-no-files-found: error
          retention-days: 7

  build:
    permissions:
      contents: read
      id-token: write
    needs: validate
    runs-on: ubuntu-24.04
    environment: production-cn-build
    env:
      ACR_EDITION: ${{ vars.WSX_ACR_EDITION }}
      ACR_REGION: ${{ vars.WSX_ACR_REGION }}
      ACR_REGISTRY: ${{ vars.WSX_ACR_REGISTRY }}
      ACR_REGISTRY_PREFIX: ${{ vars.WSX_REGISTRY_PREFIX }}
      ACR_INSTANCE_ID: ${{ vars.WSX_ACR_INSTANCE_ID }}
      ALIYUN_OIDC_SUBJECT: ${{ vars.WSX_ALIYUN_OIDC_SUBJECT }}
      ALIYUN_OIDC_AUDIENCE: sts.aliyuncs.com
      ALIYUN_ROLE_ARN: ${{ vars.WSX_ALIYUN_ROLE_ARN }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.WSX_ALIYUN_OIDC_PROVIDER_ARN }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.services) }}
    steps:
      - name: Check out control tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Download validated plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hosted-release-plan-${{ github.run_attempt }}
          path: plan
      - name: Reject incomplete registry and identity configuration
        shell: bash
        run: python3 control/scripts/aliyun-release-auth.py validate-config
      - name: Verify actual OIDC subject before exchanging identity
        if: env.ACR_EDITION == 'enterprise'
        shell: bash
        run: python3 control/scripts/aliyun-release-auth.py verify-oidc
      - name: Check out exact official authentication action
        if: env.ACR_EDITION == 'enterprise'
        uses: actions/checkout@v5
        with:
          repository: aliyun/configure-aliyun-credentials-action
          ref: 1e5248c8d5d93a8781ac344a68e19a43341e79e6
          path: .release-auth-action
          persist-credentials: false
      - name: Apply reviewed secret-handling hardening to exact action bytes
        if: env.ACR_EDITION == 'enterprise'
        run: python3 control/scripts/harden-aliyun-action.py --directory .release-auth-action
      - name: Exchange GitHub OIDC for temporary Alibaba identity
        if: env.ACR_EDITION == 'enterprise'
        uses: ./.release-auth-action
        with:
          role-to-assume: ${{ vars.WSX_ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.WSX_ALIYUN_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
          role-session-name: wsx-${{ github.run_id }}-${{ github.run_attempt }}
          role-session-expiration: 3600
      - name: Install pinned Alibaba CLI for enterprise token request
        if: env.ACR_EDITION == 'enterprise'
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: '3.0.277'
      - name: Obtain edition-specific masked Docker credentials
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.WSX_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.WSX_ACR_PASSWORD }}
        run: python3 control/scripts/aliyun-release-auth.py export-acr
      - name: Build and publish one immutable image
        working-directory: source
        shell: bash
        env:
          BUILD_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p ../result
          python3 ../control/scripts/hosted-release.py build --plan ../plan/plan.json --service "$BUILD_SERVICE" --output "../result/$BUILD_SERVICE.json"
      - name: Retain verified service result
        uses: actions/upload-artifact@v6
        with:
          name: hosted-release-result-${{ github.run_attempt }}-${{ matrix.service }}
          path: result/*.json
          if-no-files-found: error
          retention-days: 7

  seal:
    permissions:
      contents: read
      id-token: write
    needs: [validate, build]
    runs-on: ubuntu-24.04
    environment: production-cn-build
    env:
      ACR_EDITION: ${{ vars.WSX_ACR_EDITION }}
      ACR_REGION: ${{ vars.WSX_ACR_REGION }}
      ACR_REGISTRY: ${{ vars.WSX_ACR_REGISTRY }}
      ACR_REGISTRY_PREFIX: ${{ vars.WSX_REGISTRY_PREFIX }}
      ACR_INSTANCE_ID: ${{ vars.WSX_ACR_INSTANCE_ID }}
      ALIYUN_OIDC_SUBJECT: ${{ vars.WSX_ALIYUN_OIDC_SUBJECT }}
      ALIYUN_OIDC_AUDIENCE: sts.aliyuncs.com
      ALIYUN_ROLE_ARN: ${{ vars.WSX_ALIYUN_ROLE_ARN }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.WSX_ALIYUN_OIDC_PROVIDER_ARN }}
    timeout-minutes: 30
    outputs:
      attempt_id: ${{ steps.identity.outputs.attempt_id }}
      sealed_artifact: ${{ steps.identity.outputs.sealed_artifact }}
    steps:
      - name: Check out control tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact source for artifact identity checks
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node for control tooling
        uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
      - name: Prepare fixed minimal control closure
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix control-runtime --ignore-scripts --no-audit --no-fund
          python3 scripts/prepare-canonical-control.py --control . --runtime control-runtime --node "$(command -v node)" --output canonical-closure
          # Reviewed configuration must independently pin every copied byte.
          # This step never generates or replaces the control configuration/hash.
      - name: Download validated plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hosted-release-plan-${{ github.run_attempt }}
          path: plan
      - name: Download all service results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: hosted-release-result-${{ github.run_attempt }}-*
          path: results
          merge-multiple: true
      - name: Reject incomplete registry and identity configuration
        shell: bash
        run: python3 control/scripts/aliyun-release-auth.py validate-config
      - name: Verify actual OIDC subject before exchanging identity
        if: env.ACR_EDITION == 'enterprise'
        shell: bash
        run: python3 control/scripts/aliyun-release-auth.py verify-oidc
      - name: Check out exact official authentication action
        if: env.ACR_EDITION == 'enterprise'
        uses: actions/checkout@v5
        with:
          repository: aliyun/configure-aliyun-credentials-action
          ref: 1e5248c8d5d93a8781ac344a68e19a43341e79e6
          path: .release-auth-action
          persist-credentials: false
      - name: Apply reviewed secret-handling hardening to exact action bytes
        if: env.ACR_EDITION == 'enterprise'
        run: python3 control/scripts/harden-aliyun-action.py --directory .release-auth-action
      - name: Exchange GitHub OIDC for temporary Alibaba identity
        if: env.ACR_EDITION == 'enterprise'
        uses: ./.release-auth-action
        with:
          role-to-assume: ${{ vars.WSX_ALIYUN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.WSX_ALIYUN_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
          role-session-name: wsx-${{ github.run_id }}-${{ github.run_attempt }}
          role-session-expiration: 3600
      - name: Install pinned Alibaba CLI for enterprise token request
        if: env.ACR_EDITION == 'enterprise'
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: '3.0.277'
      - name: Obtain edition-specific masked Docker credentials
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.WSX_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.WSX_ACR_PASSWORD }}
        run: python3 control/scripts/aliyun-release-auth.py export-acr
      - name: Verify registry readback and seal with reviewed control closure
        working-directory: source
        shell: bash
        env:
          CANONICAL_CONTROL_CONFIG: ${{ vars.WSX_CANONICAL_CONTROL_CONFIG }}
          CANONICAL_CONTROL_SHA256: ${{ vars.WSX_CANONICAL_CONTROL_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$CANONICAL_CONTROL_CONFIG" =~ ^[a-zA-Z0-9._/-]+$ && "$CANONICAL_CONTROL_CONFIG" != /* ]]
          [[ "/$CANONICAL_CONTROL_CONFIG/" != *"/../"* ]]
          [[ "$CANONICAL_CONTROL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ -f "../control/$CANONICAL_CONTROL_CONFIG" ]]
          python3 ../control/scripts/hosted-release.py aggregate --plan ../plan/plan.json --results ../results --output ../sealed --control "../control/$CANONICAL_CONTROL_CONFIG" --control-sha256 "$CANONICAL_CONTROL_SHA256"
      - name: Retain sealed artifacts; stop before host preparation
        uses: actions/upload-artifact@v6
        with:
          name: hosted-release-sealed-${{ github.run_attempt }}
          path: sealed/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Export immutable handoff identifiers
        id: identity
        shell: bash
        env:
          ATTEMPT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          SEALED_ARTIFACT: hosted-release-sealed-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "attempt_id=$ATTEMPT_ID" >> "$GITHUB_OUTPUT"
          echo "sealed_artifact=$SEALED_ARTIFACT" >> "$GITHUB_OUTPUT"
