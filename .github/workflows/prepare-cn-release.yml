name: prepare-cn-release

on:
  workflow_run:
    workflows: ["backend-gates"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact main commit to build"
        required: true
        type: string
      release:
        description: "Semantic production release identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspacex-cn-release-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment: production-cn-build
    runs-on: [self-hosted, linux, workspacex-cn-production]
    timeout-minutes: 45
    steps:
      - name: Check out the exact GitHub candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Seed the China source mirror from GitHub
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          revision="${RUN_SHA}"
          [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && revision="${INPUT_SHA}"
          [[ "${revision}" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "${revision}" ]] || { echo "::error::release SHA or checkout differs"; exit 1; }
          git rev-parse --verify origin/main >/dev/null
          git merge-base --is-ancestor "${revision}" origin/main || { echo "::error::release SHA is not contained in main"; exit 1; }
          cache=/opt/workspacex-cn/release-origin-cache.git
          repository=/opt/workspacex-cn/repository
          [[ -d "${cache}" && ! -L "${cache}" && "$(git -C "${cache}" rev-parse --is-bare-repository)" == true ]] || { echo "::error::CN_SOURCE_CACHE_UNTRUSTED"; exit 1; }
          [[ "$(git -C "${repository}" remote get-url origin)" == "${cache}" ]] || { echo "::error::CN_RELEASE_ORIGIN_DRIFT"; exit 1; }
          git -C "${cache}" fetch --no-tags "${GITHUB_WORKSPACE}" "+${revision}:refs/heads/main"
          [[ "$(git -C "${cache}" rev-parse refs/heads/main)" == "${revision}" ]] || { echo "::error::CN_SOURCE_CACHE_REVISION_MISMATCH"; exit 1; }
          GIT_NO_LAZY_FETCH=1 git -C "${cache}" fsck --full --no-reflogs

      - name: Fail closed if privileged build entrypoints drifted
        shell: bash
        run: |
          set -euo pipefail
          declare -A trusted=(
            [.harness/scripts/vm/build-cn-release-candidate.sh]=/usr/local/bin/workspacex-cn-build-candidate
            [.harness/scripts/vm/publish-cn-release.sh]=/usr/local/lib/workspacex-cn/publish-cn-release.sh
            [.harness/scripts/vm/verify-cn-release-preflight.sh]=/usr/local/lib/workspacex-cn/verify-cn-release-preflight.sh
          )
          for source in "${!trusted[@]}"; do
            target=${trusted[$source]}
            [[ -f "${target}" && ! -L "${target}" && -x "${target}" ]] && cmp --silent "${source}" "${target}" || {
              echo "::error::CN_TRUSTED_ENTRYPOINT_DRIFT: ${target}; run the controlled CN bootstrap/update procedure"
              exit 1
            }
          done

      - name: Build and seal exact release candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.release_sha }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          revision="${RUN_SHA}"
          release="2026.9.${GITHUB_RUN_NUMBER}-cn.${GITHUB_RUN_ATTEMPT}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            revision="${INPUT_SHA}"
            release="${INPUT_RELEASE}"
          fi
          [[ "${revision}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::release SHA must be exact"; exit 1; }
          if ! sudo -n /usr/local/bin/workspacex-cn-build-candidate "${revision}" "${release}"; then
            echo "::error::CN_CANDIDATE_NONINTERACTIVE_ENTRYPOINT_FAILED: verify the exact NOPASSWD sudoers rule and protected prebuild receipt"
            exit 1
          fi
