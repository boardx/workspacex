name: prepare-cn-release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact main commit to build"
        required: true
        type: string
      release:
        description: "Semantic production release identifier"
        required: true
        type: string

permissions:
  checks: read
  statuses: read
  deployments: read
  contents: write
  actions: read

# Serialization only: reruns/manual attempts are not made idempotent by this lock.
concurrency:
  group: workspacex-cn-production-deploy
  cancel-in-progress: false

jobs:
  build-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production-cn-build
    runs-on: [self-hosted, linux, workspacex-cn-production]
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate from verified domestic cache
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::CN_PREPARE_MANUAL_MAIN_REQUIRED"
            exit 2
          }
          revision="${INPUT_SHA}"
          [[ "${revision}" =~ ^[a-f0-9]{40}$ ]] || exit 2
          expected_main_cn=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main-cn" --jq '.object.sha')
          [[ "${expected_main_cn}" =~ ^[a-f0-9]{40}$ ]] || exit 2
          bundle=$(mktemp)
          trap 'rm -f "$bundle"' EXIT
          # Trusted root export takes the same release.lock as all cache writers.
          # An absent, borrowed, partial or wrong-SHA cache is NOT_READY, never HTTPS fallback.
          sudo -n /usr/local/bin/workspacex-cn-export-source "${revision}" "${expected_main_cn}" "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$bundle"
          [[ -s "$bundle" ]] || { echo "::error::CN_DOMESTIC_SOURCE_NOT_READY"; exit 3; }
          [[ -d "$GITHUB_WORKSPACE" && ! -L "$GITHUB_WORKSPACE" ]] || exit 3
          # Disposable runner workspace only; no privileged production checkout/cache writes.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          GIT_NO_LAZY_FETCH=1 git clone --no-local --no-checkout "$bundle" "$GITHUB_WORKSPACE"
          GIT_NO_LAZY_FETCH=1 git -C "$GITHUB_WORKSPACE" fsck --full --no-reflogs
          git checkout --detach "${revision}"
          [[ "$(git rev-parse HEAD)" == "${revision}" && "$(git rev-parse origin/main-cn)" == "${expected_main_cn}" ]] || exit 3
          git merge-base --is-ancestor "${revision}" origin/main
          git merge-base --is-ancestor "${expected_main_cn}" "${revision}"
          [[ -f .harness/scripts/vm/cn-frozen-release-identity.mjs ]] && grep -q CN_FROZEN_RELEASE_DISPATCHER_V1 .github/workflows/promote-cn-production.yml || { echo "::error::CN_FROZEN_RELEASE_DISPATCHER_NOT_READY"; exit 3; }
          echo "CN_RELEASE_WORKFLOW_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CN_RELEASE_SOURCE_SHA=${revision}" >> "$GITHUB_ENV"

      - name: Fail closed if privileged build entrypoints drifted
        shell: bash
        run: |
          set -euo pipefail
          declare -A trusted=(
            [.harness/scripts/vm/deploy-cn-production.sh]=/usr/local/bin/workspacex-cn-deploy
            [.harness/scripts/vm/verify-cn-release-promotion.sh]=/usr/local/bin/workspacex-cn-verify-promotion
            [.harness/scripts/vm/build-cn-release-candidate.sh]=/usr/local/bin/workspacex-cn-build-candidate
            [.harness/scripts/vm/publish-cn-release.sh]=/usr/local/lib/workspacex-cn/publish-cn-release.sh
            [.harness/scripts/vm/verify-cn-release-preflight.sh]=/usr/local/lib/workspacex-cn/verify-cn-release-preflight.sh
            [.harness/scripts/vm/collect-cn-release-preflight.sh]=/usr/local/lib/workspacex-cn/collect-cn-release-preflight.sh
            [.harness/scripts/vm/cn-release-preflight-evidence.mjs]=/usr/local/lib/workspacex-cn/cn-release-preflight-evidence.mjs
            [.harness/scripts/vm/cn-release-orphans.py]=/usr/local/lib/workspacex-cn/cn-release-orphans.py
            [.harness/scripts/vm/cn-bootstrap-source-probe.mjs]=/usr/local/lib/workspacex-cn/cn-bootstrap-source-probe.mjs
          )
          for source in "${!trusted[@]}"; do
            target=${trusted[$source]}
            [[ -f "${target}" && ! -L "${target}" && -x "${target}" ]] && cmp --silent "${source}" "${target}" || {
              echo "::error::CN_TRUSTED_ENTRYPOINT_DRIFT: ${target}; run the controlled CN bootstrap/update procedure"
              exit 1
            }
          done

      - name: Build, seal, and host-prepare exact release candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.release_sha }}
          INPUT_RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::CN_PREPARE_MANUAL_MAIN_REQUIRED"
            exit 2
          }
          revision="${INPUT_SHA}"
          release="${INPUT_RELEASE}"
          attempt_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "${revision}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::release SHA must be exact"; exit 1; }
          expected_main_cn=$(git rev-parse origin/main-cn)
          [[ "${expected_main_cn}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::CN_RELEASE_BASELINE_NOT_READY"; exit 1; }
          sudo -n /usr/local/bin/workspacex-cn-deploy --check-prepare-inputs "${revision}" "${attempt_id}"
          if ! sudo -n /usr/local/bin/workspacex-cn-build-candidate "${revision}" "${release}" "${attempt_id}"; then
            echo "::error::CN_CANDIDATE_NONINTERACTIVE_ENTRYPOINT_FAILED: verify the exact NOPASSWD sudoers rule and protected prebuild receipt"
            exit 1
          fi
          # Build/seal success alone is never promotion readiness. This operation
          # remains before human admission and never activates public traffic.
          sudo -n /usr/local/bin/workspacex-cn-deploy --prepare "${revision}" "${attempt_id}"
          identity_file=$(mktemp)
          trap 'rm -f "${identity_file}"' EXIT
          sudo -n /usr/local/bin/workspacex-cn-verify-promotion "${revision}" "${expected_main_cn}" "${attempt_id}" > "${identity_file}"
          # No tag until complete host gates and actual exact-source GitHub/Devapp facts pass.
          REVISION="${revision}" EXPECTED_MAIN_CN="${expected_main_cn}" ATTEMPT_ID="${attempt_id}" node --experimental-strip-types .harness/scripts/vm/cn-frozen-release-identity.mjs freeze-tag "${identity_file}"
          {
            echo "### CN host-prepared release candidate"
            echo "- Expected main-cn: \`${expected_main_cn}\`"
            echo "- Exact SHA: \`${revision}\`"
            echo "- Release: \`${release}\`"
            echo "- Attempt: \`${attempt_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
