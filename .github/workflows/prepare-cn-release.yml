name: prepare-cn-release
run-name: "Prepare CN ${{ inputs.release_sha }} (source run ${{ inputs.source_run_id || github.run_id }})"

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact main commit to build"
        required: true
        type: string
      release:
        description: "Semantic production release identifier"
        required: true
        type: string

      auto_promote:
        description: "Queue frozen-tag promotion after preparation; does not bypass admission"
        required: false
        type: boolean
        default: false
      source_run_id:
        description: "Originating main-cn push run for traceability"
        required: false
        type: string

permissions:
  checks: read
  statuses: read
  deployments: read
  contents: write
  actions: write

# Serialization only: reruns/manual attempts are not made idempotent by this lock.
concurrency:
  group: workspacex-cn-production-deploy
  cancel-in-progress: false

jobs:
  candidate-ci:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.auto_promote
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Await exact-source main CI before Devapp
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_ATTEMPT: gha-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_REF: refs/heads/main-cn
        run: node .harness/scripts/vm/devapp-exact-evidence.mjs wait-candidate-ci

  devapp-exact-evidence:
    needs: [candidate-ci]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.auto_promote && needs.candidate-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: write
    outputs:
      run_id: ${{ steps.devapp.outputs.devapp_run_id }}
      run_attempt: ${{ steps.devapp.outputs.devapp_run_attempt }}
      request_id: ${{ steps.devapp.outputs.evidence_request_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch and await exact-source Devapp acceptance
        id: devapp
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_ATTEMPT: gha-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_REF: refs/heads/main-cn
        run: node .harness/scripts/vm/devapp-exact-evidence.mjs request

  source-bundle:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.auto_promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - name: Check out immutable trusted control
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Obtain complete cloud source history
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Produce standalone exact source bundle
        id: bundle
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_OUTPUT_DIR: ${{ runner.temp }}/cn-auto-source
        run: node ../control/.github/scripts/cn-auto-source.mjs
      - name: Upload this attempt's credential-free complete source
        uses: actions/upload-artifact@v6
        with:
          name: cn-auto-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cn-auto-source/source.bundle
            ${{ runner.temp }}/cn-auto-source/source.json
          if-no-files-found: error
          retention-days: 1

  build-candidate:
    needs: [source-bundle, candidate-ci, devapp-exact-evidence]
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      ((!inputs.auto_promote && needs.source-bundle.result == 'skipped' && needs.candidate-ci.result == 'skipped' && needs.devapp-exact-evidence.result == 'skipped') ||
       (inputs.auto_promote && needs.source-bundle.result == 'success' && needs.candidate-ci.result == 'success' && needs.devapp-exact-evidence.result == 'success'))
    environment: production-cn-build
    runs-on: [self-hosted, linux, workspacex-cn-production]
    timeout-minutes: 45
    permissions:
      checks: read
      statuses: read
      deployments: read
      contents: write
      actions: write
    steps:
      - name: Download signed exact-source Devapp bytes
        if: inputs.auto_promote
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: devapp-signed-evidence
          run-id: ${{ needs.devapp-exact-evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cn-devapp-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restrict downloaded signed bytes to this runner account
        if: inputs.auto_promote
        env:
          SIGNED_FILE: ${{ runner.temp }}/cn-devapp-${{ github.run_id }}-${{ github.run_attempt }}/devapp-evidence.bin
        run: |
          set -euo pipefail
          [[ -f "$SIGNED_FILE" && ! -L "$SIGNED_FILE" ]]
          chmod 0600 "$SIGNED_FILE"
      - name: Download this attempt's complete cloud source
        if: inputs.auto_promote
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cn-auto-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cn-auto-source-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Import exact source through the fixed protected entrypoint
        if: inputs.auto_promote
        shell: bash
        env:
          REVISION: ${{ inputs.release_sha }}
          BUNDLE_SHA256: ${{ needs.source-bundle.outputs.bundle_sha256 }}
          SOURCE_DIRECTORY: ${{ runner.temp }}/cn-auto-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]] || exit 2
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ && "$BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 2
          [[ -f "$SOURCE_DIRECTORY/source.bundle" && ! -L "$SOURCE_DIRECTORY/source.bundle" ]] || exit 2
          sudo -n /usr/local/bin/workspacex-cn-deploy --auto-stage-source "$REVISION" "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$BUNDLE_SHA256" < "$SOURCE_DIRECTORY/source.bundle"
      - name: Check out exact candidate from verified domestic cache
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTO_PROMOTE: ${{ inputs.auto_promote }}
          INPUT_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::CN_PREPARE_MANUAL_MAIN_REQUIRED"
            exit 2
          }
          revision="${INPUT_SHA}"
          [[ "${revision}" =~ ^[a-f0-9]{40}$ ]] || exit 2
          expected_main_cn=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main-cn" --jq '.object.sha')
          [[ "${expected_main_cn}" =~ ^[a-f0-9]{40}$ ]] || exit 2
          export_baseline=$expected_main_cn
          if [[ "${AUTO_PROMOTE:-false}" == true ]]; then
            [[ "$expected_main_cn" == "$revision" ]] || { echo "::error::CN_AUTO_STALE_MAIN_CN"; exit 3; }
            export_baseline=auto
          fi
          bundle=$(mktemp)
          trap 'rm -f "$bundle"' EXIT
          # Trusted root export takes the same release.lock as all cache writers.
          # An absent, borrowed, partial or wrong-SHA cache is NOT_READY, never HTTPS fallback.
          sudo -n /usr/local/bin/workspacex-cn-export-source "${revision}" "${export_baseline}" "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$bundle"
          [[ -s "$bundle" ]] || { echo "::error::CN_DOMESTIC_SOURCE_NOT_READY"; exit 3; }
          [[ -d "$GITHUB_WORKSPACE" && ! -L "$GITHUB_WORKSPACE" ]] || exit 3
          # Disposable runner workspace only; no privileged production checkout/cache writes.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          GIT_NO_LAZY_FETCH=1 git clone --no-local --no-checkout "$bundle" "$GITHUB_WORKSPACE"
          GIT_NO_LAZY_FETCH=1 git -C "$GITHUB_WORKSPACE" fsck --full --no-reflogs
          git checkout --detach "${revision}"
          if [[ "${AUTO_PROMOTE:-false}" == true ]]; then
            desired=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main-cn" --jq '.object.sha')
            [[ "$desired" == "$revision" ]] || { echo "::error::CN_AUTO_STALE_MAIN_CN"; exit 3; }
            expected_main_cn=$(git rev-parse origin/main-cn)
          fi
          [[ "$expected_main_cn" =~ ^[a-f0-9]{40}$ ]] || exit 3
          [[ "$(git rev-parse HEAD)" == "${revision}" && "$(git rev-parse origin/main-cn)" == "${expected_main_cn}" ]] || exit 3
          git merge-base --is-ancestor "${revision}" origin/main
          git merge-base --is-ancestor "${expected_main_cn}" "${revision}"
          [[ -f .harness/scripts/vm/cn-frozen-release-identity.mjs ]] && grep -q CN_FROZEN_RELEASE_DISPATCHER_V1 .github/workflows/promote-cn-production.yml || { echo "::error::CN_FROZEN_RELEASE_DISPATCHER_NOT_READY"; exit 3; }
          echo "CN_RELEASE_WORKFLOW_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CN_RELEASE_SOURCE_SHA=${revision}" >> "$GITHUB_ENV"

      - name: Fail closed if privileged build entrypoints drifted
        shell: bash
        run: |
          set -euo pipefail
          declare -A trusted=(
            [.harness/scripts/vm/deploy-cn-production.sh]=/usr/local/bin/workspacex-cn-deploy
            [.harness/scripts/vm/verify-cn-release-promotion.sh]=/usr/local/bin/workspacex-cn-verify-promotion
            [.harness/scripts/vm/build-cn-release-candidate.sh]=/usr/local/bin/workspacex-cn-build-candidate
            [.harness/scripts/vm/publish-cn-release.sh]=/usr/local/lib/workspacex-cn/publish-cn-release.sh
            [.harness/scripts/vm/verify-cn-release-preflight.sh]=/usr/local/lib/workspacex-cn/verify-cn-release-preflight.sh
            [.harness/scripts/vm/collect-cn-release-preflight.sh]=/usr/local/lib/workspacex-cn/collect-cn-release-preflight.sh
            [.harness/scripts/vm/cn-release-preflight-evidence.mjs]=/usr/local/lib/workspacex-cn/cn-release-preflight-evidence.mjs
            [.harness/scripts/vm/cn-release-orphans.py]=/usr/local/lib/workspacex-cn/cn-release-orphans.py
            [.harness/scripts/vm/cn-bootstrap-source-probe.mjs]=/usr/local/lib/workspacex-cn/cn-bootstrap-source-probe.mjs
            [.harness/scripts/vm/cn-auto-evidence-stage.mjs]=/usr/local/lib/workspacex-cn/cn-auto-evidence-stage.mjs
          )
          for source in "${!trusted[@]}"; do
            target=${trusted[$source]}
            [[ -f "${target}" && ! -L "${target}" && -x "${target}" ]] && cmp --silent "${source}" "${target}" || {
              echo "::error::CN_TRUSTED_ENTRYPOINT_DRIFT: ${target}; run the controlled CN bootstrap/update procedure"
              exit 1
            }
          done

      - name: Build, seal, and host-prepare exact release candidate
        id: prepared
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.release_sha }}
          INPUT_RELEASE: ${{ inputs.release }}
          AUTO_PROMOTE: ${{ inputs.auto_promote }}
          GH_TOKEN: ${{ github.token }}
          DEVAPP_PARENT_RUN_ID: ${{ needs.devapp-exact-evidence.outputs.run_id }}
          DEVAPP_PARENT_RUN_ATTEMPT: ${{ needs.devapp-exact-evidence.outputs.run_attempt }}
          DEVAPP_REQUEST_ID: ${{ needs.devapp-exact-evidence.outputs.request_id }}
          DEVAPP_SIGNED_PATH: ${{ runner.temp }}/cn-devapp-${{ github.run_id }}-${{ github.run_attempt }}/devapp-evidence.bin
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::CN_PREPARE_MANUAL_MAIN_REQUIRED"
            exit 2
          }
          revision="${INPUT_SHA}"
          release="${INPUT_RELEASE}"
          attempt_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "${revision}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::release SHA must be exact"; exit 1; }
          expected_main_cn=$(git rev-parse origin/main-cn)
          [[ "${expected_main_cn}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::CN_RELEASE_BASELINE_NOT_READY"; exit 1; }
          build_flags=()
          if [[ "${AUTO_PROMOTE:-false}" == true ]]; then
            build_flags=(--automatic)
          else
            sudo -n /usr/local/bin/workspacex-cn-deploy --check-prepare-inputs "${revision}" "${attempt_id}"
          fi
          if ! sudo -n /usr/local/bin/workspacex-cn-build-candidate "${build_flags[@]}" "${revision}" "${release}" "${attempt_id}"; then
            echo "::error::CN_CANDIDATE_NONINTERACTIVE_ENTRYPOINT_FAILED: verify the exact NOPASSWD sudoers rule and protected prebuild receipt"
            exit 1
          fi
          # Build/seal success alone is never promotion readiness. This operation
          # remains before production activation and never activates public traffic.
          sudo -n /usr/local/bin/workspacex-cn-deploy --prepare "${revision}" "${attempt_id}"
          if [[ "${AUTO_PROMOTE:-false}" == true ]]; then
            # Root validates and preserves the exact signed Devapp bytes.
            node --input-type=module <<'NODE' | sudo -n /usr/local/bin/workspacex-cn-deploy --auto-stage-evidence "${revision}" "${attempt_id}"
          import fs from 'node:fs';
          const p=process.env,file=p.DEVAPP_SIGNED_PATH,st=fs.lstatSync(file);
          if(!st.isFile()||st.isSymbolicLink()||st.nlink!==1||st.size<1||st.size>16*1024*1024)throw Error('CN_DEVAPP_SIGNED_ARTIFACT_INVALID');
          const bytes=fs.readFileSync(file);
          const header={schemaVersion:1,sourceSha:p.INPUT_SHA,attemptId:`gha-${p.GITHUB_RUN_ID}-${p.GITHUB_RUN_ATTEMPT}`,devappParentRunId:Number(p.DEVAPP_PARENT_RUN_ID),devappParentRunAttempt:Number(p.DEVAPP_PARENT_RUN_ATTEMPT),evidenceRequestId:p.DEVAPP_REQUEST_ID,devappBytes:bytes.length};
          process.stdout.write(JSON.stringify(header)+'\n');process.stdout.write(bytes);
          NODE
          fi
          identity_file=$(mktemp)
          trap 'rm -f "${identity_file}"' EXIT
          sudo -n /usr/local/bin/workspacex-cn-verify-promotion "${revision}" "${expected_main_cn}" "${attempt_id}" > "${identity_file}"
          # No tag until complete host gates and actual exact-source GitHub/Devapp facts pass.
          REVISION="${revision}" EXPECTED_MAIN_CN="${expected_main_cn}" ATTEMPT_ID="${attempt_id}" node --experimental-strip-types .harness/scripts/vm/cn-frozen-release-identity.mjs freeze-tag "${identity_file}"
          echo "expected_main_cn_sha=${expected_main_cn}" >> "${GITHUB_OUTPUT}"
          {
            echo "### CN host-prepared release candidate"
            echo "- Expected main-cn: \`${expected_main_cn}\`"
            echo "- Exact SHA: \`${revision}\`"
            echo "- Release: \`${release}\`"
            echo "- Attempt: \`${attempt_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Queue frozen prepared tag promotion (not production acceptance)
        if: inputs.auto_promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ steps.prepared.outputs.release_tag }}
          EXPECTED_MAIN_CN_SHA: ${{ steps.prepared.outputs.expected_main_cn_sha }}
          RELEASE_ATTEMPT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: node .github/scripts/cn-auto-release.mjs promote

      - name: Remove this attempt's downloaded evidence
        if: inputs.auto_promote && always()
        env:
          SIGNED_FILE: ${{ runner.temp }}/cn-devapp-${{ github.run_id }}-${{ github.run_attempt }}/devapp-evidence.bin
        run: rm -f -- "$SIGNED_FILE"
