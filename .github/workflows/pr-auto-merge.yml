name: Enable protected PR auto-merge
on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # No checkout: privileged metadata operation never executes candidate code.
      - name: Enable native auto-merge with exact head protection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD" --repo "$GH_REPO"
