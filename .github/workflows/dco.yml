# dco.yml — 外部贡献的 DCO 签署检查（决策 D20：用 DCO，不用 CLA）
#
# 只查来自 fork 的 PR：外部贡献者按 CONTRIBUTING.md 用 `git commit -s` 签署。
# 仓库内的 PR 走内部流程（AGENTS.md），不在本检查范围——对内部提交也强制签署，
# 会让现有全部开发流程一夜之间变红，那是另一个需要人决定的问题，不是本文件顺手能定的。
#
# fork 判定与 harness-verify.yml 同源：head 仓库全名不等于本仓库。
name: dco

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Check every commit is signed off (DCO)
        run: node .harness/scripts/check-dco.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
