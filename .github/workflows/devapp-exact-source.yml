name: devapp-exact-source
run-name: devapp-exact:${{ inputs.evidence_attempt }}:${{ inputs.evidence_request_id }}
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        type: string
        required: true
      evidence_attempt:
        type: string
        required: true
      evidence_request_id:
        type: string
        required: true
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    concurrency:
      group: workspacex-devapp-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require the actual candidate source and complete integration CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          node .harness/scripts/vm/devapp-exact-evidence.mjs candidate-ci
      - name: Coordinate exact deployment, terminal browser and controlled signing
        id: coordinate
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
        run: node .harness/scripts/vm/devapp-exact-evidence.mjs coordinate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: devapp-signed-evidence
          run-id: ${{ steps.coordinate.outputs.signed_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/devapp-signed-evidence
      - uses: actions/upload-artifact@v6
        with:
          name: devapp-signed-evidence
          path: ${{ runner.temp }}/devapp-signed-evidence/devapp-evidence.bin
          if-no-files-found: error
          retention-days: 1
      - name: Remove signed envelope staging
        if: always()
        run: rm -f "$RUNNER_TEMP/devapp-signed-evidence/devapp-evidence.bin"
