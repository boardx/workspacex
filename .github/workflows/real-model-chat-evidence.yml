# real-model-chat-evidence —— 在 devapp 上用**真实模型**跑通「生成一个 pdf，总结你可以
# 做的事情」这条反复失败的用例，并把证据打成一个远程分析者能独立读懂的包（issue #2802）。
#
# ## 它要补的洞
#
# 全仓 86 个全栈 e2e spec 都跑在确定性回环模型上，真实模型链路**零自动化覆盖**。
# #2786 / #2793 / #2795 全部发生在 CI 全绿的提交上，最后靠人类手动打开 DevTools 截图
# 才拿到第一份真实报错。这条 workflow 把那次人工动作变成一次 `workflow_dispatch`：
# 远程协调员（没有 Docker、没有模型凭据、只有云端容器）从此可以自己触发一次真实模型
# 验证并读到证据，不再需要人肉搬运截图。
#
# ## 只手动触发，不挂任何 push 钩子
#
# 与 `live-evidence.yml` 同一条理由：真实模型一次 run 要花钱、且不确定，不适合每次
# push 都跑。这里连 `schedule` 都没有——什么时候值得花这一次，由人/协调员决定。
#
# ## 它对这台活着的机器做什么（只读 + 有限写入，与 live-evidence.sh 同一条边界）
#
#   写：在 `$REAL_MODEL_E2E_EMAIL` 那个**已有账号**下，经真实 UI 显式开启文档生成自动
#       批准，开一条**新的** chat 线程、发一条消息、跑一次真实 run，并下载这次 run
#       产出的 PDF；用例结束后恢复进入用例前的授权状态。写入面止于这项可逆授权、一条
#       新线程与它自己的产物。
#   读：`journalctl -u workspacex-api/-web`、`docker logs workspacex-deep-agent`、
#       `/opt/workspacex/deploy.env` 里**三个开关 key 的值**（带 KEY 的一律打码）、
#       `git log -1`、`systemctl is-active`。
#   不做：不重启任何服务、不改 deploy.env、不跑迁移、不 build 前端、不装系统包、
#       不写 /opt/workspacex 下任何文件、不触碰其它账号的线程/组织/文件。
#
# ## 凭据
#
# **不新增任何 GitHub secret，凭据一步都不离开这台机器。** 脚本只读这台机器上已有的
# `/opt/workspacex/real-model-e2e.env`（0600），里面两行：一个已有账号的邮箱与口令。
# 文件不在 ⇒ preflight 逐个点名后红退，不发明第二条凭据路径。
#
# ## 证据在哪
#
# artifact 名 `real-model-chat-evidence`，内容见 `apps/web/e2e/support/real-model-evidence.ts`：
# 逐条断言结论 / 浏览器控制台与页面异常 / 失败与超时的网络请求 / SSE 与 WS 的连接生命周期
# 带时刻 / thread id 与 agent run id / 后端日志节选 / 截图与 Playwright trace。
# 判决同时打进 job log（`01-verdict.txt` 的同一份内容），读 `get_job_logs` 就能拿到结论，
# 不必先下载 artifact。写盘的每一个字符串都过 `scrubSecrets`。
name: real-model-chat-evidence
run-name: ${{ inputs.owned_failure_readonly && 'devapp-aidt-owned-failure-readonly' || inputs.aidt_auth_readonly && 'devapp-aidt-auth-readonly' || (inputs.evidence_request_id && format('devapp-exact:{0}:{1}', inputs.evidence_attempt, inputs.evidence_request_id) || 'real-model-chat-evidence') }}

on:
  workflow_dispatch:
    inputs:
      owned_failure_readonly:
        description: Fixed existing owned-run failure reader; existing reusable consultant only, no model
        type: boolean
        required: false
        default: false
      aidt_auth_readonly:
        description: Existing QA login and AIDT GET gates only; disables the PDF/model job
        type: boolean
        required: false
        default: false
      prompt:
        description: "发给 /chat 的那句话（默认就是反复失败的那一句）"
        required: false
        default: "生成一个 pdf，总结你可以做的事情"
      run_timeout_ms:
        description: "单次 run 的等待上限（毫秒）。默认 900000 = 15 分钟；网关 300–400s 天花板本身是被测对象，别调小"
        required: false
        default: "900000"
      expect_kind:
        description: "断言 ⑥ 判什么：file（默认，产出文件按字节判）或 canvas（工作坊画布渲染完成 + 30 秒验收线，issue #2852/#2836）"
        required: false
        default: "file"
      expected_source_sha:
        type: string
        default: ''
      evidence_attempt:
        type: string
        default: ''
      evidence_request_id:
        type: string
        default: ''
      parent_run_id:
        type: string
        default: ''
      parent_run_attempt:
        type: string
        default: ''

# 同一时刻只允许一轮：两个真实模型 run 抢同一台机器，既烧钱又让证据互相污染。
concurrency:
  group: real-model-chat-evidence
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !inputs.aidt_auth_readonly && !inputs.owned_failure_readonly }}
    runs-on: [self-hosted, linux, x64, workspacex]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    env:
      REAL_MODEL_E2E_PROMPT: ${{ inputs.prompt }}
      REAL_MODEL_E2E_RUN_TIMEOUT_MS: ${{ inputs.run_timeout_ms }}
      REAL_MODEL_E2E_EXPECT_KIND: ${{ inputs.expect_kind }}
      REAL_MODEL_E2E_EVIDENCE_DIR: ${{ github.workspace }}/apps/web/test-results/real-model-evidence
    steps:
      - uses: actions/checkout@v5
      - name: Admit exact-source coordinated browser
        if: inputs.evidence_request_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
        run: node .harness/scripts/vm/devapp-exact-evidence.mjs authorize-child
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只装 chromium，**不带 `--with-deps`**：那一步要 apt（root），而本 workflow 的
      # 边界是「不装系统包」。系统依赖缺失会在这里显式红，不会伪装成用例失败。
      - run: pnpm --filter web exec playwright install chromium

      - name: preflight —— 解析这台机器上已有的凭据与目标站点
        run: bash .harness/scripts/vm/real-model-chat-evidence.sh preflight

      # 真实模型跑这一步。`continue-on-error` 是刻意的：**红了也要把证据传上去**——
      # 这条通道存在的全部意义就是产出证据，失败那次的证据比成功那次更值钱。
      # job 的红绿由最后一步按这一步的 outcome 复判，不会被吞掉。
      - name: 真实模型 PDF 用例（与本地 lane 同一份 spec）
        id: spec
        continue-on-error: true
        run: |
          set -a
          . "${RUNNER_TEMP}/real-model-e2e.env"
          set +a
          pnpm run e2e:real-model-smoke:raw

      - name: 收后端日志与部署指纹（只读）
        if: always()
        run: bash .harness/scripts/vm/real-model-chat-evidence.sh collect

      - name: 判决打进 job log
        if: always()
        run: bash .harness/scripts/vm/real-model-chat-evidence.sh summarize

      - name: Bind automatic browser artifact to its exact parent attempt
        if: inputs.evidence_request_id != '' && steps.spec.outcome == 'success'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
          EVIDENCE_REQUEST_ID: ${{ inputs.evidence_request_id }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; const e=process.env; writeFileSync(e.REAL_MODEL_E2E_EVIDENCE_DIR+"/devapp-coordination.json",JSON.stringify({source:e.EXPECTED_SOURCE_SHA,attempt:e.EVIDENCE_ATTEMPT,requestId:e.EVIDENCE_REQUEST_ID,parentId:Number(e.PARENT_RUN_ID),parentAttempt:Number(e.PARENT_RUN_ATTEMPT),runId:Number(e.GITHUB_RUN_ID),runAttempt:Number(e.GITHUB_RUN_ATTEMPT)}));'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-model-chat-evidence
          path: apps/web/test-results/real-model-evidence
          retention-days: 30
          if-no-files-found: warn

      # 本轮 env 文件带口令，job 结束前删掉——runner 是复用的，别把它留在 _temp 里。
      - name: 清掉本轮 env 文件
        if: always()
        run: rm -f "${RUNNER_TEMP}/real-model-e2e.env"

      - name: 复判（spec 红 ⇒ job 红）
        if: always() && steps.spec.outcome == 'failure'
        run: |
          echo "真实模型用例未通过——逐条结论见上方判决与 artifact real-model-chat-evidence"
          exit 1

  readonly-gates:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.aidt_auth_readonly && !inputs.owned_failure_readonly }}
    runs-on: [self-hosted, linux, x64, workspacex]
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      DEBUG: ''
      PWDEBUG: ''
      NEXT_TELEMETRY_DISABLED: '1'
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
    steps:
      - name: Fetch exact source into this attempt's private directory
        id: private-source
        env:
          AIDT_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          AIDT_AUTH_ROOT="$RUNNER_TEMP/../wsx-aidt-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP"
          mkdir -- "$AIDT_AUTH_ROOT" || { echo 'PRIVATE_SOURCE_ALREADY_EXISTS'; exit 1; }
          trap 'status=$?; rm -f -- "$AIDT_AUTH_ROOT/askpass"; if (( status != 0 )); then rm -rf -- "$AIDT_AUTH_ROOT"; fi' EXIT
          printf '%s\n' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA" > "$AIDT_AUTH_ROOT/.owner"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
          printf 'AIDT_AUTH_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$AIDT_AUTH_ROOT" "$AIDT_AUTH_ROOT" >> "$GITHUB_ENV"
          mkdir -- "$AIDT_AUTH_ROOT/source"
          cd "$AIDT_AUTH_ROOT/source"
          unset GIT_CONFIG GIT_COMMON_DIR GIT_TEMPLATE_DIR GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_PACK_ACCESS GIT_TRACE_PERFORMANCE GIT_TRACE_SETUP GIT_TRACE_SHALLOW GIT_TRACE_CURL GIT_TRACE_CURL_NO_DATA GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF GIT_CURL_VERBOSE CURL_VERBOSE
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$AIDT_AUTH_ROOT/askpass"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$AIDT_FETCH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git -c core.hooksPath=/dev/null init -q --template= . 2>/dev/null || { echo 'SOURCE_INIT_FAILED'; exit 1; }
          git -c core.hooksPath=/dev/null -c credential.helper= -c http.followRedirects=false fetch -q --depth=1 https://github.com/boardx/workspacex.git "$GITHUB_SHA" 2>/dev/null || { echo 'SOURCE_FETCH_FAILED'; exit 1; }
          git -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD 2>/dev/null || { echo 'SOURCE_CHECKOUT_FAILED'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'SOURCE_IDENTITY_MISMATCH'; exit 1; }
          [[ -f .nvmrc && ! -L .nvmrc && -f package.json && ! -L package.json ]]
          node_version=$(cat .nvmrc)
          [[ "$node_version" =~ ^[0-9]+([.][0-9]+){0,2}$ ]] || { echo 'SOURCE_NODE_VERSION_INVALID'; exit 1; }
          printf 'node-version=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
          printf 'sourceSha=%s\n' "$GITHUB_SHA"
      - uses: actions/setup-node@v5
        with:
          # v5 joins node-version-file to GITHUB_WORKSPACE; use the validated private file's value.
          node-version: ${{ steps.private-source.outputs.node-version }}
          package-manager-cache: false
      - name: Existing designated QA credentials only
        # Parse the official fixed QA path as data; no shell sourcing, fallback or secret copy.
        working-directory: ${{ runner.temp }}
        run: |
          cd "$AIDT_AUTH_ROOT/source"
          node apps/web/e2e/support/devapp-aidt-auth-readonly.mjs --preflight
      - name: Install the private source's pinned pnpm in the private directory
        # pnpm/action-setup reads shared GITHUB_WORKSPACE/.npmrc; use an isolated equivalent.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$AIDT_AUTH_ROOT/source"
          pnpm_version=$(node -e 'const p=require("./package.json").packageManager; if(typeof p!=="string" || !/^pnpm@[0-9]+\.[0-9]+\.[0-9]+$/.test(p)) process.exit(1); process.stdout.write(p.slice(5))')
          : > "$AIDT_AUTH_ROOT/user.npmrc"
          : > "$AIDT_AUTH_ROOT/global.npmrc"
          npm install --prefix "$AIDT_AUTH_ROOT/pnpm" --cache "$AIDT_AUTH_ROOT/npm-cache" --userconfig="$AIDT_AUTH_ROOT/user.npmrc" --globalconfig="$AIDT_AUTH_ROOT/global.npmrc" --registry=https://registry.npmjs.org --ignore-scripts --package-lock=false --no-audit --no-fund "pnpm@$pnpm_version"
          printf '%s\n' "$AIDT_AUTH_ROOT/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install dependencies in the private source
        working-directory: ${{ runner.temp }}
        run: |
          cd "$AIDT_AUTH_ROOT/source"
          pnpm install --frozen-lockfile --store-dir "$AIDT_AUTH_ROOT/pnpm-store"
      - name: Guard unit tests (no network or browser)
        working-directory: ${{ runner.temp }}
        run: |
          cd "$AIDT_AUTH_ROOT/source"
          node --test scripts/tests/devapp-aidt-auth-readonly.test.mjs
      # Chromium download only; no system package installation.
      - name: Install Chromium
        working-directory: ${{ runner.temp }}
        run: |
          cd "$AIDT_AUTH_ROOT/source"
          pnpm --filter web exec playwright install chromium
      - name: One UI login and read-only route gates
        # No credential copies, screenshots, traces or persisted storage-state files.
        working-directory: ${{ runner.temp }}
        run: |
          cd "$AIDT_AUTH_ROOT/source"
          node apps/web/e2e/support/devapp-aidt-auth-readonly.mjs
      - name: Remove only this attempt's owned private directory
        if: ${{ always() && steps.private-source.outputs.owned == 'true' }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED >&2; exit 1; }
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED >&2; exit 1; }
          AIDT_AUTH_ROOT="$RUNNER_TEMP/../wsx-aidt-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -L "$AIDT_AUTH_ROOT" ]] || exit 1
          if [[ -d "$AIDT_AUTH_ROOT" ]]; then
            [[ -f "$AIDT_AUTH_ROOT/.owner" && ! -L "$AIDT_AUTH_ROOT/.owner" ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED >&2; exit 1; }
            [[ "$(cat "$AIDT_AUTH_ROOT/.owner")" == "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA" ]] || { echo PRIVATE_DIRECTORY_OWNER_MISMATCH >&2; exit 1; }
            rm -rf -- "$AIDT_AUTH_ROOT"
          fi

  owned-failure-readonly:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owned_failure_readonly }}
    runs-on: [self-hosted, linux, x64, workspacex]
    environment: aidt-devapp-qa
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      AIDT_OWNED_FAILURE_READONLY: 'true'
      AIDT_AUTH_READONLY: ${{ inputs.aidt_auth_readonly }}
      AIDT_LIVE_DEV: 'true'
      AIDT_REUSABLE_ORDINARY_QA: 'true'
      AIDT_PROVISION_ORDINARY_QA: 'false'
      DEBUG: ''
      PWDEBUG: ''
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
      NEXT_TELEMETRY_DISABLED: '1'
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
    steps:
      - name: Reject combined model or auth-readonly modes
        env:
          COORDINATED_REQUEST: ${{ inputs.evidence_request_id }}
          COORDINATED_SOURCE: ${{ inputs.expected_source_sha }}
          COORDINATED_ATTEMPT: ${{ inputs.evidence_attempt }}
          COORDINATED_PARENT: ${{ inputs.parent_run_id }}
          COORDINATED_PARENT_ATTEMPT: ${{ inputs.parent_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/develop && "$AIDT_AUTH_READONLY" == false && -z "$COORDINATED_REQUEST$COORDINATED_SOURCE$COORDINATED_ATTEMPT$COORDINATED_PARENT$COORDINATED_PARENT_ATTEMPT" ]] || { echo OWNED_FAILURE_MODE_CONFLICT; exit 1; }
      - name: Fetch exact source into this attempt's private directory
        id: private-source
        env:
          AIDT_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          AIDT_FAILURE_PARENT="$(cd "$RUNNER_TEMP/.." && pwd -P)"
          AIDT_FAILURE_ROOT="$AIDT_FAILURE_PARENT/wsx-aidt-owned-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP"
          mkdir -- "$AIDT_FAILURE_ROOT" || { echo 'PRIVATE_SOURCE_ALREADY_EXISTS'; exit 1; }
          trap 'status=$?; rm -f -- "$AIDT_FAILURE_ROOT/askpass"; if (( status != 0 )); then rm -rf -- "$AIDT_FAILURE_ROOT"; fi' EXIT
          printf '%s\n' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA" > "$AIDT_FAILURE_ROOT/.owner"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
          printf 'AIDT_FAILURE_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$AIDT_FAILURE_ROOT" "$AIDT_FAILURE_ROOT" >> "$GITHUB_ENV"
          mkdir -- "$AIDT_FAILURE_ROOT/source"
          cd "$AIDT_FAILURE_ROOT/source"
          unset GIT_CONFIG GIT_COMMON_DIR GIT_TEMPLATE_DIR GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
          unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_PACK_ACCESS GIT_TRACE_PERFORMANCE GIT_TRACE_SETUP GIT_TRACE_SHALLOW GIT_TRACE_CURL GIT_TRACE_CURL_NO_DATA GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF GIT_CURL_VERBOSE CURL_VERBOSE
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$AIDT_FAILURE_ROOT/askpass"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$AIDT_FETCH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git -c core.hooksPath=/dev/null init -q --template= . 2>/dev/null || { echo 'SOURCE_INIT_FAILED'; exit 1; }
          git -c core.hooksPath=/dev/null -c credential.helper= -c http.followRedirects=false fetch -q --depth=1 https://github.com/boardx/workspacex.git "$GITHUB_SHA" 2>/dev/null || { echo 'SOURCE_FETCH_FAILED'; exit 1; }
          git -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD 2>/dev/null || { echo 'SOURCE_CHECKOUT_FAILED'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'SOURCE_IDENTITY_MISMATCH'; exit 1; }
          [[ -f .nvmrc && ! -L .nvmrc && -f package.json && ! -L package.json ]]
          node_version=$(cat .nvmrc)
          [[ "$node_version" =~ ^[0-9]+([.][0-9]+){0,2}$ ]] || { echo 'SOURCE_NODE_VERSION_INVALID'; exit 1; }
          printf 'node-version=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
          printf 'sourceSha=%s\n' "$GITHUB_SHA"
      - uses: actions/setup-node@v5
        with:
          # v5 joins node-version-file to GITHUB_WORKSPACE; use the validated private file's value.
          node-version: ${{ steps.private-source.outputs.node-version }}
          package-manager-cache: false
      - name: Validate the fixed owned-run reader without network
        working-directory: ${{ runner.temp }}
        run: |
          cd "$AIDT_FAILURE_ROOT/source"
          node --test scripts/tests/devapp-aidt-owned-failure-readonly.independent.test.mjs
          node --test scripts/tests/devapp-aidt-owned-failure-runner.independent.test.mjs
      - name: Build the explicitly allowlisted private control bundle
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$AIDT_FAILURE_ROOT/source"
          node scripts/build-aidt-owned-failure-bundle.mjs "$AIDT_FAILURE_ROOT/control"
      - name: Preflight existing reusable ordinary QA reader only
        working-directory: ${{ runner.temp }}
        env:
          AIDT_REUSABLE_QA_IDENTITY_SHA256: ${{ vars.AIDT_REUSABLE_QA_IDENTITY_SHA256 }}
          AIDT_REUSABLE_QA_EMAIL: ${{ secrets.AIDT_REUSABLE_QA_EMAIL }}
          AIDT_REUSABLE_QA_PASSWORD: ${{ secrets.AIDT_REUSABLE_QA_PASSWORD }}
        run: |
          cd "$AIDT_FAILURE_ROOT/control"
          node devapp-aidt-owned-failure-runner.mjs --preflight
      - name: Install only the pinned private browser runtime
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$AIDT_FAILURE_ROOT/control"
          sha256sum --check --status SHA256SUMS
          : > "$AIDT_FAILURE_ROOT/user.npmrc"
          : > "$AIDT_FAILURE_ROOT/global.npmrc"
          npm install --ignore-scripts --omit=optional --package-lock=false --no-audit --no-fund --userconfig "$AIDT_FAILURE_ROOT/user.npmrc" --globalconfig "$AIDT_FAILURE_ROOT/global.npmrc" --cache "$AIDT_FAILURE_ROOT/npm-cache"
          node node_modules/playwright/cli.js install chromium
      - name: Read only the fixed owned run after canonical author binding
        id: owned-read
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          AIDT_REUSABLE_QA_IDENTITY_SHA256: ${{ vars.AIDT_REUSABLE_QA_IDENTITY_SHA256 }}
          AIDT_REUSABLE_QA_EMAIL: ${{ secrets.AIDT_REUSABLE_QA_EMAIL }}
          AIDT_REUSABLE_QA_PASSWORD: ${{ secrets.AIDT_REUSABLE_QA_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$AIDT_FAILURE_ROOT/control"
          sha256sum --check --status SHA256SUMS
          node devapp-aidt-owned-failure-runner.mjs
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.private-source.outputs.owned == 'true' }}
        with:
          name: aidt-owned-failure-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AIDT_FAILURE_ROOT }}/control/output/owned-failure-readonly.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only this attempt's owned private directory
        if: ${{ always() && steps.private-source.outputs.owned == 'true' }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED; exit 1; }
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED; exit 1; }
          AIDT_FAILURE_PARENT="$(cd "$RUNNER_TEMP/.." && pwd -P)"
          AIDT_FAILURE_ROOT="$AIDT_FAILURE_PARENT/wsx-aidt-owned-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -L "$AIDT_FAILURE_ROOT" && -f "$AIDT_FAILURE_ROOT/.owner" && ! -L "$AIDT_FAILURE_ROOT/.owner" ]] || { echo PRIVATE_DIRECTORY_SCOPE_REJECTED; exit 1; }
          [[ "$(cat "$AIDT_FAILURE_ROOT/.owner")" == "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA" ]] || { echo PRIVATE_DIRECTORY_OWNER_MISMATCH; exit 1; }
          rm -rf -- "$AIDT_FAILURE_ROOT"
      - name: Preserve failed diagnostic verdict
        if: ${{ always() && steps.owned-read.outcome == 'failure' }}
        run: exit 1
