        if: needs.batch.outputs.run == 'true'
        run: printf 'artifact=board-native-shard-sync-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
