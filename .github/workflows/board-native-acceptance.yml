        if: always() && needs.batch.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: board-native-shard-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: /private/tmp/wsx-native-public-evidence/
          if-no-files-found: error
  native-board:
    needs:
      - batch
      - native-r01
      - native-connectors
      - native-files
      - native-sync
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOARD_NATIVE_EVIDENCE: /private/tmp/wsx-native-public-evidence
    steps:
      - name: Require successful batch admission
        env:
          BATCH_RESULT: ${{ needs.batch.result }}
          BATCH_RUN: ${{ needs.batch.outputs.run }}
        run: |
          if [[ "$BATCH_RESULT" != success || ( "$BATCH_RUN" != true && "$BATCH_RUN" != false ) ]]; then
            echo "Native batch admission failed or returned no verdict" >&2
            exit 1
          fi
      - if: needs.batch.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.batch.outputs.sha }}
      - name: Require all complete native shard producers
        if: needs.batch.outputs.run == 'true'
        env:
          EXPECTED_SHA: ${{ needs.batch.outputs.sha }}
          CI_NATIVE_NEEDS: ${{ toJSON(needs) }}
        run: node .harness/scripts/ci-board-native-shards.mjs
      - name: Prepare owned public evidence path
        if: needs.batch.outputs.run == 'true'
        run: |
          sudo install -d -m 1777 -o "$(id -u)" -g "$(id -g)" /private/tmp
          mkdir -p "$BOARD_NATIVE_EVIDENCE"
      - name: Collect r01 evidence
        if: needs.batch.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.native-r01.outputs.artifact }}
          path: /private/tmp/wsx-native-public-evidence/
      - name: Collect connectors evidence
        if: needs.batch.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.native-connectors.outputs.artifact }}
          path: /private/tmp/wsx-native-public-evidence/
      - name: Collect files evidence
        if: needs.batch.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.native-files.outputs.artifact }}
          path: /private/tmp/wsx-native-public-evidence/
      - name: Collect sync evidence
        if: needs.batch.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.native-sync.outputs.artifact }}
          path: /private/tmp/wsx-native-public-evidence/
      - name: Verify complete native shard evidence
        if: needs.batch.outputs.run == 'true'
        env:
          EXPECTED_SHA: ${{ needs.batch.outputs.sha }}
        run: node .harness/scripts/lib/board-native-receipts.mjs "$BOARD_NATIVE_EVIDENCE" "$EXPECTED_SHA"
      - name: Retain bounded statistics and screenshots without private runtime credentials
        if: always() && needs.batch.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: board-native-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /private/tmp/wsx-native-public-evidence/
          if-no-files-found: error
      - name: Preserve original native verdict without rerunning
        if: always() && needs.batch.outputs.run == 'false'
        env:
          ORIGINAL_RESULT: ${{ needs.batch.outputs.native }}
        run: test "$ORIGINAL_RESULT" = success
  meeting-room:
    needs: batch
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - if: needs.batch.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.batch.outputs.sha }}
      - if: needs.batch.outputs.run == 'true'
        uses: pnpm/action-setup@v4.4.0
      - if: needs.batch.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: needs.batch.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.batch.outputs.run == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run real isolated meeting-room and verify its evidence
        if: needs.batch.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm exec tsx .harness/scripts/with-test-isolation.ts -- pnpm --filter web run ci:board:meeting-room
      - name: Retain evidence without signing credentials
        if: always() && needs.batch.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: board-meeting-room-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/board-ci/meeting-room/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original meeting verdict without rerunning
        if: always() && needs.batch.outputs.run == 'false'
        env:
          ORIGINAL_RESULT: ${{ needs.batch.outputs.meeting }}
        run: test "$ORIGINAL_RESULT" = success
