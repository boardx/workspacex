# live-evidence —— deep-agent 活体取证的全自动通道（issue #1749 评分闭环）。
#
# 为什么存在：rubric 正式评分需要 VM 上的物理证据（SSE 原始流/thread state/
# checkpoint 历史），而评分会话没有 VM 通路。此前靠人 ssh + scp——人类 2026-08-23
# 裁决：评分过程必须全自动化，不许拿人当传输层。本 workflow 跑在 VM 的
# self-hosted runner 上（与 backend-gates 的 deploy 同一台），把证据包上传为
# artifact，评分会话用 `gh run download` 拉取——全程无人工。
#
# 只读边界与 live-evidence.sh 相同：探针 thread + 回环只读，不碰用户数据、
# 不重启服务。手动触发（workflow_dispatch），不挂在任何 push 钩子上。
name: live-evidence
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 采集活体证据（探针 thread，只读边界见脚本头）
        run: bash apps/deep-agent-service/scripts/live-evidence.sh
      - name: 收敛最新证据包
        run: cp "$(ls -t /tmp/deepagent-evidence-*.tar.gz | head -1)" ./deepagent-evidence.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: deepagent-evidence
          path: deepagent-evidence.tar.gz
          retention-days: 30
