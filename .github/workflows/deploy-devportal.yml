# deploy-devportal.yml — 协作平面 CD：main 上 apps/devportal 有新代码 → 自动部署
# develop.boardx.us（Cloudflare Pages 项目 devportal，#523 Track A）。
# 构建链 = next build → @cloudflare/next-on-pages → wrangler pages deploy。
# 凭据：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（Pages 权限即可）。
# 运行时 secrets（GITHUB_TOKEN/COORD_API_TOKEN/COORD_GATEWAY_ADMIN_TOKEN 等）在
# Pages 项目侧，与本流水线无关。
name: deploy-devportal

on:
  pull_request:
    paths:
      - "apps/devportal/**"
      - ".github/scripts/devportal-artifact*"
      - ".github/workflows/deploy-devportal.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/devportal/**"
      - ".github/scripts/devportal-artifact*"
      - ".github/workflows/deploy-devportal.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # PR 只取消同一 PR 的旧验证；main 发布共享固定 ref group、排队且永不互相取消。
  group: deploy-devportal-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVPORTAL_ARTIFACT_DIR: .ci-artifacts/devportal-pages

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node (read .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @repo/devportal...

      - name: Verify artifact identity and workflow contracts
        run: node --test .github/scripts/devportal-artifact.test.mjs

      - name: Typecheck / lint / test
        run: pnpm --filter @repo/devportal run typecheck && pnpm --filter @repo/devportal run lint && pnpm --filter @repo/devportal run test

      - name: Install Playwright Chromium
        run: pnpm --filter @repo/devportal exec playwright install --with-deps chromium

      - name: E2E (repeatable local gateway fixture)
        run: pnpm --filter @repo/devportal run e2e

      - name: Build Pages artifact (next + next-on-pages)
        working-directory: apps/devportal
        run: |
          pnpm build
          pnpm run pages:build

      - name: Seal validated Pages artifact
        if: github.event_name == 'push'
        run: |
          mkdir -p "$DEVPORTAL_ARTIFACT_DIR"
          tar -czf "$DEVPORTAL_ARTIFACT_DIR/pages.tar.gz" -C apps/devportal/.vercel/output/static .
          node .github/scripts/devportal-artifact.mjs seal

      - name: Upload validated Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: devportal-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEVPORTAL_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node (read .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @repo/devportal...

      - name: Download validated Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: devportal-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEVPORTAL_ARTIFACT_DIR }}

      - name: Verify immutable producer and archive bytes
        run: node .github/scripts/devportal-artifact.mjs verify

      - name: Restore validated Pages artifact without rebuilding
        run: |
          mkdir -p apps/devportal/.vercel/output/static
          tar -xzf "$DEVPORTAL_ARTIFACT_DIR/pages.tar.gz" -C apps/devportal/.vercel/output/static

      - name: Assert public-layer host configured (D13)
        working-directory: apps/devportal
        run: node scripts/assert-public-host.mjs --allow-placeholder  # 人类选定公开域名后去掉此参数

      - name: Deploy, production smoke, and automatic rollback
        working-directory: apps/devportal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match apps/devportal/wrangler.toml [vars]. Tests fail on drift.
          CF_ACCESS_TEAM_DOMAIN: https://boardx.cloudflareaccess.com
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/pages-cutover.mjs
