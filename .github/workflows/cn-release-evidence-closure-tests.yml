name: CN original evidence closure offline tests
on:
  pull_request:
    paths:
      - scripts/cn-release-evidence-closure.py
      - scripts/cn-release-measurement.py
      - scripts/cn-release-evidence-correlation.py
      - tests/test_cn_release_evidence_closure.py
      - tests/test_cn_release_evidence_correlation.py
      - tests/test_cn_release_entry.py
      - .harness/scripts/vm/cn-release-advance.py
      - .github/workflows/cn-release-evidence-closure-tests.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Original harmless executor closure and tampering tests
        run: python3 -B -m unittest discover -s tests -p 'test_cn_release_evidence_*.py' -v
