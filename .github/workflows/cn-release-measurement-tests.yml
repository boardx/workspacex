name: CN release measurement offline tests
on:
  pull_request:
    paths:
      - scripts/cn-release-measurement.py
      - tests/test_cn_release_measurement.py
      - tests/test_cn_release_entry.py
      - .harness/scripts/vm/cn-release-advance.py
      - .github/workflows/cn-release-measurement-tests.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read-only timing and original durable-entry regression
        run: python3 -B -m unittest discover -s tests -p test_cn_release_measurement.py -v
