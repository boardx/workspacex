name: devapp-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 3
    steps:
      - name: Read exact interrupted report execution metadata only
        shell: bash
        run: |
          set -euo pipefail
          docker inspect --format '{"created":{{json .Created}},"startedAt":{{json .State.StartedAt}},"restartCount":{{.RestartCount}}}' workspacex-deep-agent
          docker exec -i workspacex-deep-agent python - <<'PY'
          import os,json,re
          import psycopg
          from psycopg.rows import dict_row
          target='e0b7e5d6-09af-4613-9c38-b4f9bee05164'
          try:
              dsn=os.environ.get('DEEP_AGENT_CHECKPOINT_DB') or os.environ.get('DATABASE_URI','')
              with psycopg.connect(dsn,connect_timeout=5,row_factory=dict_row) as connection:
                  connection.execute('SET TRANSACTION READ ONLY')
                  connection.execute("SET LOCAL statement_timeout = '5s'")
                  rows=connection.execute("SELECT run_id,thread_id,status,error,created_at,updated_at FROM wsx_agent_runs WHERE request #>> '{config,configurable,run_control_callback,run_id}' = %s ORDER BY created_at DESC LIMIT 2",(target,)).fetchall()
                  safe=[]
                  for row in rows:
                      error=row.get('error') or ''
                      safe.append({'run_id':row['run_id'],'thread_id':row['thread_id'],'status':row['status'],'error_class':error if re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]{0,100}',error) else ('none' if not error else 'unclassified'),'created_at':str(row['created_at']),'updated_at':str(row['updated_at'])})
                  print(json.dumps({'target':target,'matched':len(safe),'runs':safe}))
          except Exception as error:
              print(json.dumps({'target':target,'diagnostic_error_class':type(error).__name__}))
              raise SystemExit(1)
          PY
