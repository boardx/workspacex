# devapp 能力探针 —— **只读**，用来回答「coord-main 在那台机器上到底能做什么」。
#
# 背景：devapp 同时是 self-hosted runner `devapp-x64`。人类 2026-08-05 指示
# 「跳过我，不要等我，你自己要有能力解决，我只是给你做配置好权限」。
# 要自己解，先得知道边界在哪 —— 而边界只能实测，不能猜。
#
# ⚠ 本工作流**不写任何东西**：没有 install / rm / psql 写操作 / systemctl。
#   它只回答四个问题，每个都附带正样本以证明探针本身有效。
name: devapp-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 5
    steps:
      - name: 记忆检索三路（字面 / 向量 / 图）在 devapp 上的实际状态（只读，密钥打码）
        shell: bash
        run: |
          set +e
          ENV=/opt/workspacex/deploy.env
          host() { printf '%s' "$1" | sed -E 's#^([a-z]+://[^/?]+)([^?]*).*#\1\2#'; }
          echo "── 部署的 commit ──"; git -c safe.directory=/opt/workspacex/app -C /opt/workspacex/app log --oneline -1 2>&1
          echo "── deploy.env 里与模型 / 嵌入相关的 key 名（只列名字）──"
          grep -oE '^[A-Z0-9_]+' "$ENV" 2>/dev/null | grep -E 'MODEL|EMBED|DASHSCOPE|DEEP_AGENT|RERANK|KG_' | sort | tr '\n' ' '; echo
          set -a; . "$ENV" 2>/dev/null; set +a
          for v in KERNEL_EMBEDDING_MODEL_ID KERNEL_EMBEDDING_MODEL_VERSION KERNEL_EMBEDDING_DIMENSIONS KERNEL_MODEL_ID KERNEL_RERANK_MODE KERNEL_RERANK_MODEL_ID DASHSCOPE_MODEL; do
            echo "  $v=${!v:-<未设置>}"; done
          for v in KERNEL_MODEL_BASE_URL DASHSCOPE_BASE_URL KERNEL_DEEP_AGENT_BASE_URL; do echo "  $v=$(host "${!v:-<未设置>}")"; done
          for v in KERNEL_MODEL_API_KEY DASHSCOPE_API_KEY DEEP_AGENT_SERVICE_INTERNAL_KEY; do [ -n "${!v}" ] && echo "  $v=<已设置>" || echo "  $v=<未设置>"; done
          echo "── 运行中的 deep-agent 容器里有没有嵌入配置（只看 key 名）──"
          docker ps --format '{{.Names}}' | grep -i deep
          for c in $(docker ps --format '{{.Names}}' | grep -i deep); do docker exec "$c" printenv 2>/dev/null | grep -oE '^(KERNEL_EMBEDDING[A-Z_]*|KERNEL_MODEL_BASE_URL)' | tr '\n' ' '; echo " ← $c"; done
          echo "── API 进程环境里有没有嵌入配置（只看 key 名）──"
          pid=$(systemctl show -p MainPID --value workspacex-api 2>/dev/null); echo "  api pid=$pid"
          sudo -n cat /proc/$pid/environ 2>/dev/null | tr '\0' '\n' | grep -oE '^KERNEL_EMBEDDING[A-Z_]*' | tr '\n' ' ' || echo "  (读不到进程环境)"; echo
          echo "── 在 deep-agent 容器里用它自己的模型凭据试嵌入（嵌入的真实调用路径；只打印维度 / 错误）──"
          docker exec -i workspacex-deep-agent python - <<'PY' 2>&1 | head -40
          import json, os, httpx
          base = os.environ.get("KERNEL_MODEL_BASE_URL", "").rstrip("/")
          key = os.environ.get("KERNEL_MODEL_API_KEY", "")
          print("  base host:", base.split("://")[-1].split("/")[0] if base else "<未设置>", "| path:", "/" + "/".join(base.split("://")[-1].split("/")[1:]) if base else "", "| key:", "已设置" if key else "未设置")
          if base and key:
              h = {"Authorization": "Bearer " + key}
              try:
                  r = httpx.get(base + "/models", headers=h, timeout=20)
                  ids = [m.get("id") for m in r.json().get("data", [])]
                  print("  /models:", r.status_code, "共", len(ids), "个；带 embed 的:", [i for i in ids if "embed" in (i or "").lower()][:20])
              except Exception as e:
                  print("  /models 失败:", type(e).__name__, str(e)[:120])
              for m in ["text-embedding-v4", "text-embedding-v3", "text-embedding-v2", "text-embedding-3-small", "BAAI/bge-m3", "bge-m3"]:
                  try:
                      r = httpx.post(base + "/embeddings", headers=h, json={"model": m, "input": ["记忆检索测试", "第二句"] * 5}, timeout=30)
                      d = r.json()
                      data = d.get("data") or []
                      if data and data[0].get("embedding"):
                          print("   ", m, "→ OK", r.status_code, "维度", len(data[0]["embedding"]), "条数", len(data))
                      else:
                          print("   ", m, "→ 失败", r.status_code, str(d.get("error", d))[:160])
                  except Exception as e:
                      print("   ", m, "→ 异常", type(e).__name__, str(e)[:120])
          print("  容器里的嵌入 env key:", sorted(k for k in os.environ if k.startswith("KERNEL_EMBEDDING")))
          PY
          echo "── deep-agent 的 /internal/retrieval/embeddings 路由是否存在（不带密钥应 401）──"
          docker exec workspacex-deep-agent python -c "import httpx;print(httpx.post('http://127.0.0.1:2024/internal/retrieval/embeddings',json={'texts':['x']},timeout=10).status_code)" 2>&1 | tail -1
          PSQL="docker exec workspacex-postgres-1 psql -U postgres -d workspacex -tAc"
          echo "── 扩展：已装 / 可装版本 ──"
          $PSQL "SELECT name, default_version, installed_version FROM pg_available_extensions WHERE name IN ('age','vector')"
          echo "── 登记的嵌入模型 ──"; $PSQL "SELECT model, model_version, dims FROM embedding_models"
          echo "── object_embeddings / segment_embeddings 按模型计数 ──"
          $PSQL "SELECT 'object', model, count(*) FROM object_embeddings GROUP BY 2 UNION ALL SELECT 'segment', model, count(*) FROM segment_embeddings GROUP BY 2"
          echo "── 结论总数 / 活结论 ──"; $PSQL "SELECT count(*), count(*) FILTER (WHERE revoked_at IS NULL) FROM claims"
          echo "── AGE 图数量、每张图的点/边 ──"
          $PSQL "SELECT count(*) FROM ag_catalog.ag_graph"
          for g in $($PSQL "SELECT name FROM ag_catalog.ag_graph" 2>/dev/null); do
            echo "  $g: $($PSQL "SELECT (SELECT count(*) FROM \"$g\"._ag_label_vertex), (SELECT count(*) FROM \"$g\"._ag_label_edge)" 2>&1)"; done
          echo "── 队列积压（抽取 / 投影 / 嵌入 / 冲突）──"
          for t in kg_extraction_queue kg_projection_outbox kg_embedding_outbox kg_conflict_close_queue; do echo "  $t: $($PSQL "SELECT count(*) FROM $t" 2>&1)"; done
          echo "── 最近 7 天的召回：轮数、降级轮数、各通道命中次数 ──"
          $PSQL "SELECT count(*), count(*) FILTER (WHERE graph_degraded) FROM kg_turn_recalls WHERE created_at > now() - interval '7 days'"
          $PSQL "SELECT ch, count(*) FROM kg_turn_recalls r, jsonb_array_elements(r.items) i, jsonb_array_elements_text(i->'channels') ch WHERE r.created_at > now() - interval '7 days' GROUP BY 1 ORDER BY 2 DESC"
          echo "── 召回明细（最近 5 轮：每轮命中的通道）──"
          $PSQL "SELECT r.created_at::timestamp(0), r.graph_degraded, (SELECT string_agg(DISTINCT ch, ',') FROM jsonb_array_elements(r.items) i, jsonb_array_elements_text(i->'channels') ch) FROM kg_turn_recalls r ORDER BY r.created_at DESC LIMIT 5"
          echo "── 召回明细加长（最近 5 轮：条目数 / 各通道 / retrievalReasons；不打印结论正文）──"
          $PSQL "SELECT r.created_at::timestamp(0), r.graph_degraded, jsonb_array_length(r.items), (SELECT string_agg(DISTINCT ch, ',') FROM jsonb_array_elements(r.items) i, jsonb_array_elements_text(i->'channels') ch), (SELECT string_agg(DISTINCT rr, ',') FROM jsonb_array_elements(r.items) i, jsonb_array_elements_text(coalesce(i->'retrievalReasons','[]'::jsonb)) rr) FROM kg_turn_recalls r ORDER BY r.created_at DESC LIMIT 5" 2>&1
          echo "── 最近 6 次 agent run：创建时间 / 状态 / 错误码 / 心跳（判 39 秒 network error 是服务端失败还是前端断流）──"
          $PSQL "SELECT created_at::timestamp(0), status, coalesce(error_code,'-'), heartbeat_at::timestamp(0), model_id FROM agent_runs ORDER BY created_at DESC LIMIT 6" 2>&1
          echo "── deep-agent 最近 30 分钟的错误行（只取前 160 字符，关键字过滤）──"
          docker logs --since 30m workspacex-deep-agent 2>&1 | grep -iE 'traceback|exception|error|timeout|cancel' | grep -v '200 OK' | tail -15 | cut -c1-160 || true
          echo "── 抽取三道闸门：部署开关 / 组织开关（provider 是否配置看 API 启动日志）──"
          $PSQL "SELECT * FROM kg_extraction_state" 2>&1 | head -3
          $PSQL "SELECT org_id, enabled, updated_at::timestamp(0) FROM kg_org_extraction_settings ORDER BY 3 DESC" 2>&1 | head -12
          echo "── 最近 7 天的消息量与抽取结果 ──"
          $PSQL "SELECT count(*), count(*) FILTER (WHERE author_kind='human') FROM chat_messages WHERE created_at > now() - interval '7 days'" 2>&1
          echo "  最近 7 天人发的消息 × 抽取结果（null = 从没进过抽取）："
          $PSQL "SELECT coalesce(o.outcome,'<无记录>'), count(*) FROM chat_messages m LEFT JOIN kg_message_extraction_outcomes o ON o.message_id = m.id WHERE m.author_kind='human' AND m.created_at > now() - interval '7 days' GROUP BY 1 ORDER BY 2 DESC" 2>&1 | head -8
          echo "  全部抽取结果："; $PSQL "SELECT outcome, count(*), max(recorded_at)::timestamp(0) FROM kg_message_extraction_outcomes GROUP BY 1" 2>&1 | head -8
          echo "  最近 12 条人发的消息：时间 / 长度 / 个人还是项目会话 / 抽取结果（不打印正文）"
          $PSQL "SELECT m.created_at::timestamp(0), length(m.body), CASE WHEN t.project_id IS NULL THEN 'personal' ELSE 'project' END, coalesce(o.outcome,'<无记录>') FROM chat_messages m JOIN chat_threads t ON t.id = m.thread_id LEFT JOIN kg_message_extraction_outcomes o ON o.message_id = m.id WHERE m.author_kind='human' ORDER BY m.created_at DESC LIMIT 12" 2>&1
          echo "  抽取失败 / 跳过原因（SLO 表若有）："
          $PSQL "SELECT table_name FROM information_schema.tables WHERE table_name LIKE 'kg_%slo%' OR table_name LIKE 'kg_%gate%'" 2>&1 | head -5
          echo "── API 最近 72h 的 kg extraction 日志行（只含 id / 计数 / 原因，最多 20 行）──"
          journalctl -u workspacex-api --since "-72h" -o cat 2>&1 | grep -F 'kg extraction' | tail -20 | cut -c1-400 || true
          echo "  （journal 行数自检）$(journalctl -u workspacex-api --since '-72h' -o cat 2>/dev/null | wc -l)"
          echo "── API 最近 24h 与嵌入 / 图 / 召回相关的报错（最多 25 行）──"
          journalctl -u workspacex-api --since "-24h" 2>&1 | grep -iE 'embedding|KG_GRAPH|graph_unavailable|vector|recall.*(fail|degrad)' | grep -viE 'debug' | tail -25
          echo "── deep-agent 最近 24h 嵌入报错（最多 10 行）──"
          for c in $(docker ps --format '{{.Names}}' | grep -i deep); do docker logs --since 24h "$c" 2>&1 | grep -iE 'embedding' | tail -10 || true; done
          exit 0

      - name: 我是谁、能 sudo 什么
        shell: bash
        run: |
          echo "── whoami ──"; id
          echo "── sudo -l（这决定我能不能换那个部署脚本）──"
          sudo -n -l 2>&1 || echo "(sudo -l 不可用)"

      - name: 机器内存与磁盘（决定 next build 能给多大堆）
        shell: bash
        run: |
          echo "── free -m ──"; free -m
          echo "── nproc ──"; nproc
          echo "── df /opt/workspacex ──"; df -h /opt/workspacex 2>&1 || true
          echo "── .next 现状（构建产物是否完整）──"
          ls -l /opt/workspacex/app/apps/web/.next/BUILD_ID 2>&1 || echo "(无 BUILD_ID)"
          cat /opt/workspacex/app/apps/web/.next/BUILD_ID 2>/dev/null || echo "(读不到 BUILD_ID ⇒ 上次构建没跑完)"
          ls -ld /opt/workspacex/app/apps/web/.next/static/chunks 2>&1 || true
          (cd /opt/workspacex/app && git log --oneline -1) 2>&1 || true

      - name: 应用目录的属主与可写性
        shell: bash
        run: |
          echo "── /opt/workspacex ──"
          ls -ld /opt/workspacex /opt/workspacex/app 2>&1 || true
          echo "── 我能不能写 app 目录 ──"
          [ -w /opt/workspacex/app ] && echo "可写" || echo "不可写"
          echo "── deploy.env 在哪、能不能读 ──"
          ls -l /opt/workspacex/deploy.env /etc/workspacex/deploy.env 2>&1 || true

      - name: 两份 deploy 脚本差在哪（只 diff，不覆盖）
        shell: bash
        run: |
          echo "── root 副本 ──"
          ls -l /usr/local/bin/workspacex-deploy 2>&1 || echo "(不存在)"
          sudo -n sha256sum /usr/local/bin/workspacex-deploy 2>&1 || \
            sha256sum /usr/local/bin/workspacex-deploy 2>&1 || echo "(读不到)"
          echo "── 仓库版 ──"
          sha256sum /opt/workspacex/app/.harness/scripts/vm/deploy.sh 2>&1 || echo "(读不到)"
          echo "── 关键差异：root 副本里有没有 nonce 契约与 ENV_FILE 传递 ──"
          for pat in 'status-nonce' 'workspacex-deploy/v1' 'ENV_FILE'; do
            n=$(grep -c "$pat" /usr/local/bin/workspacex-deploy 2>/dev/null || echo "读不到")
            echo "  $pat -> $n"
          done

      - name: 生产库可达性（只数行，不改任何数据）
        shell: bash
        run: |
          set +e
          # 上次探针实测：宿主机没有 psql 二进制（"command not found"）。数据库跑在
          # docker 容器 workspacex-postgres-1 里（deploy.sh 就是这么连的），改用
          # docker exec 进容器跑 psql——容器内镜像自带 psql，这条路径才是真实生效的。
          PSQL="docker exec workspacex-postgres-1 psql -U postgres -d workspacex -tAc"
          echo "── 正样本 SELECT 1 ──"; $PSQL "SELECT 1" 2>&1 | head -3
          echo "── credentials 行数 ──"; $PSQL "SELECT count(*) FROM credentials" 2>&1 | head -3
          echo "── auth_bootstrap_state 行数 ──"; $PSQL "SELECT count(*) FROM auth_bootstrap_state" 2>&1 | head -3

      - name: 用户数据是否还在（2026-09-07 usamshen 报「个人对话全没了，数据库被清空了吗」——只读核实，不改数据）
        shell: bash
        run: |
          set +e
          PSQL="docker exec workspacex-postgres-1 psql -U postgres -d workspacex -tAc"
          echo "── postgres 容器创建时间（是不是被重建过，判定是否发生过数据卷重置）──"
          docker inspect -f '{{.Created}}' workspacex-postgres-1 2>&1
          echo "── 数据卷 mountpoint 与最早文件 mtime（佐证同上）──"
          docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' workspacex-postgres-1 2>&1
          echo "── organizations / credentials 总行数（全库，判断是不是整库被清）──"
          $PSQL "SELECT count(*) FROM organizations" 2>&1 | head -3
          $PSQL "SELECT count(*) FROM credentials" 2>&1 | head -3
          echo "── usamshen 的 credentials 行是否还在（列名按 0010 迁移是 user_id，不是 id；不取密码哈希以外的敏感字段）──"
          $PSQL "SELECT user_id, email FROM credentials WHERE email ILIKE '%usam%'" 2>&1 | head -5
          echo "── chat_threads 总行数、按 created_by 分组数（判断是不是所有会话都没了，还是只有这个用户/项目视图没了）──"
          $PSQL "SELECT count(*) FROM chat_threads" 2>&1 | head -3
          $PSQL "SELECT created_by, count(*) FROM chat_threads GROUP BY created_by ORDER BY 2 DESC LIMIT 10" 2>&1 | head -12
          echo "── 该账号名下的线程分布在哪些 org/project（按 created_by 精确匹配一次即可，先看上一步分组里哪个 user_id 对上邮箱）──"
          $PSQL "SELECT t.org_id, t.project_id, t.ownership_layer, count(*) FROM chat_threads t JOIN credentials c ON c.user_id = t.created_by WHERE c.email ILIKE '%usam%' GROUP BY 1,2,3" 2>&1 | head -10
          echo "── org_memberships：该账号属于哪些组织（个人对话是否落在一个他已不在其中的组织下）──"
          $PSQL "SELECT om.org_id, om.user_id FROM org_memberships om JOIN credentials c ON c.user_id = om.user_id WHERE c.email ILIKE '%usam%'" 2>&1 | head -10
          echo "── projects 总行数（判断是新建库还是老库）──"
          $PSQL "SELECT count(*) FROM projects" 2>&1 | head -3
          echo "── usam@boardx.us（u-f43693f4…）精确按个人线程判据统计：project_id IS NULL（#594 起个人线程的真实过滤条件），按 org 分组 ──"
          $PSQL "SELECT org_id, count(*) FROM chat_threads WHERE created_by='u-f43693f453ca98f43e9b628d260a41ea' AND project_id IS NULL GROUP BY org_id" 2>&1 | head -10
          echo "── 同一账号，project_id 非空（项目线程）按 org 分组，作对照 ──"
          $PSQL "SELECT org_id, count(*) FROM chat_threads WHERE created_by='u-f43693f453ca98f43e9b628d260a41ea' AND project_id IS NOT NULL GROUP BY org_id" 2>&1 | head -10
          echo "── API 日志：最近 30 分钟内 personal-thread / listPersonalThreads 相关的错误或 5xx（判断是不是接口本身在报错，前端把错误吞成了空列表）──"
          journalctl -u workspacex-api --since "-30min" 2>&1 | grep -iE "personal|thread" | grep -iE "error|5[0-9][0-9]|exception|fail" | tail -30 || echo "（无匹配行）"
          echo "── API 日志：最近 30 分钟内 5xx 总数（正样本：日志本身可读）──"
          journalctl -u workspacex-api --since "-30min" 2>&1 | grep -c '"statusCode":5' || true
          echo "── org_memberships：usam@boardx.us 在 org-2e5de17f74b8731f（切换器里选中的「boardx」）的角色行是否存在、org_role 是否合法 ──"
          $PSQL "SELECT user_id, org_id, org_role, team_id FROM org_memberships WHERE user_id='u-f43693f453ca98f43e9b628d260a41ea' AND org_id='org-2e5de17f74b8731f'" 2>&1 | head -5
          echo "── organizations 表：该 org 行本身是否存在、id 精确比对（排除大小写/前后空格差异）──"
          $PSQL "SELECT id, length(id) FROM organizations WHERE id LIKE 'org-2e5de17f74b8731f%'" 2>&1 | head -5
          echo "── 最近 15 分钟 API 日志：GET /chat/threads 请求与响应（个人对话列表的真实端点，看请求是否到达、返回什么）──"
          journalctl -u workspacex-api --since "-15min" 2>&1 | grep -F "/chat/threads" | grep -v "/chat/threads/" | tail -20 || echo "（无匹配行——说明前端根本没发出这个请求，或访问日志不含路径，需要换一种抓法）"
          echo "── 关键假设：个人对话列表按 thread-grouping.ts 只回「今天/本周」两组、UTC 周一起算，本周之前的线程恒不进返回值——不是过滤成不可见，是设计上压根不下发（见该文件头注）。核对该账号个人线程 last_activity_at 的分布 ──"
          $PSQL "SELECT now() AT TIME ZONE 'UTC' AS server_now_utc" 2>&1 | head -3
          $PSQL "SELECT max(last_activity_at), min(last_activity_at) FROM chat_threads WHERE created_by='u-f43693f453ca98f43e9b628d260a41ea' AND project_id IS NULL" 2>&1 | head -3
          echo "── 落在本 UTC 自然周（周一 00:00 起）内的个人线程有几条——0 条就精确对应「今天/本周」分组规则吃掉了全部历史线程 ──"
          $PSQL "SELECT count(*) FROM chat_threads WHERE created_by='u-f43693f453ca98f43e9b628d260a41ea' AND project_id IS NULL AND last_activity_at >= date_trunc('week', now() AT TIME ZONE 'UTC')" 2>&1 | head -3
