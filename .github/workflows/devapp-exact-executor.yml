name: devapp-exact-executor
run-name: devapp-exact:${{ inputs.evidence_attempt }}:${{ inputs.evidence_request_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [deploy, sign]
        required: true
      expected_source_sha:
        type: string
        required: true
      evidence_attempt:
        type: string
        required: true
      evidence_request_id:
        type: string
        required: true
      parent_run_id:
        type: string
        required: true
      parent_run_attempt:
        type: string
        required: true
      browser_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
# The cloud backend-gates parent holds workspacex-devapp-deploy. Acquiring that
# mutex here would deadlock the parent waiting for its child on the only runner.
jobs:
  execute:
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
      PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the live exact-source parent deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .harness/scripts/vm/devapp-exact-evidence.mjs authorize-child
      - name: Reject drift between reviewed source and installed trusted tools
        run: |
          source .harness/scripts/vm/deploy-gate.sh
          assert_trusted_copies_match_repo
      - name: Deploy the exact admitted candidate through the installed wrapper
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | sudo -n /usr/local/bin/workspacex-deploy --devapp-candidate "$GITHUB_SHA" "$PARENT_RUN_ID" "$PARENT_RUN_ATTEMPT" "$EVIDENCE_ATTEMPT"
      - name: Sign terminal browser evidence using the separately installed fixed root entry
        if: inputs.mode == 'sign'
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RUN_ID: ${{ inputs.browser_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$EVIDENCE_ATTEMPT" =~ ^gha-[0-9]+-[0-9]+$ && "$BROWSER_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/devapp-signed-evidence"
          printf '%s' "$GH_TOKEN" | sudo -n /usr/local/bin/workspacex-deploy --devapp-evidence "$GITHUB_SHA" "$EVIDENCE_ATTEMPT" "$BROWSER_RUN_ID" > "$RUNNER_TEMP/devapp-signed-evidence/devapp-evidence.bin"
      - uses: actions/upload-artifact@v6
        if: inputs.mode == 'sign' && success()
        with:
          name: devapp-signed-evidence
          path: ${{ runner.temp }}/devapp-signed-evidence/devapp-evidence.bin
          if-no-files-found: error
          retention-days: 1
      - name: Remove this attempt's signed envelope staging
        if: always() && inputs.mode == 'sign'
        run: rm -f "$RUNNER_TEMP/devapp-signed-evidence/devapp-evidence.bin"
