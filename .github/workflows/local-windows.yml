# local-windows.yml —— 本地版在真 Windows 上能不能起来（#4315）。
#
# 为什么要有这个：人类要 0.3.0 同时出 Windows 安装包，而本地版的运行时与打包脚本是按
# macOS/POSIX 写的（sh 垫片、`:` 路径分隔、lsof/ps、进程组）。在 mac 上交叉编
# `electron-builder --win` 会得到一个装得上、跑不起来的安装包——包里带的是 mac 的
# 原生模块。所以判据只能在真 Windows 上取：先让核心栈（PGlite + 迁移 + 种子 + api）
# 在 windows-latest 上起来，再逐步加 web / deep-agent / 模型 / 打包。
#
# 第一版刻意「红了也往下跑」：每一步的失败都是移植清单上的一项，一次跑完看全貌，
# 比修一个推一次省得多。判定写在最后一步，只有它决定这个 job 的颜色。
name: local-windows

on:
  pull_request:
    paths:
      - 'packages/local-runtime/**'
      - 'apps/desktop/**'
      - 'scripts/local-bundle/**'
      - '.github/workflows/local-windows.yml'
  workflow_dispatch:

concurrency:
  group: local-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-stack:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: local-runtime unit tests
        id: unit
        continue-on-error: true
        working-directory: packages/local-runtime
        run: pnpm exec vitest run --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/unit.log"; exit ${PIPESTATUS[0]}

      - uses: astral-sh/setup-uv@v7.0.0
      - name: bundle relocatable Python for deep-agent
        id: python
        continue-on-error: true
        run: bash scripts/local-bundle/bundle-python.sh "$RUNNER_TEMP/python" 2>&1 | tail -20; exit ${PIPESTATUS[0]}

      - name: build web (production, local API baked in)
        id: webbuild
        continue-on-error: true
        working-directory: apps/desktop
        run: pnpm run build:web 2>&1 | tail -40; exit ${PIPESTATUS[0]}

      - name: up --web start --no-pull (core stack + web)
        id: up
        continue-on-error: true
        run: |
          DATA="$RUNNER_TEMP/wsx-data"
          ( cd packages/local-runtime && pnpm exec tsx src/cli.ts up --data-dir "$DATA" --web start --no-pull --bundle-python "$RUNNER_TEMP/python" > "$RUNNER_TEMP/up.log" 2>&1 ) &
          api=0; web=0; agent=0
          for i in $(seq 1 240); do
            [ $api = 0 ] && curl -fsS --max-time 3 http://127.0.0.1:3200/healthz >/dev/null 2>&1 && { api=1; echo "api healthz ok after ${i}x2s"; }
            [ $web = 0 ] && [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3100/)" -lt 500 ] 2>/dev/null && [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3100/)" != 000 ] && { web=1; echo "web answers after ${i}x2s: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)"; }
            [ $agent = 0 ] && curl -fsS --max-time 3 http://127.0.0.1:2024/healthz >/dev/null 2>&1 && { agent=1; echo "deep-agent healthz ok after ${i}x2s"; }
            [ $api = 1 ] && [ $web = 1 ] && [ $agent = 1 ] && break
            sleep 2
          done
          tail -60 "$RUNNER_TEMP/up.log"
          echo "api=$api web=$web deep-agent=$agent"
          [ $api = 1 ] && [ $web = 1 ] && [ $agent = 1 ]

      - name: collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/wsx-data/logs" "$RUNNER_TEMP/out/service-logs" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: local-windows-logs
          path: ${{ runner.temp }}/out

      - name: verdict
        if: always()
        run: |
          echo "unit=${{ steps.unit.outcome }} python=${{ steps.python.outcome }} webbuild=${{ steps.webbuild.outcome }} up=${{ steps.up.outcome }}"
          [ "${{ steps.unit.outcome }}" = success ] && [ "${{ steps.python.outcome }}" = success ] && [ "${{ steps.webbuild.outcome }}" = success ] && [ "${{ steps.up.outcome }}" = success ]

  # 便携包：真正交给用户的那个东西（#4315）。核心栈那个 job 证明代码能在 Windows 上跑；
  # 这个 job 证明**打出来的包**能跑——解压到一个与构建目录无关的地方，用它自己的
  # WorkspaceX.exe 起来，等它写下 [boot] ready，再打 healthz。产物存在 ≠ 能起来。
  portable:
    runs-on: windows-latest
    timeout-minutes: 150
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'windows-package')
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7.0.0

      - name: assets — Ollama (Windows)
        run: OLLAMA_TARGET=windows-amd64 bash scripts/local-bundle/fetch-ollama.sh && du -sh apps/desktop/bin
      - name: assets — relocatable Python
        run: bash scripts/local-bundle/bundle-python.sh "$GITHUB_WORKSPACE/apps/desktop/python" 2>&1 | tail -3
      - name: assets — models (GGUF chat + embedding, no 2b)
        run: |
          STORE="$RUNNER_TEMP/ollama-store"; mkdir -p "$STORE"
          OLLAMA_MODELS="$STORE" OLLAMA_HOST=127.0.0.1:11499 apps/desktop/bin/ollama.exe serve > "$RUNNER_TEMP/ollama-pull.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:11499/api/tags >/dev/null && break; sleep 1; done
          for m in qwen3.5:4b qwen3-embedding:0.6b; do OLLAMA_HOST=127.0.0.1:11499 apps/desktop/bin/ollama.exe pull "$m" 2>&1 | tail -1; done
          ( cd packages/local-runtime && pnpm exec tsx src/cli.ts export-models --source "$STORE" --dest "$GITHUB_WORKSPACE/apps/desktop/models" --models qwen3.5:4b,qwen3-embedding:0.6b )
          taskkill //IM ollama.exe //F //T || true
          du -sh apps/desktop/models
      - name: assets — speech model + sandbox modules
        run: |
          bash scripts/local-bundle/bundle-asr-model.sh "$RUNNER_TEMP/asr-src" | tail -1
          bash scripts/local-bundle/prepare-sandbox-modules.sh | tail -1

      - name: dist:win (portable zip)
        working-directory: apps/desktop
        run: pnpm run dist:win 2>&1 | tail -30; exit ${PIPESTATUS[0]}

      - name: smoke — unzip elsewhere, launch, wait for [boot] ready
        id: smoke
        run: |
          ZIP="$(ls apps/desktop/release/*.zip | head -1)"; ls -la "$ZIP"
          DEST="$RUNNER_TEMP/installed"; UD="$RUNNER_TEMP/userdata"; rm -rf "$DEST" "$UD"; mkdir -p "$DEST"
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$ZIP")' -DestinationPath '$(cygpath -w "$DEST")' -Force"
          EXE="$(find "$DEST" -maxdepth 2 -name WorkspaceX.exe | head -1)"; echo "exe=$EXE"
          "$EXE" --user-data-dir="$(cygpath -w "$UD")" > "$RUNNER_TEMP/app-stdout.log" 2>&1 &
          LOG="$UD/local/desktop.log"; ready=0
          for i in $(seq 1 450); do grep -q "\[boot\] ready" "$LOG" 2>/dev/null && { ready=1; echo "boot ready after ${i}x2s"; break; }; grep -q "启动失败" "$LOG" 2>/dev/null && break; sleep 2; done
          sleep 30
          grep -E "\[boot\] ready|启动失败|\[model\]|改用|收掉" "$LOG" | head -20 || true
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3200/healthz); web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3100/); agent=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:2024/healthz)
          echo "ready=$ready api=$api web=$web deep-agent=$agent"
          model_ok=0; grep -q "\[model\] .* 就绪" "$LOG" && model_ok=1; echo "chat model answered=$model_ok"
          taskkill //IM WorkspaceX.exe //F //T || true
          [ $ready = 1 ] && [ "$api" = 200 ] && [ "$web" != 000 ] && [ "$agent" = 200 ] && [ $model_ok = 1 ]
      - name: collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"; cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/userdata/local/desktop.log" "$RUNNER_TEMP/userdata/local/logs" "$RUNNER_TEMP/out/" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: local-windows-portable-logs
          path: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@v6
        if: steps.smoke.outcome == 'success'
        with:
          name: WorkspaceX-windows-x64-portable
          path: apps/desktop/release/*.zip
          compression-level: 0
