name: Isolated CN release simulation
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Ten complete regressions use this single immutable checkout
        type: choice
        options: [ '1', '10' ]
        default: '1'
      lane:
        description: Targeted repairs run in four independent VMs; all preserves full regression
        type: choice
        options: [ 'all', 'release', 'targeted', 'linux-application-recovery-complete', 'linux-six-business', 'linux-boundary-reap' ]
        default: 'all'
      mode:
        description: Development retains known clean business failures; never final acceptance
        type: choice
        options: [ 'acceptance', 'development' ]
        default: 'acceptance'
      seed:
        description: Integer base seed for isolated fault fixtures
        type: string
        default: '0'
  workflow_call:
    inputs:
      rounds:
        type: string
        default: "1"
        required: false
      lane:
        type: string
        default: all
        required: false
      mode:
        type: string
        default: acceptance
        required: false
      seed:
        type: string
        default: "0"
        required: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      split: ${{ steps.plan.outputs.split }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - name: Resolve fixed single-round workflow plan
        id: plan
        env:
          LANE: ${{ inputs.lane || 'all' }}
          ROUNDS: ${{ inputs.rounds || '1' }}
          MODE: ${{ inputs.mode || 'acceptance' }}
        run: |
          python3 -I -B - <<'PYPLAN'
          import importlib.util,json,os
          spec=importlib.util.spec_from_file_location('sim','scripts/cn-release-simulation.py')
          sim=importlib.util.module_from_spec(spec);spec.loader.exec_module(sim)
          plan=sim.workflow_plan(os.environ['LANE'],int(os.environ['ROUNDS']),os.environ['MODE'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('suites='+json.dumps(plan['suites'])+'\n')
              output.write('split='+str(plan['split']).lower()+'\n')
          PYPLAN
  simulation:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
      max-parallel: 2
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # Ancestor-bound independent review requires old fixCommit objects.
          # Fetch once in GitHub; the root-owned clone and evaluator stay offline.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.0
          run_install: false
      - name: Build job-local PostgreSQL fixture image once
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          docker pull pgvector/pgvector:pg16
          base=$(docker image inspect pgvector/pgvector:pg16 --format '{{index .RepoDigests 0}}')
          [[ "$base" =~ ^pgvector/pgvector@sha256:[a-f0-9]{64}$ ]]
          docker build --build-arg "PGVECTOR_IMAGE=$base" --build-arg "SOURCE_REVISION=$GITHUB_SHA" --iidfile "$RUNNER_TEMP/cn-startup-image.id" apps/api/docker/postgres-age
          image=$(cat "$RUNNER_TEMP/cn-startup-image.id")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "CN_API_STARTUP_PG_IMAGE=$image" >> "$GITHUB_ENV"
          python3 -c 'import json,sys,time;json.dump(dict(kind="cn-fixture-image-setup-v1",commit=sys.argv[1],baseDigest=sys.argv[2],imageId=sys.argv[3],buildSeconds=int(time.time())-int(sys.argv[4]),productionAccepted=False),open(sys.argv[5],"x"))' "$GITHUB_SHA" "$base" "$image" "$started" "$RUNNER_TEMP/cn-image-setup.json"
      - name: Resolve job-local Redis fixture image once
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          docker pull redis:7-alpine
          digest=$(docker image inspect redis:7-alpine --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ ^redis@sha256:[a-f0-9]{64}$ ]]
          image=$(docker image inspect "$digest" --format '{{.Id}}')
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
          echo "CN_SIX_REDIS_IMAGE=$image" >> "$GITHUB_ENV"
          python3 -c 'import json,sys,time;json.dump(dict(kind="cn-fixture-redis-setup-v1",commit=sys.argv[1],digest=sys.argv[2],imageId=sys.argv[3],setupSeconds=int(time.time())-int(sys.argv[4]),productionAccepted=False),open(sys.argv[5],"x"))' "$GITHUB_SHA" "$digest" "$image" "$started" "$RUNNER_TEMP/cn-redis-setup.json"
      - name: Install isolated FUSE fixture build prerequisites
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y libfuse3-dev pkg-config gcc
          test -c /dev/fuse
      - name: Install isolated fixture dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/cn-fixture" --no-audit --no-fund --save-exact tsx@4.20.6 zod@3.25.76 pg@8.13.1 playwright@1.62.0
          "$RUNNER_TEMP/cn-fixture/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/cn-fixture/node_modules" >> "$GITHUB_ENV"
          echo "CN_TEST_PLAYWRIGHT=$RUNNER_TEMP/cn-fixture/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CN_TEST_CHROMIUM=$(node -e 'process.stdout.write(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/cn-fixture/node_modules/playwright")" >> "$GITHUB_ENV"
          echo "CN_ARCHIVE_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "CN_ARCHIVE_TEST_RUNTIME=$RUNNER_TEMP/cn-fixture" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/cn-test-sdk"
          "$RUNNER_TEMP/cn-test-sdk/bin/pip" install --disable-pip-version-check oss2==2.19.1 alibabacloud-credentials==0.3.6 aliyun-python-sdk-core==2.16.0 aliyun-python-sdk-sts==3.1.2
      - name: Bound Linux terminal delegation diagnostics before release-only measurement
        if: matrix.suite == 'release'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/cn-terminal-home"
          set +e
          timeout --signal=TERM --kill-after=2s 25s sudo -n env -i PATH="$PATH" HOME="$RUNNER_TEMP/cn-terminal-home" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$RUNNER_TEMP/cn-test-sdk/bin/python" -I -B -c 'import faulthandler,sys,unittest;sys.path.insert(0,"tests");faulthandler.dump_traceback_later(15);suite=unittest.defaultTestLoader.loadTestsFromName("test_cn_release_terminal_delegation.TerminalTests");result=unittest.TextTestRunner(verbosity=2).run(suite);sys.exit(not result.wasSuccessful())' > "$RUNNER_TEMP/cn-terminal-diagnostic.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cn-terminal-diagnostic.log"
          exit "$status"
      - name: Run production-code fixture suites with bounded logs
        env:
          ROUNDS: ${{ inputs.rounds || '1' }}
          SEED: ${{ inputs.seed || '0' }}
          MODE: ${{ inputs.mode || 'acceptance' }}
          SUITE: ${{ matrix.suite }}
          WORKERS: ${{ (matrix.suite == 'all' || matrix.suite == 'remaining') && '3' || '1' }}
        run: 'sudo -n env -i PATH="$PATH" CN_ARCHIVE_TEST_NODE="$CN_ARCHIVE_TEST_NODE" CN_ARCHIVE_TEST_RUNTIME="$CN_ARCHIVE_TEST_RUNTIME" NODE_PATH="$NODE_PATH" CN_TEST_PLAYWRIGHT="$CN_TEST_PLAYWRIGHT" CN_TEST_CHROMIUM="$CN_TEST_CHROMIUM" GITHUB_ACTIONS=true CN_API_STARTUP_PG_IMAGE="$CN_API_STARTUP_PG_IMAGE" CN_SIX_REDIS_IMAGE="$CN_SIX_REDIS_IMAGE" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" "$RUNNER_TEMP/cn-test-sdk/bin/python" -I -B scripts/cn-release-simulation-ci.py --sha "$GITHUB_SHA" --rounds "$ROUNDS" --seed "$SEED" --suite "$SUITE" --workers "$WORKERS" --mode "$MODE"'
      - name: Export bounded reports for the unprivileged artifact uploader
        if: always()
        run: |
          mkdir -m 700 "$RUNNER_TEMP/cn-simulation-artifacts"
          if [ -f "$RUNNER_TEMP/cn-image-setup.json" ]; then cp "$RUNNER_TEMP/cn-image-setup.json" "$RUNNER_TEMP/cn-simulation-artifacts/image-setup.json"; fi
          if [ -f "$RUNNER_TEMP/cn-redis-setup.json" ]; then cp "$RUNNER_TEMP/cn-redis-setup.json" "$RUNNER_TEMP/cn-simulation-artifacts/redis-setup.json"; fi
          sudo -n env -i PATH="$PATH" /usr/bin/python3 -I -B scripts/cn-release-simulation.py --export-parent "$RUNNER_TEMP"
      - name: Preserve simulation report and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cn-simulation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/cn-simulation-artifacts/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/*.csv
            ${{ runner.temp }}/cn-simulation-artifacts/*.txt
            ${{ runner.temp }}/cn-simulation-artifacts/fullstack-install.log
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/*.log
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/*.jsonl
            ${{ runner.temp }}/cn-terminal-diagnostic.log
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/api-container-owner/owner.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/api-container-owner/api-create-intent.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/api-container-owner/api-create-receipt.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/api-container-owner/cleanup.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/api-container-owner/recovery-cleanup.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/application-recovery-owner/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/sim14-evidence/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/six-business/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/six-business/application.log
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/six-business/next-build.log
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/six-infra-owner/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/six-kill-target-owner/*.json
            ${{ runner.temp }}/cn-simulation-artifacts/round-*/six-kill-control-owner/*.json
          retention-days: 7
          if-no-files-found: warn

  aggregate:
    name: ${{ needs.plan.outputs.split == 'true' && 'simulation (all)' || 'split-aggregation (not selected)' }}
    needs: [ plan, simulation ]
    if: always() && needs.plan.outputs.split == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require both producer jobs to succeed
        env:
          RESULT: ${{ needs.simulation.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v5
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cn-simulation-${{ github.run_id }}-${{ github.run_attempt }}-release
          path: ${{ runner.temp }}/cn-split-parts/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cn-simulation-${{ github.run_id }}-${{ github.run_attempt }}-remaining
          path: ${{ runner.temp }}/cn-split-parts/remaining
      - name: Reconcile exact complete suite and case inventories
        env:
          SEED: ${{ inputs.seed || '0' }}
        run: python3 -I -B scripts/cn-release-simulation-aggregate.py --parts "$RUNNER_TEMP/cn-split-parts" --output "$RUNNER_TEMP/cn-split-combined" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --seed "$SEED"
      - name: Retain combined report without widening acceptance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cn-simulation-${{ github.run_id }}-${{ github.run_attempt }}-combined
          path: ${{ runner.temp }}/cn-split-combined
          retention-days: 7
          if-no-files-found: warn
concurrency:
  group: cn-release-simulation-full-${{ github.run_id }}
  cancel-in-progress: false
  queue: single
