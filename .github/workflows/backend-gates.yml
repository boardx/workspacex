# backend-gates.yml —— 需要真 Docker + PostgreSQL 的那套门控。
#
# ⚠ 2026-08-06：`gates` 从自建 runner（`[self-hosted, linux, x64, workspacex]`）
# 改回 GitHub 托管 `ubuntu-latest`。原头注写的理由是「托管 runner 上又慢又贵」——
# 那句话在两个前提都不成立时写下的：① 本仓是**公开仓库**，GitHub 托管 runner 的
# Linux 分钟数对公开仓库是**免费且不限量**的，不存在「贵」；② `harness-verify.yml`
# 的 `fullstack-smoke` job 早就在 `ubuntu-latest` 上跑真实 docker-compose + Postgres
# 起真栈（含 `core-loop.spec.ts` 的浏览器 E2E），本仓自己已经证明「托管 runner 跑不了
# 真 docker」是假的。
#
# 唯一的真实原因是本文件自己 :39 那句——**自建 runner 上跑 fork PR 等于任何人一个
# PR 就能在这台机器上执行任意命令**。但 `gates` 这个 job 不碰任何密钥、不碰生产机器
# （起的是本地一次性 `workspacex-kernel` docker-compose 栈，`deploy` job 才碰真机），
# 放到 GitHub 托管的一次性沙箱上跑，那条风险本来就不存在。
#
# ⇒ 只把不需要真机权限的 `gates` 挪走。`deploy` 仍然钉死在自建 runner
# （`devapp-x64`）——它调用的 `/usr/local/bin/workspacex-deploy` 是那台机器上
# root 拥有的路径，sudoers 只认那一条，挪不动。
#
# 挪走的直接收益：这台自建 runner 长期只有一台，`gates` 在每次 main push + 每个
# PR 上都会跑，过去是全仓库唯一的排队瓶颈——所有 agent 的所有分支都在同一条队列
# 里等同一台机器。挪到 GitHub 托管、并发不限于 1 之后，这条队列基本消失；
# `deploy` 本身还是短的（一次几分钟），单机足够——即使 2026-08-06 起改成每次 main
# push 都触发（不再等人工打 tag），也比 `gates` 频繁不到哪去：同一 ref 的
# concurrency group 保证不会有两个 deploy 同时抢那台机器，最坏情况是排队等一轮，
# 不是竞态。
#
# 触发：main 的每次推送 + 打标签 + 手动。
# `local.env` 的 ANSWER_Q3 原填「打标签时跑」，2026-07-29 按 P-1 改为 main 上也跑：
# 托管 runner 分钟数不要钱，而「只在打标签时跑」意味着问题在发版当天一次性爆出来。
name: backend-gates

on:
  # ⚠ 2026-08-26（#485 / #1656）：补上 `pull_request`。在此之前本 workflow 只在
  # **合入之后**开火，后果不是「慢一点」，是这几道门**在能便宜修复的时点上完全不设防**：
  #   · gates-fast   —— `harness doctor --strict`、`lint-contract-source`、`lint-arch-deps`
  #   · gates-test   —— apps/api 全套单测/集成测试（4 分片）
  #   · gates-runtime—— RLS 强制隔离反证、三道运行时门、迁移幂等
  #   · e2e-core-loop—— 核心闭环八步（唯一接入发布门的浏览器 e2e）
  # 其中 `lint-contract-source` **只**在本 workflow 里跑（apps/api 自己的 lint 链里没有），
  # 所以它过去在 PR 阶段是零覆盖的。
  #
  # 实测后果（#485 记录）：backend-gates 在 main 上连红三次，每次都被下一个 PR 直接
  # 盖过去；后来者不可能知道自己正在往一棵红树上合，因为红是在他合完之后才亮的。
  # #1656 记录了另一半：跨包扫描的门（`no-builtin-capability-lists` 住在 api 却扫
  # apps/web/lib/mock/**）被 PR 侧的 `turbo --affected` 判为「未受影响」而跳过，
  # 违规长出来合进 main，由下一个改 api 的人替它红。本 workflow 不带 `--affected`，
  # 因此加上 PR 触发同时补掉这个洞。
  #
  # 成本（用真实 run 数据核过，不是估算）：四个 gate job 互不 `needs`，并行跑，
  # wall clock ≈ 最慢的 gates-test 分片。近三次 main run 实测 8m16s / 6m54s / 6m46s。
  # 全部在 GitHub 托管 `ubuntu-latest` 上——本仓是 **PUBLIC**，托管 runner 的 Linux
  # 分钟数免费且不限量。#485 原文写的「自建 runner 上每个 PR 多跑 ~11-20 分钟」是
  # 在这些 job 还钉在自建 runner 上时写的，#615 挪走之后那条已经过期。
  #
  # fork PR：三个 gates job 早就带着 `if: ... head.repo.full_name == github.repository`，
  # e2e-core-loop 本次补齐同一条。`deploy` 的 `if:` 只认 refs/heads/main 与 refs/tags/v*，
  # PR 的 ref 是 refs/pull/N/merge ⇒ 自建 runner 与部署路径在 PR 上天然不可达。
  pull_request:
  push:
    tags: ["v*"]
    branches: [main]     # 2026-07-29 开启（P-1）：自建 runner 没有分钟数成本，
                         # 「只在打标签时跑」意味着问题在发版当天一次性爆出来
  workflow_dispatch:
    inputs:
      deploy_capabilities_preview:
        description: 'Deploy the authorized standard-capabilities core preview to devapp after gates pass'
        type: boolean
        default: false

# 同一 ref 内只跑一个：`gates` 会 DROP DATABASE，`WORKSPACEX_DB` 按 run id 分库已经
# 做了隔离，但排队更省心，也更容易读日志。挪到托管 runner 后并发度不再受制于
# 「只有一台机器」，这条 concurrency group 现在纯粹是同一 ref 内部的排队，不同 ref
# （不同分支/PR）之间互不影响，各走各的托管 runner 实例。
#
# `cancel-in-progress` 分 ref 取值（#485）：PR 上为 true —— 同一个 PR 连推三次时，
# 前两次的验证结果已经没人要了，掐掉省队列也省时延。main / tag 上必须保持 false ——
# 那里每一次 run 对应一个**已经合入**的 commit，掐掉等于让那个 commit 永远没被验证过，
# 而且 `deploy` 挂在同一条 workflow 上，掐掉可能掐掉一次真实部署。
# ⚠ 2026-09-08（#3038 同款）：同一 group 只保留一个 pending，与 cancel-in-progress 无关。
# runner 排满时 main 的 run 一直 pending，下一次 merge 一来就被顶掉——实测 04:56Z–05:11Z
# 连续 3 个 main run（43fd37a87 / 92b06a316 / 61f8fb130）cancelled，0 job，含 deploy 的
# 那条链根本没跑。PR 仍按 ref 成组（要的就是顶掉旧轮）；push / tag / dispatch 每个 run
# 自成一组。deploy job 自己有 `workspacex-devapp-deploy` 组（cancel-in-progress: false），
# 多个 main run 到了部署那一步仍串行，不会并发写同一台机器。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backend-gates-{0}', github.ref) || format('backend-gates-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #633（人类新增硬 SLA，2026-08-06）：merge→devapp < 5 分钟。实测基线 8m45s，
  # `gates` 单个 job 占 6m32s，其中 vitest 单测 4m58s（gates 总耗时 76%，最大单项）。
  #
  # ⚠ 三个 job 不是随便切的——切之前逐个确认了「不需要共享上一步留下的状态」：
  #   `verify-rls.sh` / `verify-runtime-gates.sh` / `verify-migrations.sh`
  #   （即 `migrate:check`）三个脚本**各自** `pg_up; pg_reset` 后重新跑迁移
  #   （`lib.sh`），互不依赖 vitest 或彼此的库状态——本来就是从空库重新建的设计，
  #   不是本次拆分才发现能拆。`doctor --strict` / 契约单源 / 洋葱分层三条不碰
  #   Docker/Postgres（纯读 git + 文件）。⇒ 三组各自独立，可以放进不同 job、
  #   不同的托管 runner 实例上真正同时跑，而不只是「看起来分开了」。
  #
  #   之前（PR #574 之前 e2e 那次）以为「拆 job」在这台仓库行不通，那时候
  #   `gates` 还钉在唯一一台自建 runner 上（`devapp-x64`）——拆分只会排队、多付
  #   几次 checkout+install 的固定开销，不会变快。#615 已经把 `gates` 挪到
  #   `ubuntu-latest`（托管 runner，公开仓库并发不限于 1），这个前提今天不成立
  #   了，拆分现在才真正有意义。
  gates-fast:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠ 必须全深度：doctor --strict 用 `git merge-base --is-ancestor <commit> origin/main`
          # 判「passing 的实现是否已在 main 上」（doctor.ts:358）。见下方历史事故记录。
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # #115: 裸 `pnpm --filter api run typecheck` 绕过 turbo.json 的
      # `typecheck: { dependsOn: ["^build"] }`——@repo/fabric-markdown 的类型故意走
      # dist/*.d.ts，`pnpm turbo run` 会先跑它的 #build。
      - name: typecheck / lint
        run: pnpm turbo run typecheck lint --filter=@repo/api

      # --strict：把「passing 的实现必须已合入 main」升为 FAIL。
      # 实测：tag v0.1.8-staging 曾报 164 FAIL（=22 phase00+142 phase01，恰好全部
      # passing 数）——浅克隆没有 origin/main 这个 ref，doctor 把每一条 passing
      # 都判成「还不在 main 上」；deploy 的条件是 needs: gates，后果是 tag 触发的
      # 部署从来就不可能成功（见 #483/#499）。本 job 已用 fetch-depth: 0 排除了它。
      - name: 审计链体检（严格模式）
        run: pnpm harness doctor --strict

      - name: 契约单源 / 洋葱分层
        run: |
          node .harness/scripts/lint-contract-source.mjs
          node .harness/scripts/lint-arch-deps.mjs apps/api/src

  # 2026-08-17：实测这个 job 中位数 17.2min（12 个真实 run 样本，min=13.8/max=18.5），
  # 占 backend-gates 总时长（22m19s 那次实测）的 79%——是整条流水线唯一的瓶颈。
  #
  # 根因：apps/api/vitest.config.ts 的 maxWorkers=1（2026-08-12，#1068/#1090 续作）
  # 强制 584 个测试文件在**同一个 job 里单进程串行**，是当时唯一能立刻堵住"同一
  # postgres 实例被同一进程池打爆连接数"的办法。不能简单调大 maxWorkers 复现那次
  # 事故——那个根因（ADR-106 批次二，卡在"先解决 DB 测试隔离粒度"前置条件）还没解。
  #
  # 这次拆的是 job 级并行，不是进程级：用 vitest 原生的 `--shard <i>/<n>` 把 584
  # 个文件切成 4 份，每份进独立的 GitHub 托管 runner、起自己的 docker-compose
  # postgres 容器（本来就是这么起的，只是现在 4 份各自起一份）。每个 job 内部
  # 仍然是 maxWorkers=1——#1068/#1090 的根因（同一进程池打同一个库）在跨 job 的
  # 独立容器场景里根本不存在，不需要先解决它。
  #
  # 分片探针（本地实测，`vitest list --shard=1/4` vs 不带 --shard）：1/4 分片拿到
  # 1534/5362 条测试用例（约 28.6%，文件测试数不均匀，不是精确四等分，量级对得上）。
  # 理论收益：17.2min → 约 4-5min，整条流水线大概率降到 10 分钟以内。
  gates-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false # 一片红不该掩盖其它片的结果——都跑完，一次性看全部真实失败
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # 分片间必须各自独立的库名，同一 run_id 下 4 个 job 并发起，不加 shard 索引
      # 会撞库名——`WORKSPACEX_DB` 是隔离边界，见 #538。
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}_test_${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v7.0.0
        with:
          version: "0.12.5"
      - name: Install locked Python runtime for cross-language API integration tests
        working-directory: apps/deep-agent-service
        run: uv sync --frozen --extra dev

      # 先把容器拉起来，让镜像拉取有自己的一步、日志好读。每个 shard 是独立
      # runner，天然有自己的 docker daemon，容器之间不会互相干扰。
      - name: 起 postgres
        run: docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel up -d postgres

      - name: "单元与集成测试（含 RLS、两层交集、契约响应校验）—— shard ${{ matrix.shard }}/4"
        run: pnpm --filter api exec vitest run --shard=${{ matrix.shard }}/4

      - name: 清掉本次运行的数据库
        if: always()
        run: |
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel exec -T postgres \
            psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS ${WORKSPACEX_DB} WITH (FORCE)" || true

  native-document-chain:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 35
    env:
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}_native_document
      WX_NATIVE_SANDBOX_CONTAINER: wx-native-document-skill-sandbox-sessions-1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7.0.0
        with:
          version: "0.12.5"
      - run: uv sync --frozen --extra dev
        working-directory: apps/deep-agent-service
      - name: Load dedicated session AppArmor policy
        run: |
          sudo apparmor_parser -r -W apps/skill-sandbox/security/docker-apparmor-sessions
      - name: Build and start the actual isolated document sandbox
        run: |
          docker compose -p wx-native-document -f apps/skill-sandbox/docker-compose.sessions.yml -f apps/skill-sandbox/security/compose.apparmor-ci.yml up -d --build
          for attempt in $(seq 1 30); do
            if docker exec "$WX_NATIVE_SANDBOX_CONTAINER" test -S /run/sessions/skill-sandbox.sock; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify actual policy and user-code isolation
        run: |
          docker inspect --format '{{.AppArmorProfile}} {{json .HostConfig.SecurityOpt}}' "$WX_NATIVE_SANDBOX_CONTAINER"
          test "$(docker inspect --format '{{.AppArmorProfile}}' "$WX_NATIVE_SANDBOX_CONTAINER")" = workspacex-native-sessions
          docker compose -p wx-native-document -f apps/skill-sandbox/docker-compose.sessions.yml -f apps/skill-sandbox/security/compose.apparmor-ci.yml run --rm --no-deps \
            -e SKILL_SANDBOX_SOCKET=/tmp/isolation-check.sock \
            --volume "$PWD/apps/skill-sandbox/tests/session-container.mjs:/session-test.mjs:ro" \
            --entrypoint node skill-sandbox-sessions /session-test.mjs
      - name: Start isolated PostgreSQL
        run: docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel up -d postgres
      - name: Actual document parse and cached-source revocation
        run: pnpm --filter api exec vitest run --config vitest.native-document.config.ts
      - name: Capture bounded AppArmor denials
        if: failure()
        run: sudo dmesg | grep 'apparmor="DENIED"' | tail -40 || true
      - name: Release owned infrastructure
        if: always()
        run: |
          docker compose -p wx-native-document -f apps/skill-sandbox/docker-compose.sessions.yml -f apps/skill-sandbox/security/compose.apparmor-ci.yml down --volumes
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel down --volumes
          sudo apparmor_parser -R apps/skill-sandbox/security/docker-apparmor-sessions

  # #3052 —— DevApp 唯一真实路径（`KERNEL_NATIVE_RUNTIME=1`）此前在 CI 里零覆盖。
  #
  # 2026-09-08：三层根因（#3051 重名 / #3058 非法 stable_name / #3065 前言名不等）在
  # **所有门全绿**的情况下把 DevApp 打挂一整天。#3033 的复盘把原因写死了两条：
  #   ① 全仓 workflow/compose 里没有一处 `KERNEL_NATIVE_RUNTIME`；
  #   ② CI 真栈里没有"组织在 4j 补种之前自己装过同名 skill"这类遗留数据形态。
  # 本 job 两条一起补：开准入变量、跑 4i/4j、再往库里种出那三种坏行。
  #
  # 为什么是 backend-gates 的新 job，不是 e2e-full 的新 playwright project：
  #   · 前置（真沙箱会话容器 + AppArmor + 隔离 PG + uv）与紧邻的 native-document-chain
  #     完全重合，照它加一个兄弟 job 与现有编排冲突最小；
  #   · e2e-full 那条要把整套 chat-read 真栈再拉一遍，与 #3091 的 runner 队列压力冲突；
  #   · deploy 门挂在本文件上——原生路径挂了还照样部署，正是 2026-09-08 那一天。
  # 边界（issue #3052 自己写的）：不改 DevApp 部署行为，也不把原生准入开进任何**现有**
  # lane——沙箱/会话容器会拖慢全部 e2e。本 job 只跑必要用例：一个 vitest 文件 + 一个
  # pytest 文件，实测 ~9 分钟（其中约 4 分钟是沙箱镜像 build）。
  native-runtime-lane:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    env:
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}_native_runtime
      WX_NATIVE_SANDBOX_CONTAINER: wx-native-runtime-skill-sandbox-sessions-1
      # 这一行就是 #3052 的全部要点。deploy.sh L76 在 DevApp 上强制它是 1；
      # 在这里之前，没有任何 CI 车道设过它。
      KERNEL_NATIVE_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7.0.0
        with:
          version: "0.12.5"
      - run: uv sync --frozen --extra dev
        working-directory: apps/deep-agent-service
      - name: Load dedicated session AppArmor policy
        run: |
          sudo apparmor_parser -r -W apps/skill-sandbox/security/docker-apparmor-sessions
      - name: 起真实的隔离原生会话沙箱容器
        run: |
          docker compose -p wx-native-runtime -f apps/skill-sandbox/docker-compose.sessions.yml -f apps/skill-sandbox/security/compose.apparmor-ci.yml up -d --build
          for attempt in $(seq 1 30); do
            if docker exec "$WX_NATIVE_SANDBOX_CONTAINER" test -S /run/sessions/skill-sandbox.sock; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: 起隔离 PostgreSQL
        run: docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel up -d postgres
      # 4i/4j 由用例自己在 beforeAll 里调（`backfillPlatformOrg`/`backfillPlatformSkills`
      # 与 deploy.sh 引的是同两个导出），不在这里另起一步——补种必须发生在"组织自己的
      # 同名遗留行"之后才复现得出 #3051 的次序，workflow 层做不到这个次序。
      - name: 原生准入下的真实 pins → 真实沙箱会话（#3051 / #3058 的数据形态）
        run: pnpm --filter @repo/api exec vitest run --config vitest.native-runtime-lane.config.ts
      - name: 真实沙箱发现上游前言名的 skill（#3065 的数据形态）
        working-directory: apps/deep-agent-service
        run: uv run --extra dev pytest tests/test_native_skill_activity.py -v
      - name: Capture bounded AppArmor denials
        if: failure()
        run: sudo dmesg | grep 'apparmor="DENIED"' | tail -40 || true
      - name: Release owned infrastructure
        if: always()
        run: |
          docker compose -p wx-native-runtime -f apps/skill-sandbox/docker-compose.sessions.yml -f apps/skill-sandbox/security/compose.apparmor-ci.yml down --volumes
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel exec -T postgres \
            psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS ${WORKSPACEX_DB} WITH (FORCE)" || true
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel down --volumes
          sudo apparmor_parser -R apps/skill-sandbox/security/docker-apparmor-sessions

  gates-runtime:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    env:
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}_runtime
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: RLS 强制隔离（反证：绕过应用层过滤跨租户读 0 行）
        run: apps/api/scripts/verify-rls.sh

      - name: 三道运行时门控（双向断言 + 生产不可达）
        run: apps/api/scripts/verify-runtime-gates.sh

      - name: 迁移幂等（无视版本表强制重放）
        run: pnpm --filter api run migrate:check

      - name: 清掉本次运行的数据库
        if: always()
        run: |
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel exec -T postgres \
            psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS ${WORKSPACEX_DB} WITH (FORCE)" || true

  # #633（人类裁决 2026-08-06）：module 测试（`gates`）继续阻塞合并/部署；浏览器 e2e
  # 不再阻塞 PR 合并（见 harness-verify.yml 的 `fullstack-smoke` job），但**必须**阻塞
  # 发布——"发布前必须经过 e2e" 在此之前完全不成立：fullstack-smoke 只在 harness-verify.yml
  # （PR 触发）跑过，`deploy` 的前置条件只有 `gates`（单测/RLS/runtime gates），
  # 从没跑过真浏览器 + 真 docker 栈的 core-loop.spec.ts 那套。
  #
  # 只接入 `core-loop.spec.ts`（不是全部 5+1 个 fullstack-smoke spec）——同一次裁决
  # 紧接着收紧：5 分钟合并→上线 SLA 下等不起另外 5 个 spec，且 #631 报过「核心闭环
  # 步骤 1 被无关 spec 的抖动拖累」。`core-loop.spec.ts` 已在
  # `apps/web/playwright.fullstack-smoke.config.ts` 里拆成独立 project 链（core-loop-seeded
  # → core-loop-reset → core-loop-empty-db），与 `seeded`（其余 5 个 spec）互不 dependencies，
  # `pnpm run verify:core-loop` 只会拉起这条链，不会捎带 `seeded`。
  #
  # 不 `needs: gates`：两个 job 没有先后依赖，能并行就并行。
  #
  # ⚠ 2026-08-06 首次真跑就红：原来写的是 `[self-hosted, linux, x64, workspacex]`，
  # 那台机器上的 CI 用户 `ghrunner` 没有免密 sudo——`playwright install --with-deps`
  # 要装系统级依赖，第一步就是 `sudo apt-get`，直接 `sudo: I'm sorry ghrunner. I'm
  # afraid I can't do that` 退出。这个 job 和 `gates`（见 #615）同一个论证：不碰
  # devapp 真机、不碰密钥，只是起本地一次性 docker 栈 + 真 Chromium，`harness-verify.yml`
  # 的 `fullstack-smoke` 早就在 `ubuntu-latest` 上跑通同一形状的浏览器 e2e——挪过去。
  e2e-core-loop:
    runs-on: ubuntu-latest
    # 2026-08-26（#485）：与另外三个 gates job 对齐的 fork PR 守卫。本 workflow 加上
    # `pull_request` 触发之前，这个 job 只可能被 main push / tag / 手动触发，没有 fork
    # 这条路径，所以缺这行不会有后果；加了 PR 触发之后它就是真实敞口了，补齐。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - name: 核心闭环八步（唯一接入发布门的浏览器 e2e spec）
        shell: bash
        run: |
          mkdir -p phases/phase-01-run-a-project/evidence/ci
          set +e
          pnpm run verify:core-loop 2>&1 | tee phases/phase-01-run-a-project/evidence/ci/core-loop.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload core-loop evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-gates-core-loop-evidence-${{ github.run_id }}
          path: |
            phases/phase-01-run-a-project/evidence/ci/core-loop.log
            apps/web/test-results/
          if-no-files-found: error

  # Stable merge check: matrix gates-test reports success only when every shard passes.
  # Fork PRs with skipped trusted jobs fail closed and require trusted validation.
  backend-required:
    if: always() && github.event_name == 'pull_request'
    needs: [gates-fast, gates-test, native-document-chain, native-runtime-lane, gates-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require applicable backend verification
        env:
          CI_BACKEND_RESULTS: ${{ toJSON(needs) }}
        run: node .harness/scripts/ci-backend-required.mjs

  deploy:
    needs: [gates-fast, gates-test, gates-runtime, e2e-core-loop, native-document-chain, native-runtime-lane]
    # ⚠ 2026-08-06：人类直接要求「消除人工打 tag 这一步」——merge 到 main 就该自动部署，
    # 不再等人记得去打一个 tag。旧注释说「标签是人的显式动作，满足『有 CD 的目标不手动
    # 部署』」——那句话本身没错，但「显式动作」现在改成了 merge 本身（PR review + merge
    # 已经是人的显式动作），不需要再加一道「记得打 tag」。
    # 打 tag 仍然可以触发部署（保留，给需要显式标记发布点的场景用），但不再是唯一路径。
    # Every deployment, including the requested branch preview, requires all gates.
    if: >-
      always() && !cancelled() &&
      needs.gates-fast.result == 'success' && needs.gates-test.result == 'success' &&
      needs.gates-runtime.result == 'success' && needs.e2e-core-loop.result == 'success' &&
      needs.native-document-chain.result == 'success' &&
      needs.native-runtime-lane.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_capabilities_preview &&
        github.ref == 'refs/heads/codex/standard-capabilities'))
    concurrency:
      group: workspacex-devapp-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠ 必须全深度：doctor --strict 用 `git merge-base --is-ancestor <commit> origin/main`
          # 判「passing 的实现是否已在 main 上」（doctor.ts:358）。浅克隆没有 origin/main 这个
          # ref，也没有足够历史 —— 于是**每一个** passing feature 都被判成「还不在 main 上」。
          # 实测：tag v0.1.8-staging 的 gates 报 164 FAIL，而 164 = 22(phase00) + 142(phase01)
          # = 恰好是全部 passing 数；同一份代码本地 `doctor --strict` 是 0 FAIL。
          # 后果不是「多一条红」——deploy job 的条件是 needs: gates，所以 **tag 触发的部署
          # 从来就不可能成功**，devapp 因此长期落后 main 且无人发现（见 #483 / #499）。
          fetch-depth: 0

      - name: 部署并冒烟
        # 走 /usr/local/bin 的副本，不是仓库里那份——sudoers 只许这一条路径。
        # 指仓库那份的话，一个 PR 改掉 deploy.sh 就等于拿到 root。
        # 非特权 wrapper 只调用这一条既有 sudo 命令；它不会执行仓库代码为 root。
        # root deploy 若已进入 step 7 后因冷启动竞态假红，wrapper 用完整稳定后置条件
        # 复核；step 7 之前的失败原样 fail-closed，绝不被健康的旧进程掩盖。
        env:
          # 必须部署本 run 实际验证过的不可变提交。若传 `main`，排队期间后续 merge 会让
          # VM 拉到另一个 SHA，形成「A 的 gates 通过、实际发布 B」的竞态（run 34124013826）。
          DEPLOY_REF: ${{ github.sha }}
        run: bash .harness/scripts/vm/deploy-gate.sh "$DEPLOY_REF"
