# backend-gates.yml —— 需要真 Docker + PostgreSQL 的那套门控。
#
# ⚠ 2026-08-06：`gates` 从自建 runner（`[self-hosted, linux, x64, workspacex]`）
# 改回 GitHub 托管 `ubuntu-latest`。原头注写的理由是「托管 runner 上又慢又贵」——
# 那句话在两个前提都不成立时写下的：① 本仓是**公开仓库**，GitHub 托管 runner 的
# Linux 分钟数对公开仓库是**免费且不限量**的，不存在「贵」；② `harness-verify.yml`
# 的 `fullstack-smoke` job 早就在 `ubuntu-latest` 上跑真实 docker-compose + Postgres
# 起真栈（含 `core-loop.spec.ts` 的浏览器 E2E），本仓自己已经证明「托管 runner 跑不了
# 真 docker」是假的。
#
# 唯一的真实原因是本文件自己 :39 那句——**自建 runner 上跑 fork PR 等于任何人一个
# PR 就能在这台机器上执行任意命令**。但 `gates` 这个 job 不碰任何密钥、不碰生产机器
# （起的是本地一次性 `workspacex-kernel` docker-compose 栈，`deploy` job 才碰真机），
# 放到 GitHub 托管的一次性沙箱上跑，那条风险本来就不存在。
#
# ⇒ 只把不需要真机权限的 `gates` 挪走。`deploy` 仍然钉死在自建 runner
# （`devapp-x64`）——它调用的 `/usr/local/bin/workspacex-deploy` 是那台机器上
# root 拥有的路径，sudoers 只认那一条，挪不动。
#
# 挪走的直接收益：这台自建 runner 长期只有一台，`gates` 在每次 main push + 每个
# PR 上都会跑，过去是全仓库唯一的排队瓶颈——所有 agent 的所有分支都在同一条队列
# 里等同一台机器。挪到 GitHub 托管、并发不限于 1 之后，这条队列基本消失；
# `deploy` 本身还是短的（一次几分钟），单机足够——即使 2026-08-06 起改成每次 main
# push 都触发（不再等人工打 tag），也比 `gates` 频繁不到哪去：同一 ref 的
# concurrency group 保证不会有两个 deploy 同时抢那台机器，最坏情况是排队等一轮，
# 不是竞态。
#
# 触发：main 的每次推送 + 打标签 + 手动。
# `local.env` 的 ANSWER_Q3 原填「打标签时跑」，2026-07-29 按 P-1 改为 main 上也跑：
# 托管 runner 分钟数不要钱，而「只在打标签时跑」意味着问题在发版当天一次性爆出来。
name: backend-gates

on:
  push:
    tags: ["v*"]
    branches: [main]     # 2026-07-29 开启（P-1）：自建 runner 没有分钟数成本，
                         # 「只在打标签时跑」意味着问题在发版当天一次性爆出来
  workflow_dispatch:

# 同一 ref 内只跑一个：`gates` 会 DROP DATABASE，`WORKSPACEX_DB` 按 run id 分库已经
# 做了隔离，但排队更省心，也更容易读日志。挪到托管 runner 后并发度不再受制于
# 「只有一台机器」，这条 concurrency group 现在纯粹是同一 ref 内部的排队，不同 ref
# （不同分支/PR）之间互不影响，各走各的托管 runner 实例。
concurrency:
  group: backend-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # #633（人类新增硬 SLA，2026-08-06）：merge→devapp < 5 分钟。实测基线 8m45s，
  # `gates` 单个 job 占 6m32s，其中 vitest 单测 4m58s（gates 总耗时 76%，最大单项）。
  #
  # ⚠ 三个 job 不是随便切的——切之前逐个确认了「不需要共享上一步留下的状态」：
  #   `verify-rls.sh` / `verify-runtime-gates.sh` / `verify-migrations.sh`
  #   （即 `migrate:check`）三个脚本**各自** `pg_up; pg_reset` 后重新跑迁移
  #   （`lib.sh`），互不依赖 vitest 或彼此的库状态——本来就是从空库重新建的设计，
  #   不是本次拆分才发现能拆。`doctor --strict` / 契约单源 / 洋葱分层三条不碰
  #   Docker/Postgres（纯读 git + 文件）。⇒ 三组各自独立，可以放进不同 job、
  #   不同的托管 runner 实例上真正同时跑，而不只是「看起来分开了」。
  #
  #   之前（PR #574 之前 e2e 那次）以为「拆 job」在这台仓库行不通，那时候
  #   `gates` 还钉在唯一一台自建 runner 上（`devapp-x64`）——拆分只会排队、多付
  #   几次 checkout+install 的固定开销，不会变快。#615 已经把 `gates` 挪到
  #   `ubuntu-latest`（托管 runner，公开仓库并发不限于 1），这个前提今天不成立
  #   了，拆分现在才真正有意义。
  gates-fast:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠ 必须全深度：doctor --strict 用 `git merge-base --is-ancestor <commit> origin/main`
          # 判「passing 的实现是否已在 main 上」（doctor.ts:358）。见下方历史事故记录。
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # #115: 裸 `pnpm --filter api run typecheck` 绕过 turbo.json 的
      # `typecheck: { dependsOn: ["^build"] }`——@repo/fabric-markdown 的类型故意走
      # dist/*.d.ts，`pnpm turbo run` 会先跑它的 #build。
      - name: typecheck / lint
        run: pnpm turbo run typecheck lint --filter=@repo/api

      # --strict：把「passing 的实现必须已合入 main」升为 FAIL。
      # 实测：tag v0.1.8-staging 曾报 164 FAIL（=22 phase00+142 phase01，恰好全部
      # passing 数）——浅克隆没有 origin/main 这个 ref，doctor 把每一条 passing
      # 都判成「还不在 main 上」；deploy 的条件是 needs: gates，后果是 tag 触发的
      # 部署从来就不可能成功（见 #483/#499）。本 job 已用 fetch-depth: 0 排除了它。
      - name: 审计链体检（严格模式）
        run: pnpm harness doctor --strict

      - name: 契约单源 / 洋葱分层
        run: |
          node .harness/scripts/lint-contract-source.mjs
          node .harness/scripts/lint-arch-deps.mjs apps/api/src

  # 2026-08-17：实测这个 job 中位数 17.2min（12 个真实 run 样本，min=13.8/max=18.5），
  # 占 backend-gates 总时长（22m19s 那次实测）的 79%——是整条流水线唯一的瓶颈。
  #
  # 根因：apps/api/vitest.config.ts 的 maxWorkers=1（2026-08-12，#1068/#1090 续作）
  # 强制 584 个测试文件在**同一个 job 里单进程串行**，是当时唯一能立刻堵住"同一
  # postgres 实例被同一进程池打爆连接数"的办法。不能简单调大 maxWorkers 复现那次
  # 事故——那个根因（ADR-106 批次二，卡在"先解决 DB 测试隔离粒度"前置条件）还没解。
  #
  # 这次拆的是 job 级并行，不是进程级：用 vitest 原生的 `--shard <i>/<n>` 把 584
  # 个文件切成 4 份，每份进独立的 GitHub 托管 runner、起自己的 docker-compose
  # postgres 容器（本来就是这么起的，只是现在 4 份各自起一份）。每个 job 内部
  # 仍然是 maxWorkers=1——#1068/#1090 的根因（同一进程池打同一个库）在跨 job 的
  # 独立容器场景里根本不存在，不需要先解决它。
  #
  # 分片探针（本地实测，`vitest list --shard=1/4` vs 不带 --shard）：1/4 分片拿到
  # 1534/5362 条测试用例（约 28.6%，文件测试数不均匀，不是精确四等分，量级对得上）。
  # 理论收益：17.2min → 约 4-5min，整条流水线大概率降到 10 分钟以内。
  gates-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false # 一片红不该掩盖其它片的结果——都跑完，一次性看全部真实失败
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # 分片间必须各自独立的库名，同一 run_id 下 4 个 job 并发起，不加 shard 索引
      # 会撞库名——`WORKSPACEX_DB` 是隔离边界，见 #538。
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}_test_${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 先把容器拉起来，让镜像拉取有自己的一步、日志好读。每个 shard 是独立
      # runner，天然有自己的 docker daemon，容器之间不会互相干扰。
      - name: 起 postgres
        run: docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel up -d postgres

      - name: "单元与集成测试（含 RLS、两层交集、契约响应校验）—— shard ${{ matrix.shard }}/4"
        run: pnpm --filter api exec vitest run --shard=${{ matrix.shard }}/4

      - name: 清掉本次运行的数据库
        if: always()
        run: |
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel exec -T postgres \
            psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS ${WORKSPACEX_DB} WITH (FORCE)" || true

  gates-runtime:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    env:
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}_runtime
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: RLS 强制隔离（反证：绕过应用层过滤跨租户读 0 行）
        run: apps/api/scripts/verify-rls.sh

      - name: 三道运行时门控（双向断言 + 生产不可达）
        run: apps/api/scripts/verify-runtime-gates.sh

      - name: 迁移幂等（无视版本表强制重放）
        run: pnpm --filter api run migrate:check

      - name: 清掉本次运行的数据库
        if: always()
        run: |
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel exec -T postgres \
            psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS ${WORKSPACEX_DB} WITH (FORCE)" || true

  # #633（人类裁决 2026-08-06）：module 测试（`gates`）继续阻塞合并/部署；浏览器 e2e
  # 不再阻塞 PR 合并（见 harness-verify.yml 的 `fullstack-smoke` job），但**必须**阻塞
  # 发布——"发布前必须经过 e2e" 在此之前完全不成立：fullstack-smoke 只在 harness-verify.yml
  # （PR 触发）跑过，`deploy` 的前置条件只有 `gates`（单测/RLS/runtime gates），
  # 从没跑过真浏览器 + 真 docker 栈的 core-loop.spec.ts 那套。
  #
  # 只接入 `core-loop.spec.ts`（不是全部 5+1 个 fullstack-smoke spec）——同一次裁决
  # 紧接着收紧：5 分钟合并→上线 SLA 下等不起另外 5 个 spec，且 #631 报过「核心闭环
  # 步骤 1 被无关 spec 的抖动拖累」。`core-loop.spec.ts` 已在
  # `apps/web/playwright.fullstack-smoke.config.ts` 里拆成独立 project 链（core-loop-seeded
  # → core-loop-reset → core-loop-empty-db），与 `seeded`（其余 5 个 spec）互不 dependencies，
  # `pnpm run verify:core-loop` 只会拉起这条链，不会捎带 `seeded`。
  #
  # 不 `needs: gates`：两个 job 没有先后依赖，能并行就并行。
  #
  # ⚠ 2026-08-06 首次真跑就红：原来写的是 `[self-hosted, linux, x64, workspacex]`，
  # 那台机器上的 CI 用户 `ghrunner` 没有免密 sudo——`playwright install --with-deps`
  # 要装系统级依赖，第一步就是 `sudo apt-get`，直接 `sudo: I'm sorry ghrunner. I'm
  # afraid I can't do that` 退出。这个 job 和 `gates`（见 #615）同一个论证：不碰
  # devapp 真机、不碰密钥，只是起本地一次性 docker 栈 + 真 Chromium，`harness-verify.yml`
  # 的 `fullstack-smoke` 早就在 `ubuntu-latest` 上跑通同一形状的浏览器 e2e——挪过去。
  e2e-core-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - name: 核心闭环八步（唯一接入发布门的浏览器 e2e spec）
        shell: bash
        run: |
          mkdir -p phases/phase-01-run-a-project/evidence/ci
          set +e
          pnpm run verify:core-loop 2>&1 | tee phases/phase-01-run-a-project/evidence/ci/core-loop.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload core-loop evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-gates-core-loop-evidence-${{ github.run_id }}
          path: |
            phases/phase-01-run-a-project/evidence/ci/core-loop.log
            apps/web/test-results/
          if-no-files-found: error

  deploy:
    needs: [gates-fast, gates-test, gates-runtime, e2e-core-loop]
    # ⚠ 2026-08-06：人类直接要求「消除人工打 tag 这一步」——merge 到 main 就该自动部署，
    # 不再等人记得去打一个 tag。旧注释说「标签是人的显式动作，满足『有 CD 的目标不手动
    # 部署』」——那句话本身没错，但「显式动作」现在改成了 merge 本身（PR review + merge
    # 已经是人的显式动作），不需要再加一道「记得打 tag」。
    # 打 tag 仍然可以触发部署（保留，给需要显式标记发布点的场景用），但不再是唯一路径。
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠ 必须全深度：doctor --strict 用 `git merge-base --is-ancestor <commit> origin/main`
          # 判「passing 的实现是否已在 main 上」（doctor.ts:358）。浅克隆没有 origin/main 这个
          # ref，也没有足够历史 —— 于是**每一个** passing feature 都被判成「还不在 main 上」。
          # 实测：tag v0.1.8-staging 的 gates 报 164 FAIL，而 164 = 22(phase00) + 142(phase01)
          # = 恰好是全部 passing 数；同一份代码本地 `doctor --strict` 是 0 FAIL。
          # 后果不是「多一条红」——deploy job 的条件是 needs: gates，所以 **tag 触发的部署
          # 从来就不可能成功**，devapp 因此长期落后 main 且无人发现（见 #483 / #499）。
          fetch-depth: 0

      - name: 部署并冒烟
        # 走 /usr/local/bin 的副本，不是仓库里那份——sudoers 只许这一条路径。
        # 指仓库那份的话，一个 PR 改掉 deploy.sh 就等于拿到 root。
        # 非特权 wrapper 只调用这一条既有 sudo 命令；它不会执行仓库代码为 root。
        # root deploy 若已进入 step 7 后因冷启动竞态假红，wrapper 用完整稳定后置条件
        # 复核；step 7 之前的失败原样 fail-closed，绝不被健康的旧进程掩盖。
        run: bash .harness/scripts/vm/deploy-gate.sh "${{ github.ref_name }}"
