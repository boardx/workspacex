# backend-gates.yml —— 需要真 Docker + PostgreSQL 的那套门控。
#
# ⚠ 2026-08-06：`gates` 从自建 runner（`[self-hosted, linux, x64, workspacex]`）
# 改回 GitHub 托管 `ubuntu-latest`。原头注写的理由是「托管 runner 上又慢又贵」——
# 那句话在两个前提都不成立时写下的：① 本仓是**公开仓库**，GitHub 托管 runner 的
# Linux 分钟数对公开仓库是**免费且不限量**的，不存在「贵」；② `harness-verify.yml`
# 的 `fullstack-smoke` job 早就在 `ubuntu-latest` 上跑真实 docker-compose + Postgres
# 起真栈（含 `core-loop.spec.ts` 的浏览器 E2E），本仓自己已经证明「托管 runner 跑不了
# 真 docker」是假的。
#
# 唯一的真实原因是本文件自己 :39 那句——**自建 runner 上跑 fork PR 等于任何人一个
# PR 就能在这台机器上执行任意命令**。但 `gates` 这个 job 不碰任何密钥、不碰生产机器
# （起的是本地一次性 `workspacex-kernel` docker-compose 栈，`deploy` job 才碰真机），
# 放到 GitHub 托管的一次性沙箱上跑，那条风险本来就不存在。
#
# ⇒ 只把不需要真机权限的 `gates` 挪走。`deploy` 仍然钉死在自建 runner
# （`devapp-x64`）——它调用的 `/usr/local/bin/workspacex-deploy` 是那台机器上
# root 拥有的路径，sudoers 只认那一条，挪不动。
#
# 挪走的直接收益：这台自建 runner 长期只有一台，`gates` 在每次 main push + 每个
# PR 上都会跑，过去是全仓库唯一的排队瓶颈——所有 agent 的所有分支都在同一条队列
# 里等同一台机器。挪到 GitHub 托管、并发不限于 1 之后，这条队列基本消失；
# `deploy` 本身又短又不频繁（只在打 tag 时跑），单机足够。
#
# 触发：main 的每次推送 + 打标签 + 手动。
# `local.env` 的 ANSWER_Q3 原填「打标签时跑」，2026-07-29 按 P-1 改为 main 上也跑：
# 托管 runner 分钟数不要钱，而「只在打标签时跑」意味着问题在发版当天一次性爆出来。
name: backend-gates

on:
  push:
    tags: ["v*"]
    branches: [main]     # 2026-07-29 开启（P-1）：自建 runner 没有分钟数成本，
                         # 「只在打标签时跑」意味着问题在发版当天一次性爆出来
  workflow_dispatch:

# 同一 ref 内只跑一个：`gates` 会 DROP DATABASE，`WORKSPACEX_DB` 按 run id 分库已经
# 做了隔离，但排队更省心，也更容易读日志。挪到托管 runner 后并发度不再受制于
# 「只有一台机器」，这条 concurrency group 现在纯粹是同一 ref 内部的排队，不同 ref
# （不同分支/PR）之间互不影响，各走各的托管 runner 实例。
concurrency:
  group: backend-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    # fork 的 PR 一律不跑：即使托管 runner 是一次性沙箱、不碰密钥，也不该让任意
    # fork 白嫖本仓的 Actions 分钟数（虽然公开仓库不计费，但作业数仍是资源）。
    # 与 `deploy` 那半的「防止执行任意命令」是两个不同的理由，写法一样，动机不同。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    env:
      # 每次运行一个独立数据库。门控会 DROP DATABASE，和部署那套栈
      # （项目名 workspacex、端口 55433）必须够不着彼此。
      WORKSPACEX_DB: wsx_ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠ 必须全深度：doctor --strict 用 `git merge-base --is-ancestor <commit> origin/main`
          # 判「passing 的实现是否已在 main 上」（doctor.ts:358）。浅克隆没有 origin/main 这个
          # ref，也没有足够历史 —— 于是**每一个** passing feature 都被判成「还不在 main 上」。
          # 实测：tag v0.1.8-staging 的 gates 报 164 FAIL，而 164 = 22(phase00) + 142(phase01)
          # = 恰好是全部 passing 数；同一份代码本地 `doctor --strict` 是 0 FAIL。
          # 后果不是「多一条红」——deploy job 的条件是 needs: gates，所以 **tag 触发的部署
          # 从来就不可能成功**，devapp 因此长期落后 main 且无人发现（见 #483 / #499）。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # #115: 裸 `pnpm --filter api run typecheck` 绕过 turbo.json 的
      # `typecheck: { dependsOn: ["^build"] }`。@repo/fabric-markdown 的类型故意走
      # dist/*.d.ts 而不是源码（源码引用 DOM 的 Element/CanvasRenderingContext2D，
      # apps/api 的 tsconfig 只开 lib: ["ES2022"]——见该包 package.json 的 "//types"
      # 注释）；dist/ 不存在时 exports.types 解析失败回落到源码，于是后端 tsc 直接去
      # typecheck 一个浏览器库，炸得莫名其妙。`pnpm turbo run` 会先跑
      # @repo/fabric-markdown#build，和 harness-verify.yml 里已经在用的调用形式一致。
      - name: typecheck / lint
        run: pnpm turbo run typecheck lint --filter=@repo/api

      # 先把容器拉起来，让镜像拉取有自己的一步、日志好读。
      # ⚠ 这不是竞态的修法——修法在 tests/support/db.ts 里（并行调用要能容忍抢输）。
      #   只靠这一步「看起来」也能过，但任何直接跑 vitest 的人又会踩回去。
      - name: 起 postgres
        run: docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel up -d postgres

      - name: 单元与集成测试（含 RLS、两层交集、契约响应校验）
        run: pnpm --filter api exec vitest run

      - name: RLS 强制隔离（反证：绕过应用层过滤跨租户读 0 行）
        run: apps/api/scripts/verify-rls.sh

      - name: 三道运行时门控（双向断言 + 生产不可达）
        run: apps/api/scripts/verify-runtime-gates.sh

      - name: 迁移幂等（无视版本表强制重放）
        run: pnpm --filter api run migrate:check

      # --strict：把「passing 的实现必须已合入 main」升为 FAIL。
      # pre-push 时它只能是 WARN（那时还没合，本来就合不了），CI 才是它能被满足的时点。
      - name: 审计链体检（严格模式）
        run: pnpm harness doctor --strict

      - name: 契约单源 / 洋葱分层
        run: |
          node .harness/scripts/lint-contract-source.mjs
          node .harness/scripts/lint-arch-deps.mjs apps/api/src

      - name: 清掉本次运行的数据库
        # always()：job 被取消时也要清，否则残留库会一直堆到撑爆磁盘。
        if: always()
        run: |
          docker compose -f apps/api/docker-compose.dev.yml -p workspacex-kernel exec -T postgres \
            psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS ${WORKSPACEX_DB} WITH (FORCE)" || true

  # #633（人类裁决 2026-08-06）：module 测试（`gates`）继续阻塞合并/部署；浏览器 e2e
  # 不再阻塞 PR 合并（见 harness-verify.yml 的 `fullstack-smoke` job），但**必须**阻塞
  # 发布——"发布前必须经过 e2e" 在此之前完全不成立：fullstack-smoke 只在 harness-verify.yml
  # （PR 触发）跑过，`deploy` 的前置条件只有 `gates`（单测/RLS/runtime gates），
  # 从没跑过真浏览器 + 真 docker 栈的 core-loop.spec.ts 那套。
  #
  # 只接入 `core-loop.spec.ts`（不是全部 5+1 个 fullstack-smoke spec）——同一次裁决
  # 紧接着收紧：5 分钟合并→上线 SLA 下等不起另外 5 个 spec，且 #631 报过「核心闭环
  # 步骤 1 被无关 spec 的抖动拖累」。`core-loop.spec.ts` 已在
  # `apps/web/playwright.fullstack-smoke.config.ts` 里拆成独立 project 链（core-loop-seeded
  # → core-loop-reset → core-loop-empty-db），与 `seeded`（其余 5 个 spec）互不 dependencies，
  # `pnpm run verify:core-loop` 只会拉起这条链，不会捎带 `seeded`。
  #
  # 不 `needs: gates`：两个 job 没有先后依赖，能并行就并行（跑多快取决于自建 runner 池
  # 容量，不在本次改动范围内）。`deploy` 的前置条件两个都要。
  e2e-core-loop:
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - name: 核心闭环八步（唯一接入发布门的浏览器 e2e spec）
        shell: bash
        run: |
          mkdir -p phases/phase-01-run-a-project/evidence/ci
          set +e
          pnpm run verify:core-loop 2>&1 | tee phases/phase-01-run-a-project/evidence/ci/core-loop.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload core-loop evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-gates-core-loop-evidence-${{ github.run_id }}
          path: |
            phases/phase-01-run-a-project/evidence/ci/core-loop.log
            apps/web/test-results/
          if-no-files-found: error

  deploy:
    needs: [gates, e2e-core-loop]
    # 只有打标签才部署。标签是人的显式动作，这满足 architecture.md
    # 「有 CD 的目标不手动部署」而又不至于每次 push 都动 staging。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, workspacex]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠ 必须全深度：doctor --strict 用 `git merge-base --is-ancestor <commit> origin/main`
          # 判「passing 的实现是否已在 main 上」（doctor.ts:358）。浅克隆没有 origin/main 这个
          # ref，也没有足够历史 —— 于是**每一个** passing feature 都被判成「还不在 main 上」。
          # 实测：tag v0.1.8-staging 的 gates 报 164 FAIL，而 164 = 22(phase00) + 142(phase01)
          # = 恰好是全部 passing 数；同一份代码本地 `doctor --strict` 是 0 FAIL。
          # 后果不是「多一条红」——deploy job 的条件是 needs: gates，所以 **tag 触发的部署
          # 从来就不可能成功**，devapp 因此长期落后 main 且无人发现（见 #483 / #499）。
          fetch-depth: 0

      - name: 部署并冒烟
        # 走 /usr/local/bin 的副本，不是仓库里那份——sudoers 只许这一条路径。
        # 指仓库那份的话，一个 PR 改掉 deploy.sh 就等于拿到 root。
        # 非特权 wrapper 只调用这一条既有 sudo 命令；它不会执行仓库代码为 root。
        # root deploy 若已进入 step 7 后因冷启动竞态假红，wrapper 用完整稳定后置条件
        # 复核；step 7 之前的失败原样 fail-closed，绝不被健康的旧进程掩盖。
        run: bash .harness/scripts/vm/deploy-gate.sh "${{ github.ref_name }}"
