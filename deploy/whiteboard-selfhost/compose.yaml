name: workspacex-board
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PGDATABASE:-workspacex}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?required}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?required}" }
    restart: unless-stopped

  migrate:
    image: ${WORKSPACEX_API_IMAGE:?pin an immutable API image digest}
    command: [pnpm, --filter, "@repo/api", migrate]
    env_file: [.env]
    environment: { PGHOST: postgres, PGPORT: "5432", MIGRATION_DB_USER: postgres }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    image: ${WORKSPACEX_API_IMAGE:?pin an immutable API image digest}
    command: [pnpm, --filter, "@repo/api", start]
    env_file: [.env]
    environment:
      PORT: "3200"
      PGHOST: postgres
      PGPORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
    expose: ["3200"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    image: ${WORKSPACEX_WEB_IMAGE:?pin an immutable Web image digest}
    expose: ["3100"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    ports: ["${HTTP_PORT:-8080}:8080"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, web]
    read_only: true
    tmpfs: [/data, /config]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
